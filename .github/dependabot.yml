version: 2

# ── Dependabot throttling (t/1991) ──────────────────────────────────────────
# 12 ecosystems were previously ALL weekly with aggregate open-PR headroom ~59;
# a 25-PR pile accumulated unnoticed because nothing throttled inflow and no
# process doc drains it. Retuned so an untriaged week is VISIBLE (ecosystems pin
# at low limits) instead of being silently absorbed. Aggregate headroom now ~27.
#   - npm minor/patch are GROUPED (~one PR per dir per week); MAJOR bumps stay
#     individual so each gets 1:1 review.
#   - Low-churn ecosystems (github-actions, docker base images) moved to monthly.
#   - Expected steady state with weekly triage: ~5-8 open dependabot PRs.
# Change the limits here (not by manually closing PRs) if the pile reappears.
#
# ── Incident t/313 (2026-11-11): Actions quota exhausted ──
# Dependabot auto-rebases every open PR whenever main moves; 4 simultaneous rebases at 02:32
# started 117 workflow runs in one minute. So every entry now has `rebase-strategy: disabled`
# (the merge queue tests against current main anyway; for a PR that actually conflicts,
# comment `@dependabot rebase` on it), and limits are lowered (aggregate 20 -> 10).
# Off-peak schedule (t/317): every entry runs between 05:05 and 06:50 UTC, 15 min apart, in
# the quietest hour of the Actions run data (Nov 3-10: ~16 runs/h at 05 UTC vs ~150-195 at
# 12-17 UTC). The slots sit off the round marks that the daily 04:00 and 06:00 workflow crons
# use. So a grouped PR that regenerates (~24 runs each) does it in a quiet window, one
# ecosystem at a time. GitHub treats `time` as best-effort, so a job may start late.
updates:
  # ── npm workspace ROOT — a single entry owns the ENTIRE pnpm workspace ──
  # All workspace members (pnpm-workspace.yaml: taxonomy-editor, lib, poviewer,
  # summary-viewer, workflow-app) share the ONE root pnpm-lock.yaml. A per-app
  # `directory:` entry bumps only that member's package.json and can't reach the
  # root lockfile → ERR_PNPM_OUTDATED_LOCKFILE on frozen install (t/3116;
  # electron 43→44 #1645/#1648/#1649). This single ROOT entry updates member
  # manifests + the shared root lockfile in the SAME PR. Do NOT re-add per-app
  # entries for workspace members.
  #
  # taxonomy-editor additionally carries an in-dir STANDALONE lockfile (Docker
  # prod-deps) + generated license notices; a root-entry bump leaves those stale
  # (test-container / test-electron(taxonomy-editor) red). The companion
  # dependabot-lockfile-heal.yml workflow re-syncs both in-PR (t/3116; SO e/127).
  #
  # lib/debate keeps its OWN entry (below): its root-workspace importer is empty
  # — the root entry never bumps it — so its standalone lockfile is managed only
  # per-directory, no heal needed. (If a future lib/debate bump ever drifts its
  # standalone lockfile, extend sync-standalone-lockfile.mjs to cover it.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:05'  # t/317
      timezone: Etc/UTC
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 3  # t/313: was 6; covers taxonomy-editor majors too
    # undici MAJOR was HELD (t/2053/t/2113/t/2281; #1091) until the pinned Node runtime
    # bundled a newer undici major -- that happened with the t/1990 Node 26 bump (Node 26
    # bundles undici 8.x). The ignore is dropped now that userland undici has moved to ^8.x
    # (landed atomically with ci.yml's node-version bump and the Dockerfiles, t/1990). The
    # assertUndiciMajorInvariant check (githubRestClient.ts) still enforces the alignment
    # going forward -- see undiciInvariant.ts for the mechanism.

  - package-ecosystem: npm
    directory: /lib/debate
    schedule:
      interval: weekly
      day: monday
      time: '05:20'  # t/317
      timezone: Etc/UTC
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /deploy/azure/runner/function
    schedule:
      interval: weekly
      day: monday
      time: '05:35'  # t/317
      timezone: Etc/UTC
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1

  # ── github-actions — monthly (actions rarely change; weekly was noise) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:50'  # t/317
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1

  # ── pip — the PowerShell module's Python helpers (scripts/requirements.txt) ──
  # Grouped: requirements.txt is one logical set (was ungrouped — each bump its
  # own PR). No major-ignore (t/1989): the prior "5.x breaks the embedding
  # pipeline" reason was disproved (5.6.1 is value-stable, bit-identical vectors);
  # the python-embed-smoke CI gate now VALIDATES bumps (cosine vs a pinned
  # reference — reds on real drift or a load/API break), so dependabot may propose
  # majors and the gate decides. An ignore would only hide them.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: '06:05'  # t/317
      timezone: Etc/UTC
    groups:
      pip-deps:
        patterns: ["*"]
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1

  # ── docker — web image + azure base image. Monthly (base images update rarely).
  # Left UNGROUPED deliberately: each directory tracks a SINGLE base image, so a
  # group could never batch more than one PR (one image = one bump).
  # node MAJOR bumps were HELD from t/1990's close (2026-07-30) until Node 26
  # reached Active LTS on 2026-10-28 (nodejs.org) — t/1990 revisit, done. The
  # semver-major ignore is dropped below now that 26 is Active LTS and the base
  # image + app Dockerfile are bumped; node minor/patch (26.x) continue to flow
  # for security patches as before.
  - package-ecosystem: docker
    directory: /taxonomy-editor
    schedule:
      interval: monthly
      time: '06:20'  # t/317
      timezone: Etc/UTC
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /deploy/azure
    schedule:
      interval: monthly
      time: '06:35'  # t/317
      timezone: Etc/UTC
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1

  # Dev container (root Dockerfile): devcontainers/javascript-node + python:3.12-slim-trixie,
  # both digest-pinned (t/270). External bases update through Dependabot, not the
  # ai-triad-base drift workflow (PI decision 3, t/249). Weekly: the image is unhardened and
  # rebuilt often upstream, so digest bumps retire its CVEs sooner.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:50'  # t/317
      timezone: Etc/UTC
    rebase-strategy: disabled  # t/313
    open-pull-requests-limit: 1
    # Python is pinned to 3.12 on purpose (requirements + torch). #5015 auto-merged a
    # 3.12 -> 3.15 tag bump as "semver-minor" and broke the dev build (t/313). Digest
    # refreshes of 3.12 still flow; a Python version move is a deliberate PR.
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
