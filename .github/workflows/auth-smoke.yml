name: Anonymous Auth Smoke (t/4134)

# Asserts the unauthenticated auth surface's positive outcome (operations/devops/azure/Test-EasyAuthSmoke.ps1):
# /healthz 200, anonymous /api/auth/me reports anonymous with write:false, and an anonymous write is
# refused 401/403 — never 2xx.
#
# NO SIGN-IN STEP, on purpose (TL re-scope, t/4134#26): ACA Easy Auth does not implement
# client-directed GitHub sign-in (NotImplementedException, 500 sub-status 74, for any token; proven
# with and without a backed token store, t/4134#25; deploy/azure/runbooks/deployment-facts.md).
# A signed-in smoke would need an Entra test identity (a PI accounts decision, not taken). The t/4132
# class is prevented by the t/4133 deploy gate. This workflow uses no secrets and no environment.
#
# WARN-ONLY by construction: dispatch-only, and nothing (no deploy, no required check) gates on it.
# A failed smoke is a RED run on purpose — no continue-on-error. Wiring it into a deploy or a required
# check is a separate T2 promotion step (Gate Promotion rule).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which app to check'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: auth-smoke-${{ inputs.target }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  anonymous-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Anonymous auth smoke against ${{ inputs.target }}
        shell: pwsh
        env:
          TARGET: ${{ inputs.target }}
        run: |
          $base = switch ($env:TARGET) {
            'production' { 'https://taxonomy-editor.yellowbush-aeda037d.eastus.azurecontainerapps.io' }
            'staging'    { 'https://taxonomy-editor-staging.yellowbush-aeda037d.eastus.azurecontainerapps.io' }
          }
          ./operations/devops/azure/Test-EasyAuthSmoke.ps1 -BaseUrl $base
