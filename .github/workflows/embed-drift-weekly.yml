name: embed-drift-weekly
# Weekly guard against SILENT drift in the embedding stack that the PR-time
# python-embed-smoke job cannot catch (t/1989, TL2 p/300#5). That job is
# paths-filtered on scripts/requirements*.txt — but `transformers`, the library
# that actually encodes, is a TRANSITIVE dependency NOT listed there, and with
# unbounded floors + no lock file the resolved stack drifts between PRs. This runs
# the SAME value-stability assertion (cosine vs the pinned reference) on a
# schedule, so a transitive bump that moves the vectors is caught even when no PR
# touched requirements.txt. Not a required status check — it surfaces drift to
# investigate. The real end state is locking the stack (tracked separately).
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embed-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python deps (CPU-only torch)
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download models (HF availability)
        run: python .github/ci/fetch_embed_models.py
      - name: Assert embedding + NLI value stability (offline — a red here is real drift)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python .github/ci/assert_embed_stability.py
