# ─── SituationBDI Compliance (Live Data) ───
# What:  Runs the live-data SituationBDI ontology compliance check against the
#        ai-triad-data corpus on a daily schedule and on demand. Hard-failing:
#        a regression creates a GitHub issue assigned to the data/PS owner.
#
# Why decoupled from test-powershell (t/2331, t/2324#1):
#   The 435/435 SituationBDI assertion is a DATA-corpus completeness check.
#   Placing it in the required code-merge gate means a situation added without
#   BDI decomposition blocks EVERY unrelated code PR (t/2323 fleet-wide block).
#   Code gates must test code logic; data-state gates must fire on data changes.
#
# Coverage model (replacement, not removal):
#   - This job: daily backstop + on-demand — catches regressions within 24h
#   - Write-time prevention (t/2332): data pipeline validates BDI at commit time
#   - Fixture logic test (tests/): stays in the required gate, tests the CHECK
#     itself (not the corpus) — decoupled from live corpus size
#
# GATE-SIGNAL INTEGRITY: intentionally NOT in ci-gate and NOT a required PR
# context. Failure creates a GitHub issue (explicit, owner-assigned) rather
# than relying on GitHub's scheduled-failure email, which goes to the workflow
# author and is easily filtered/missed (TL condition, t/2331#3).
#
# Test location: tests/data-compliance/ (coordinated with t/2332, p/227#5)
#   ExcludePath in test-powershell gate mirrors this path — see ci.yml.

name: SituationBDI Compliance (Live Data)

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # for gh issue create on failure alert

jobs:
  situation-bdi-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: AI-Rosetta-Stone/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser

      - name: Run SituationBDI live-data compliance check
        id: compliance
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/data-compliance/'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      # ─── Standing asymmetry (t/3671 D2) ──────────────────────────────────
      # ONE canonical alarm: the `data-compliance`-labelled "BDI decomposition
      # violation" issue in ai-triad-data (currently #6). The push gate
      # (ai-triad-data/bdi-boundary-check.yml) may OPEN it on a changed-only
      # violation; only THIS scheduled full-corpus check may CLOSE it, because
      # only a whole-corpus pass has standing to declare all-clear. A changed-
      # only clean push has no standing to close (it saw one node). Two records
      # for one condition give two contradictory answers to "is the corpus
      # compliant?" — so we deliberately use the SINGLE data-repo issue, not a
      # second code-repo one (t/3671#6, root cause of why #6 never closed).
      #
      # CLOSE-AUTHORITY INTEGRITY: a green from the Pester step above is
      # NON-VACUOUS only because tests/data-compliance asserts `442 / 442`
      # (the full expected count). A zero-scan would not match and would fail,
      # so `success()` genuinely means whole-corpus-clean. If that count
      # assertion is ever weakened, this close-authority weakens with it
      # (t/3671#2).
      #
      # CROSS-REPO: the alarm lives in ai-triad-data; this workflow runs in the
      # (busy, auto-disable-immune) code repo — Option A, t/3671#6. It reaches
      # the data-repo issue via AI_TRIAD_DATA_ALARM_TOKEN: a least-priv,
      # non-expiring token scoped to ai-triad-data {issues:write, actions:read},
      # NO contents — shared with the t/3672 scheduled-heartbeat monitor. The
      # default GITHUB_TOKEN cannot cross repos.
      #
      # ASSERT-SUCCESS BOTH ARMS (t/3671 cond 1): a 401/failed close would leave
      # the alarm open — SAFE, but *silently* safe and indistinguishable from a
      # real violation; a failed open would silently drop a real regression. So
      # each arm re-reads the issue state and turns THIS run red with an explicit
      # ::error:: (a distinct signal, surfaced by t/3672) rather than no-oping.
      - name: All-clear — close the alarm on green full-corpus pass (CLOSE authority)
        # Gate on the COMPLIANCE STEP's outcome, not job success() (t/3671#8): an earlier
        # infra/token/checkout failure would skip the compliance step → outcome is neither
        # 'success' nor 'failure' → NEITHER arm fires (no false all-clear, no false alarm) while
        # the job still reds loudly on the infra fault. Job-level if: would fire the wrong arm.
        if: steps.compliance.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AI_TRIAD_DATA_ALARM_TOKEN }}
          DATA_REPO: AI-Rosetta-Stone/ai-triad-data
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUM=$(gh issue list --repo "$DATA_REPO" --label data-compliance --state open \
            --search "BDI decomposition violation" --json number --jq '.[0].number // empty' 2>/dev/null || echo "QUERY_FAILED")
          if [ "$NUM" = "QUERY_FAILED" ]; then
            echo "::error::Could not query the data-compliance alarm in $DATA_REPO — check AI_TRIAD_DATA_ALARM_TOKEN scope/expiry. A failed query must not read as 'nothing to close' (t/3671 cond 1)."
            exit 1
          fi
          if [ -z "$NUM" ]; then
            echo "No open data-compliance alarm — corpus already clean, nothing to close."
            exit 0
          fi
          echo "Corpus clean (442/442). Closing alarm #$NUM."
          gh issue comment "$NUM" --repo "$DATA_REPO" \
            --body "✅ All-clear: full-corpus SituationBDI check passed (442/442 decomposed). Closing per standing-asymmetry close-authority. Run: $RUN_URL" || true
          gh issue close "$NUM" --repo "$DATA_REPO" --reason completed || true
          STATE=$(gh issue view "$NUM" --repo "$DATA_REPO" --json state --jq '.state' 2>/dev/null || echo "VIEW_FAILED")
          if [ "$STATE" != "CLOSED" ]; then
            echo "::error::Close of alarm #$NUM did NOT take (state=$STATE). The corpus is CLEAN but the all-clear could not be recorded — check AI_TRIAD_DATA_ALARM_TOKEN scope/expiry. This red is a CLOSER failure, NOT a corpus violation."
            exit 1
          fi
          echo "Alarm #$NUM closed."

      - name: Alarm — open/reopen the alarm on regression (OPEN authority, same issue as push)
        # Gate on the compliance STEP's failure, not job failure() (t/3671#8) — so a token/infra
        # failure (which skips the compliance step) does NOT manufacture a data-violation alarm.
        # `failure() &&` is REQUIRED: an `if:` with no status function gets an implicit success(),
        # so after the compliance step fails this arm was SKIPPED -- the open arm could never fire
        # (live: run 37118348887, compliance=failure, this step=skipped). failure() is true here
        # only because a step failed; the outcome check still pins it to the COMPLIANCE step.
        if: failure() && steps.compliance.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.AI_TRIAD_DATA_ALARM_TOKEN }}
          DATA_REPO: AI-Rosetta-Stone/ai-triad-data
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="Scheduled full-corpus SituationBDI check FAILED — the corpus has situation(s) without BDI decomposition.

          **Action (data/situation owner):** find the situations missing per-POV BDI nodes and decompose them, then push. This check closes the alarm automatically once the full corpus passes (442/442). Write-time prevention: t/3011.

          Run: $RUN_URL"
          gh label create "data-compliance" --repo "$DATA_REPO" --color "e4e669" \
            --description "Data corpus compliance regression" 2>/dev/null || true
          NUM=$(gh issue list --repo "$DATA_REPO" --label data-compliance --state all \
            --search "BDI decomposition violation" --json number --jq '.[0].number // empty' 2>/dev/null || echo "QUERY_FAILED")
          if [ "$NUM" = "QUERY_FAILED" ]; then
            echo "::error::Could not query the data-compliance alarm in $DATA_REPO — check AI_TRIAD_DATA_ALARM_TOKEN scope/expiry. A real corpus violation exists but the alarm state is unknown (t/3671 cond 1)."
            exit 1
          fi
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$DATA_REPO" --body "$BODY" || true
            gh issue reopen "$NUM" --repo "$DATA_REPO" 2>/dev/null || true
          else
            gh issue create --repo "$DATA_REPO" \
              --title "Data boundary: BDI decomposition violation" \
              --body "$BODY" --label data-compliance --assignee jpsnover || true
            NUM=$(gh issue list --repo "$DATA_REPO" --label data-compliance --state open \
              --search "BDI decomposition violation" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          fi
          STATE=$(gh issue view "$NUM" --repo "$DATA_REPO" --json state --jq '.state' 2>/dev/null || echo "VIEW_FAILED")
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::Failed to open/reopen the data-compliance alarm in $DATA_REPO (num='$NUM' state=$STATE). A real corpus violation exists but the alarm could NOT be raised — check AI_TRIAD_DATA_ALARM_TOKEN scope/expiry."
            exit 1
          fi
          echo "Alarm #$NUM open for the corpus violation."
