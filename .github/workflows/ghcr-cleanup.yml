# ─── GHCR Cleanup ───
# What:  Deletes untagged container images older than 30 days from GHCR to
#        control storage costs. Keeps the 5 most recent untagged images.
# Before: Runs weekly on Sunday at 04:00 UTC or manually. No prerequisites.
# After:  Old untagged images are deleted. Tagged images (releases) are preserved.

name: GHCR Cleanup

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly, Sunday 4 AM UTC
  workflow_dispatch:

permissions:
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OWNER: ai-rosetta-stone
jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - taxonomy-editor
          - ai-triad-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Delete untagged images older than 30 days
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Result = Remove-StaleContainerImages -Owner "${{ env.OWNER }}" -Package "${{ matrix.package }}" -OlderThanDays 30 -KeepLatest 5 -Confirm:$false
          $Result
          if ($Result.Failures.Count -gt 0) {
            Write-Host "::warning::$($Result.Failures.Count) version(s) failed to delete (may require admin scope)"
          }
          Write-Host "Done — deleted $($Result.DeletedCount) untagged versions"
