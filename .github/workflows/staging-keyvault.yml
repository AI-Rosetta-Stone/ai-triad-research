# t/92 (TL p/12#227, SO p/44#99; Security t/626). Staging-only deploy of deploy/azure/staging-keyvault.bicep.
# Dispatch-only. It never runs main.bicep and never touches the shared vault kv-ait-kvwl3nywge4iw. It creates
# exactly the staging vault, its audit diagnostics and ONE role (staging's identity, Secrets Officer, on that
# vault only). The what-if guard refuses anything else. On a clean what-if, the TL's approval of the PR that
# adds this workflow is the go for its first apply (TL p/12#227).
#
# Runbook (SO p/44#102): this is a ONE-TIME create. Once the vault exists, a second run's what-if shows
# NoChange instead of three Creates, and the guard stops it (fail closed, by design). A later change to the
# vault is a reviewed edit to staging-keyvault.bicep (a gate file) with an updated guard, not a re-run.
name: Staging Key Vault (t/92)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'what-if (read-only, default) or apply (creates kv-ait-stg-kvwl3nywge4iw, its diagnostics and one role only)'
        required: true
        default: what-if
        type: choice
        options: [what-if, apply]
      confirm:
        description: 'For apply only: type APPLY-STAGING-KEYVAULT exactly'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-keyvault
  cancel-in-progress: false

jobs:
  deploy:
    name: "kv-ait-stg-kvwl3nywge4iw (${{ inputs.mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      AZ_RG: ai-triad
      TEMPLATE: deploy/azure/staging-keyvault.bicep
      STAGING_VAULT: kv-ait-stg-kvwl3nywge4iw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: main

      - name: "Guard: apply needs the typed confirmation"
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APPLY-STAGING-KEYVAULT" ]; then
            echo "::error::apply requires confirm=APPLY-STAGING-KEYVAULT. Nothing run."; exit 1
          fi

      - name: "Guard: template is the staging vault module only"
        run: |
          test -f "$TEMPLATE"
          if grep -qi "main.bicep" "$TEMPLATE" || grep -q "kv-ait-kvwl3nywge4iw" "$TEMPLATE"; then
            echo "::error::the staging module must not reference main.bicep or the shared vault kv-ait-kvwl3nywge4iw."; exit 1
          fi

      - name: "Azure login (OIDC, the same repo secrets as deploy-azure.yml)"
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Read staging's identity (the one principal the role may grant)"
        id: principal
        run: |
          # SO p/44#102: the role must grant staging's identity and no other. Read ONCE, live, and pass the same
          # value to the template, the guard and the apply. Empty or not a GUID stops here.
          P=$(az containerapp show -n taxonomy-editor-staging -g "$AZ_RG" --query identity.principalId -o tsv)
          if ! printf '%s' "$P" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::could not read taxonomy-editor-staging's identity.principalId as a GUID (got '${P}'). Nothing run."; exit 1
          fi
          echo "id=$P" >> "$GITHUB_OUTPUT"

      - name: "What-if (read-only), then parse the JSON changeType values and the role's principal"
        env:
          STAGING_PRINCIPAL: ${{ steps.principal.outputs.id }}
        run: |
          # The principal is a template parameter (not reference(existing).identity.principalId, which what-if
          # leaves unresolved -- run 45648410756), so the what-if shows the actual id and the guard compares it.
          az deployment group what-if -g "$AZ_RG" -f "$TEMPLATE" --parameters stagingPrincipalId="$STAGING_PRINCIPAL" \
            --no-pretty-print -o json > whatif.json
          node operations/devops/staging-keyvault-whatif-guard.mjs whatif.json "$STAGING_PRINCIPAL"

      - name: "Apply (staging vault, its diagnostics and one role only; mode=apply, confirmed, guard passed)"
        if: inputs.mode == 'apply' && inputs.confirm == 'APPLY-STAGING-KEYVAULT'
        env:
          STAGING_PRINCIPAL: ${{ steps.principal.outputs.id }}
        run: |
          az deployment group create -g "$AZ_RG" -f "$TEMPLATE" --parameters stagingPrincipalId="$STAGING_PRINCIPAL"
          # Read-back: the vault, and the role assignments on it (expect exactly staging's Secrets Officer).
          az keyvault show -n "$STAGING_VAULT" -g "$AZ_RG" \
            --query "{uri:properties.vaultUri,rbac:properties.enableRbacAuthorization,purgeProtection:properties.enablePurgeProtection}" -o json
          VAULT_ID=$(az keyvault show -n "$STAGING_VAULT" -g "$AZ_RG" --query id -o tsv)
          az role assignment list --scope "$VAULT_ID" --query "[].{role:roleDefinitionName,principal:principalId,type:principalType}" -o table
