name: foreign-commit-check

# Ticketed branch-ancestry-inheritance detector (t/3738). Prevention for the PR #2521 /
# `007a5136` incident: a PR described as a one-file catalog fix carried three other agents'
# commits because the worktree that produced it branched from a stale shared HEAD instead of
# origin/main, and merged clean with no conflict.
#
# WARN-ONLY / ADVISORY. `continue-on-error: true` below means this step can NEVER fail the job
# or block a merge, regardless of what the predicate concludes. Promotion to a blocking gate is a
# separate, later change requiring its own mandatory Second Opinion consult (root AGENTS.md) and
# at least one green cycle observing real PRs first (Gate Promotion discipline) — do not remove
# continue-on-error without that separate step.
#
# RESIDUAL (state exactly this — do not overclaim, and never "rare" — measured, it isn't):
# catches TICKETED foreign commits (a commit subject carrying a t/NNNN-shaped ref disjoint from
# this PR's own ticket) and MERGE commits in range. It is BLIND to a ref-less, non-merge foreign
# commit — ref-less subjects run ~15% of recent main commits (9/60, measured 2026-09-29); Option B
# (merge-commit detection) catches the ref-less MERGE subset, so the true blind spot is ref-less
# NON-merge foreign commits only, and that subset is ordinary (docs/lessons commits, dep bumps,
# UI fixes), not exotic. See operations/devops/worker/foreign-commit-predicate.mjs for the full
# design notes and t/3738 for the rounds of hardening that produced this spec.
#
# EXPECTED-REF SOURCE: the PR title (github.event.pull_request.title). A PR whose title carries
# no t/NNNN ref is treated as a no-ticket PR and fires (clearable via the opt-out below) rather
# than silently skipping the check.
#
# OPT-OUT for genuine multi-ticket PRs (or a no-ticket PR that is intentionally ticket-less):
# add the `multi-ticket` label to the PR. This is a coarse, PR-wide override — it silences the
# whole check for that PR, not just the specific commit that triggered it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Full history is required: merge-base against origin/main must resolve, and a shallow
          # checkout (the default fetch-depth: 1) is exactly the condition that makes the range
          # unresolvable — which the predicate treats as "cannot evaluate", never "clean" (t/3738#2).
          fetch-depth: 0

      - name: Run foreign-commit predicate (warn-only)
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          OPTED_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'multi-ticket') && '1' || '0' }}
        run: |
          node operations/devops/worker/foreign-commit-predicate.mjs "$PR_TITLE" "$OPTED_OUT"

      # t/314 (t/313 observability): CANONICAL COPY of this step lives in
      # operations/devops/rate-limit-snapshot-step.yml; operations/devops/rate-limit-snapshot-step.test.mjs
      # fails if a guard's copy drifts. Some guards have no checkout, so the step is inline.
      # Records how much of the GITHUB_TOKEN installation quota (REST core + GraphQL) is used at
      # the end of this job. GET /rate_limit does not count against the quota. Never fails the job.
      - name: Rate-limit snapshot (t/314)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api rate_limit --jq '[.resources.core.used, .resources.core.remaining, .resources.core.limit, .resources.core.reset, .resources.graphql.used, .resources.graphql.remaining, .resources.graphql.limit] | @tsv' 2>&1) \
            && read -r cu cr cl creset gu gr gl <<<"$out" && [[ "$cu$cr$cl$creset$gu$gr$gl" =~ ^[0-9]+$ ]]; then
            reset=$(date -u -d "@$creset" +%H:%M:%SZ 2>/dev/null || echo "$creset")
            echo "t/314 rate-limit: workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB core used=$cu remaining=$cr limit=$cl reset=$reset graphql used=$gu remaining=$gr limit=$gl"
            {
              echo "### GITHUB_TOKEN rate limit at end of job (t/314)"
              echo ""
              echo "| API | used | remaining | limit |"
              echo "|---|---|---|---|"
              echo "| REST core | $cu | $cr | $cl |"
              echo "| GraphQL | $gu | $gr | $gl |"
              echo ""
              echo "REST core window resets at $reset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::t/314: could not read GET /rate_limit, so no rate-limit snapshot for this job (${out:-no output})."
          fi
