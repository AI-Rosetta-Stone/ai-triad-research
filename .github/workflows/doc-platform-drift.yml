name: doc-platform-drift

# Doc-vs-platform drift detector (t/3797). Prevention for the e/227 incident: three
# docs + a skill restated `enforce_admins=false` / admin-bypass-works / a stale
# required-context list for ~2 days after t/3736 flipped `enforce_admins:true` to
# live — found by two reviewers reading the files for unrelated reasons, not by any
# check. "Detected by luck" was the gap this closes.
#
# WARN-ONLY / ADVISORY. `continue-on-error: true` below means this step can NEVER
# fail the job or block a merge. Promotion to a blocking gate is a separate, later
# change requiring its own mandatory Second Opinion consult (root AGENTS.md) and at
# least one green cycle observing real PRs first (Gate Promotion discipline).
#
# SCOPE BOUNDARY (state exactly this — do not overclaim, t/3797#2): this check
# closes DRIFT-FROM-PLATFORM — a literal claim about branch-protection config
# (enforce_admins, admin-bypass, required-context lists/counts) that disagrees with
# the live `gh api …/branches/main/protection` snapshot at check time. It does NOT
# catch:
#   - doc-vs-doc self-contradiction with no platform fact to diff against (the
#     *founding* defect class in this repo's history)
#   - stale claims about things with no queryable source (e.g. "the
#     pre-self-merge-verify hook BLOCKS" — loaded != enforcing has no API; only a
#     live fire discriminates, t/3695)
#   - `.orca/skills/**` content — overlay-tracked (separate `.orca-git` repo), NOT
#     present in this checkout, so this workflow structurally cannot see it. The
#     land-from-worktree skill (the original drift site) is in this blind spot.
#
# See operations/devops/worker/doc-platform-drift-predicate.mjs for the full claim
# taxonomy and t/3797 for the fixture set this was built and tested against.
#
# TWO TRIGGERS, two different failure modes (Lead review, PR #2623):
#   - `pull_request` catches a NEW doc edit introducing a stale platform claim —
#     visible as this job's own red annotation on that PR.
#   - `schedule` (daily) catches the OTHER direction: the platform itself changing
#     underneath an UNCHANGED doc (the exact t/3736 incident — the enforce_admins
#     flip landed with no doc edit in the same PR, so pull_request-only coverage
#     would never have caught it). A schedule run has no PR to attach a red
#     annotation to, so it raises its own idempotent issue instead (mirrors
#     required-contexts-drift.yml / t/3741's pattern).

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'AGENTS.md'
  schedule:
    - cron: '43 7 * * *'   # daily 07:43 UTC — platform-config drift is low-frequency
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DRIFT_LABEL: doc-platform-drift

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Run doc-platform-drift predicate (warn-only)
        id: drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node operations/devops/worker/doc-platform-drift-predicate.mjs | tee drift-output.txt

      # Schedule-only alert: a pull_request fire is already visible as this job's own
      # red annotation on that PR; a schedule fire has no PR, so it needs its own
      # durable, idempotent signal or it is exactly as invisible as the bug it exists
      # to catch (the t/3695/t/3738 "silent observability" lesson, applied here).
      - name: Route drift verdict (schedule only)
        if: github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.drift.outcome }}';
            let output = '';
            try { output = fs.readFileSync('drift-output.txt', 'utf8'); } catch { output = '(no output captured)'; }
            const owner = context.repo.owner, repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const label = process.env.DRIFT_LABEL;
            const ts = new Date().toISOString();
            const detail = `\`\`\`\n${output.slice(0, 4000)}\n\`\`\`\n\n- **Run:** ${runUrl}\n- **Time:** ${ts}`;

            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 10 });

            if (outcome === 'failure') {
              const body = `## Doc-vs-platform drift found on scheduled sweep (t/3797)\n\nA committed doc restates branch-protection config that disagrees with the live API, with no corresponding doc PR to catch it at review time — this is the platform-changed-underneath-an-unchanged-doc direction.\n\n**Scope:** drift-from-platform only (see the workflow's own header). Fix the doc's wording to match live \`gh api …/branches/main/protection\`.\n\n${detail}`;
              if (existing.data.length > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.data[0].number, body: `Still present at ${ts}.\n\n${detail}` });
              } else {
                await github.rest.issues.create({ owner, repo, title: 'Doc-vs-platform drift detected (scheduled sweep)', body, labels: [label, 'alert-escalated'] });
              }
            } else {
              for (const issue of existing.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Resolved — clean sweep at ${ts}.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }
