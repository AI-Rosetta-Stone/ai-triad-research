# ─── Health Monitor ───
# What:  Checks the production app's /health and /api/data/available endpoints
#        every 15 minutes. Creates a GitHub issue on failure, auto-closes on recovery.
# Before: Runs on schedule. The production app must be deployed and accessible.
# After:  If unhealthy, a GitHub issue with label "health-alert" is created.
#         Investigate container logs and redeploy if needed.
#
# COLD-START SKIP: prod scales to 0 replicas when idle (minReplicas: 0, main.bicep). An HTTP probe
# against a scaled-to-zero app would either cold-start it (defeating the point of scaling to zero)
# or time out and read as DOWN — neither is correct, since a cold app is healthy, just idle. The
# health-check job reads the active replica count from the ARM API FIRST and skips the HTTP probe
# entirely when it's 0, treating that as healthy without ever sending a request.

name: Health Monitor

# Schedule re-registered 2026-10-12 after the AI-Rosetta-Stone org move: crons stopped firing silently (t/4173).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # t/4501: off round-minute marks, GitHub's congestion peak
  workflow_dispatch:
    inputs:
      gv_inject_missing:
        description: 'Gate-verification: inject a nonexistent workflow to prove the staleness/fail-loud alarm fires (t/3672)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read  # list-workflow-runs for the schedule-staleness heartbeat (t/3672)
  packages: read  # GHCR version query for the known-good-liveness check (t/4170 ask 3)
  id-token: write  # for Azure OIDC login (cold-start replica check)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_URL: https://taxonomy-editor.yellowbush-aeda037d.eastus.azurecontainerapps.io
  CONTAINER_APP_NAME: taxonomy-editor
  RESOURCE_GROUP: ai-triad

jobs:
  health-check:
    runs-on: ubuntu-latest
    # t/4340 step 2: a dedicated, Reader-only identity (github-ai-triad-monitor), federated to
    # this environment (main-only branch policy, live-fire-proven) -- never the full
    # Contributor+UAA deploy identity a 15-minute cron has no business holding.
    environment: monitoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Log in to Azure
        id: azlogin
        continue-on-error: true  # t/4340: a login failure must not take down the HTTP probe below
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.MONITOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MONITOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MONITOR_AZURE_SUBSCRIPTION_ID }}

      - name: Check health and data endpoints
        id: health
        shell: pwsh
        run: |
          # Cold-start skip: read the ARM-reported replica count BEFORE touching the app's own
          # HTTP endpoints. A revision not found (app fully scaled to 0, no active revision at
          # all) is the same "cold" case as a revision with 0 replicas — both skip the probe.
          # t/4340: the Azure login above is continue-on-error, so a login failure must NOT be
          # read as "0 replicas" (that would silently report a down app as healthy-and-cold). A
          # query that fails for any reason (not logged in, ARM error, etc.) is UNKNOWN, not cold
          # — it WARNs and falls through to the HTTP probe, same as if the login had never run.
          $QueryOk = $false
          $ActiveRevision = $null
          $ReplicaCount = 0
          if ('${{ steps.azlogin.outcome }}' -eq 'success') {
            $ActiveRevision = az containerapp show --name '${{ env.CONTAINER_APP_NAME }}' -g '${{ env.RESOURCE_GROUP }}' `
              --query 'properties.latestReadyRevisionName' -o tsv 2>$null
            if ($LASTEXITCODE -eq 0) {
              if ($ActiveRevision) {
                $ReplicaJson = az containerapp replica list --name '${{ env.CONTAINER_APP_NAME }}' -g '${{ env.RESOURCE_GROUP }}' `
                  --revision $ActiveRevision -o json 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $ReplicaCount = @($ReplicaJson | ConvertFrom-Json).Count
                  $QueryOk = $true
                }
              } else {
                # confirmed: no active revision at all — genuinely cold, not a query failure
                $QueryOk = $true
              }
            }
          }

          if (-not $QueryOk) {
            Write-Host "::warning title=t/4340 cold-check skipped::Azure login outcome=${{ steps.azlogin.outcome }}; cold-replica check skipped, HTTP probe ran"
          } else {
            Write-Host "Active revision: $ActiveRevision — replica count: $ReplicaCount"
            if ($ReplicaCount -eq 0) {
              Write-Host "App is scaled to 0 (cold) — this is healthy, not down. Skipping the HTTP probe."
              Add-Content -Path $env:GITHUB_OUTPUT -Value "failures=0"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "cold=true"
              exit 0
            }
          }

          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Failures = 0
          for ($i = 1; $i -le 3; $i++) {
            # Test-TaxEditorHealth covers /health + /healthz in one probe (t/1495);
            # /api/data/available is a third endpoint the cmdlet doesn't cover, kept as its own curl check.
            $Result = Test-TaxEditorHealth -BaseUrl "${{ env.APP_URL }}" -TimeoutSec 10
            $DataStatus = try { (Invoke-RestMethod -Uri "${{ env.APP_URL }}/api/data/available" -TimeoutSec 10) } catch { 'error' }
            if (-not $Result.Healthy -or $DataStatus -ne $true) {
              $Failures++
              Write-Host "Attempt $i failed (healthy: $($Result.Healthy), data: $DataStatus)"
            } else {
              Write-Host "Attempt $i passed (healthy: true, data: available)"
            }
            if ($i -lt 3) { Start-Sleep -Seconds 30 }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "failures=$Failures"
          if ($Failures -eq 3) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=false"
            exit 1
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=true"
          }

      - name: Create issue on sustained failure
        if: failure() && steps.health.outputs.healthy == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // Check for existing open issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-alert',
              per_page: 1
            });

            if (existing.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing at ${new Date().toISOString()} — 3/3 health checks failed.`
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Health check failure: taxonomy-editor unreachable`,
                body: [
                  `## Health Check Alert`,
                  ``,
                  `The Taxonomy Editor health endpoint failed 3 consecutive checks.`,
                  ``,
                  `- **URL:** \`${process.env.APP_URL}/health\``,
                  `- **Time:** ${new Date().toISOString()}`,
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  ``,
                  `### Troubleshooting`,
                  ``,
                  '```bash',
                  `az containerapp show --name taxonomy-editor -g ai-triad --query "properties.runningStatus"`,
                  `az containerapp logs show --name taxonomy-editor -g ai-triad --type console`,
                  '```',
                  ``,
                  `Close this issue once the app is back online.`
                ].join('\n'),
                labels: ['health-alert', 'bug', 'alert-escalated']
              });
              console.log('Created new health alert issue');
            }

      - name: Auto-close resolved issues
        if: steps.health.outputs.healthy == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-alert',
              per_page: 5
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved at ${new Date().toISOString()} — health check passing again.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              console.log(`Auto-closed issue #${issue.number}`);
            }

  schedule-staleness:
    # Watches tracked scheduled workflows for SILENCE (a cron that stopped firing) — the failure
    # mode a workflow cannot detect about itself (t/3672). Same-repo only: default GITHUB_TOKEN +
    # actions:read. compliance-live.yml already self-alerts on its RED conclusion; this covers the
    # ABSENCE case (auto-disable after 60d repo inactivity, rename, broken YAML, disabled cron).
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat — assert tracked scheduled workflows ran within their window
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // Drop-in: add { file, maxAgeHours }. Freshness is asserted on the SCHEDULE event only,
            // so a manual dispatch cannot mask a dead cron.
            const TRACKED = [
              // 36h = 24h daily + 12h slack. Measured (t/3672#9): GitHub throttles the 0 6 * * *
              // cron to ~10:40-12:47 UTC; worst observed inter-run gap ~25.5h. 36h avoids false
              // alarms on normal throttling while still catching a genuine multi-day silence.
              { file: 'compliance-live.yml', maxAgeHours: 36 },
            ];
            // GV arm: a workflow_dispatch with gv_inject_missing=true adds a nonexistent workflow,
            // proving the fail-loud path ALARMS (a query failure / not-found must never read healthy).
            if (context.payload.inputs && context.payload.inputs.gv_inject_missing === 'true') {
              TRACKED.push({ file: '__nonexistent_gv_probe__.yml', maxAgeHours: 30 });
            }
            const alarms = [];
            for (const t of TRACKED) {
              try {
                const res = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: t.file,
                  event: 'schedule',
                  per_page: 1,
                });
                const runs = (res.data && res.data.workflow_runs) || [];
                if (runs.length === 0) {
                  alarms.push(`${t.file}: no scheduled runs found (missing/renamed/never-fired) — cannot confirm freshness`);
                  continue;
                }
                const ts = Date.parse(runs[0].created_at);
                if (!Number.isFinite(ts)) {
                  alarms.push(`${t.file}: last-run timestamp unparseable ('${runs[0].created_at}')`);
                  continue;
                }
                const ageH = (Date.now() - ts) / 3600000;
                if (ageH > t.maxAgeHours) {
                  alarms.push(`${t.file}: STALE — last scheduled run ${ageH.toFixed(1)}h ago (max ${t.maxAgeHours}h)`);
                }
              } catch (e) {
                // fail-loud (t/3672#2): auth failure / not-found / API error must ALARM, never green
                alarms.push(`${t.file}: QUERY FAILED (${e.status || '?'} ${e.message}) — cannot confirm freshness, treating as UNHEALTHY`);
              }
            }
            const LABEL = 'schedule-staleness';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 5,
            });
            if (alarms.length > 0) {
              const list = alarms.map(a => `- ${a}`).join('\n');
              if (open.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.data[0].number,
                  body: `Still alarming at ${new Date().toISOString()}:\n\n${list}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: 'Scheduled-workflow staleness detected',
                  body: [
                    '## Scheduled-workflow staleness / heartbeat alarm',
                    '',
                    'A tracked scheduled workflow is not reporting fresh scheduled runs:',
                    '',
                    list,
                    '',
                    `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                    '',
                    "Likely causes: cron auto-disabled (60d repo inactivity), workflow renamed/deleted, broken YAML, or an actions:read query failure. Check the workflow's Actions tab.",
                  ].join('\n'),
                  labels: [LABEL, 'bug', 'alert-escalated'],
                });
              }
              core.setFailed(alarms.join('; '));
            } else {
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved at ${new Date().toISOString()} — all tracked scheduled workflows reporting fresh.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                });
              }
            }

  known-good-liveness:
    # t/4170 ask 3: the known-good GHCR tag (Restore-TaxEditorKnownGood's rollback target) is
    # manual-only to SET (Set-TaxEditorKnownGood is never called from CI — t/4170#1) and had
    # silently never been set across the org move. This watches for that going forward:
    # missing entirely, or present but stale (more than MaxDeploysBehind newer deploys past it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check known-good tag liveness
        id: knowngood
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          . ./operations/devops/Get-KnownGoodLivenessVerdict.ps1
          $Verdict = Test-TaxEditorKnownGoodLiveness
          Write-Host ($Verdict | ConvertTo-Json)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "pass=$($Verdict.Pass.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "message=$($Verdict.Message)"
          if (-not $Verdict.Pass) { exit 1 }

      - name: Create issue on known-good liveness failure
        if: failure() && steps.knowngood.outputs.pass == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const LABEL = 'known-good-stale';
            const message = `${{ steps.knowngood.outputs.message }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing at ${new Date().toISOString()}: ${message}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'known-good GHCR tag is missing or stale',
                body: [
                  '## known-good liveness alarm',
                  '',
                  message,
                  '',
                  '`Restore-TaxEditorKnownGood` has no (or a stale) rollback target.',
                  '',
                  `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Run `Set-TaxEditorKnownGood` against the current production revision (t/4170).',
                ].join('\n'),
                labels: [LABEL, 'bug', 'alert-escalated'],
              });
            }

      - name: Auto-close resolved known-good issues
        if: steps.knowngood.outputs.pass == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'known-good-stale', per_page: 5,
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved at ${new Date().toISOString()} — known-good is fresh again.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

  staging-load-test-size-drift:
    # t/4203 SO C2 (p/682#44): stagingLoadTestSize's "auto-revert" claim doesn't hold — ordinary
    # deploy-staging runs never apply Bicep, so staging stays prod-sized (2 vCPU/4Gi x up to 3
    # replicas, mounting the RO shared volume) until the next PROD Bicep apply, which can be days
    # away while a deploy hold is active. This detects that drift directly against live Azure and
    # escalates if it persists, since nothing actually reverts it automatically.
    runs-on: ubuntu-latest
    # t/4340 step 2: same Reader-only monitoring identity as health-check -- this job only ever
    # reads containerapp properties, never a reason to hold the Contributor+UAA deploy identity.
    environment: monitoring
    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.MONITOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MONITOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MONITOR_AZURE_SUBSCRIPTION_ID }}

      - name: Check staging's live size against its small-footprint default
        id: sizecheck
        shell: pwsh
        run: |
          $Info = az containerapp show --name taxonomy-editor-staging -g '${{ env.RESOURCE_GROUP }}' `
            --query '{cpu:properties.template.containers[0].resources.cpu,maxReplicas:properties.template.scale.maxReplicas}' `
            -o json 2>$null | ConvertFrom-Json
          # t/4203 SO C2b (p/682#46): a $null $Info (query failed) must NOT read as "not drifted" —
          # that would make the auto-close step below CLOSE a genuinely open drift issue on a
          # transient Azure error. Tri-state output instead: both the open/escalate step and the
          # auto-close step are gated on an exact 'true'/'false' match, so 'unknown' naturally
          # skips both.
          $Drifted = if ($null -eq $Info) { 'unknown' } elseif ([double]$Info.cpu -gt 0.25) { 'true' } else { 'false' }
          Write-Host "staging cpu=$($Info.cpu) maxReplicas=$($Info.maxReplicas) drifted=$Drifted"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "drifted=$Drifted"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cpu=$($Info.cpu)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "maxReplicas=$($Info.maxReplicas)"

      - name: Open or update the drift issue, escalate if it persists
        if: steps.sizecheck.outputs.drifted == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const LABEL = 'staging-load-test-size-drift';
            const ESCALATE_AFTER_HOURS = 6;
            const cpu = `${{ steps.sizecheck.outputs.cpu }}`;
            const maxReplicas = `${{ steps.sizecheck.outputs.maxReplicas }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 1,
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Staging is prod-sized (t/4203 load-test sizing left on)',
                body: [
                  '## Staging load-test-size drift (t/4203)',
                  '',
                  `Detected at ${new Date().toISOString()}: cpu=${cpu}, maxReplicas=${maxReplicas} (small footprint is cpu=0.25, maxReplicas=1).`,
                  '',
                  'Ordinary `deploy-staging` runs never apply Bicep, so this does NOT revert on its own — it reverts only on the next `deploy-azure.yml` run (prod Bicep apply).',
                  '',
                  '**To revert explicitly now:** dispatch `deploy-azure.yml` with `staging_load_test_size: false` (same input used to turn it on). This still re-applies the full template — check for an active prod deploy hold first.',
                  '',
                  `This issue stays open and is escalated (\`alert-escalated\`) if it persists past ${ESCALATE_AFTER_HOURS}h.`,
                ].join('\n'),
                labels: [LABEL],
              });
              return;
            }
            const issue = existing.data[0];
            const ageHours = (Date.now() - new Date(issue.created_at).getTime()) / 3600000;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `Still drifted at ${new Date().toISOString()} (${ageHours.toFixed(1)}h since first detected): cpu=${cpu}, maxReplicas=${maxReplicas}.`,
            });
            const hasEscalated = (issue.labels || []).some((l) => (l.name || l) === 'alert-escalated');
            if (ageHours > ESCALATE_AFTER_HOURS && !hasEscalated) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: ['alert-escalated'],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔺 **ESCALATED** — staging has been prod-sized for over ${ESCALATE_AFTER_HOURS}h with no revert.`,
              });
            }

      - name: Auto-close resolved drift issues
        if: steps.sizecheck.outputs.drifted == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'staging-load-test-size-drift', per_page: 5,
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved at ${new Date().toISOString()} — staging is back to its small footprint.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
