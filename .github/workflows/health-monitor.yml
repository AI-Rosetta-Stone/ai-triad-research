# ─── Health Monitor ───
# What:  Checks the production app's /health and /api/data/available endpoints
#        every 15 minutes. Creates a GitHub issue on failure, auto-closes on recovery.
# Before: Runs on schedule. The production app must be deployed and accessible.
# After:  If unhealthy, a GitHub issue with label "health-alert" is created.
#         Investigate container logs and redeploy if needed.

name: Health Monitor

# Schedule re-registered 2026-10-12 after the AI-Rosetta-Stone org move: crons stopped firing silently (t/4173).
on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
    inputs:
      gv_inject_missing:
        description: 'Gate-verification: inject a nonexistent workflow to prove the staleness/fail-loud alarm fires (t/3672)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read  # list-workflow-runs for the schedule-staleness heartbeat (t/3672)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_URL: https://taxonomy-editor.yellowbush-aeda037d.eastus.azurecontainerapps.io

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check health and data endpoints
        id: health
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Failures = 0
          for ($i = 1; $i -le 3; $i++) {
            # Test-TaxEditorHealth covers /health + /healthz in one probe (t/1495);
            # /api/data/available is a third endpoint the cmdlet doesn't cover, kept as its own curl check.
            $Result = Test-TaxEditorHealth -BaseUrl "${{ env.APP_URL }}" -TimeoutSec 10
            $DataStatus = try { (Invoke-RestMethod -Uri "${{ env.APP_URL }}/api/data/available" -TimeoutSec 10) } catch { 'error' }
            if (-not $Result.Healthy -or $DataStatus -ne $true) {
              $Failures++
              Write-Host "Attempt $i failed (healthy: $($Result.Healthy), data: $DataStatus)"
            } else {
              Write-Host "Attempt $i passed (healthy: true, data: available)"
            }
            if ($i -lt 3) { Start-Sleep -Seconds 30 }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "failures=$Failures"
          if ($Failures -eq 3) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=false"
            exit 1
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=true"
          }

      - name: Create issue on sustained failure
        if: failure() && steps.health.outputs.healthy == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // Check for existing open issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-alert',
              per_page: 1
            });

            if (existing.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing at ${new Date().toISOString()} — 3/3 health checks failed.`
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Health check failure: taxonomy-editor unreachable`,
                body: [
                  `## Health Check Alert`,
                  ``,
                  `The Taxonomy Editor health endpoint failed 3 consecutive checks.`,
                  ``,
                  `- **URL:** \`${process.env.APP_URL}/health\``,
                  `- **Time:** ${new Date().toISOString()}`,
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  ``,
                  `### Troubleshooting`,
                  ``,
                  '```bash',
                  `az containerapp show --name taxonomy-editor -g ai-triad --query "properties.runningStatus"`,
                  `az containerapp logs show --name taxonomy-editor -g ai-triad --type console`,
                  '```',
                  ``,
                  `Close this issue once the app is back online.`
                ].join('\n'),
                labels: ['health-alert', 'bug']
              });
              console.log('Created new health alert issue');
            }

      - name: Auto-close resolved issues
        if: steps.health.outputs.healthy == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-alert',
              per_page: 5
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved at ${new Date().toISOString()} — health check passing again.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              console.log(`Auto-closed issue #${issue.number}`);
            }

  schedule-staleness:
    # Watches tracked scheduled workflows for SILENCE (a cron that stopped firing) — the failure
    # mode a workflow cannot detect about itself (t/3672). Same-repo only: default GITHUB_TOKEN +
    # actions:read. compliance-live.yml already self-alerts on its RED conclusion; this covers the
    # ABSENCE case (auto-disable after 60d repo inactivity, rename, broken YAML, disabled cron).
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat — assert tracked scheduled workflows ran within their window
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // Drop-in: add { file, maxAgeHours }. Freshness is asserted on the SCHEDULE event only,
            // so a manual dispatch cannot mask a dead cron.
            const TRACKED = [
              // 36h = 24h daily + 12h slack. Measured (t/3672#9): GitHub throttles the 0 6 * * *
              // cron to ~10:40-12:47 UTC; worst observed inter-run gap ~25.5h. 36h avoids false
              // alarms on normal throttling while still catching a genuine multi-day silence.
              { file: 'compliance-live.yml', maxAgeHours: 36 },
            ];
            // GV arm: a workflow_dispatch with gv_inject_missing=true adds a nonexistent workflow,
            // proving the fail-loud path ALARMS (a query failure / not-found must never read healthy).
            if (context.payload.inputs && context.payload.inputs.gv_inject_missing === 'true') {
              TRACKED.push({ file: '__nonexistent_gv_probe__.yml', maxAgeHours: 30 });
            }
            const alarms = [];
            for (const t of TRACKED) {
              try {
                const res = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: t.file,
                  event: 'schedule',
                  per_page: 1,
                });
                const runs = (res.data && res.data.workflow_runs) || [];
                if (runs.length === 0) {
                  alarms.push(`${t.file}: no scheduled runs found (missing/renamed/never-fired) — cannot confirm freshness`);
                  continue;
                }
                const ts = Date.parse(runs[0].created_at);
                if (!Number.isFinite(ts)) {
                  alarms.push(`${t.file}: last-run timestamp unparseable ('${runs[0].created_at}')`);
                  continue;
                }
                const ageH = (Date.now() - ts) / 3600000;
                if (ageH > t.maxAgeHours) {
                  alarms.push(`${t.file}: STALE — last scheduled run ${ageH.toFixed(1)}h ago (max ${t.maxAgeHours}h)`);
                }
              } catch (e) {
                // fail-loud (t/3672#2): auth failure / not-found / API error must ALARM, never green
                alarms.push(`${t.file}: QUERY FAILED (${e.status || '?'} ${e.message}) — cannot confirm freshness, treating as UNHEALTHY`);
              }
            }
            const LABEL = 'schedule-staleness';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 5,
            });
            if (alarms.length > 0) {
              const list = alarms.map(a => `- ${a}`).join('\n');
              if (open.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.data[0].number,
                  body: `Still alarming at ${new Date().toISOString()}:\n\n${list}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: 'Scheduled-workflow staleness detected',
                  body: [
                    '## Scheduled-workflow staleness / heartbeat alarm',
                    '',
                    'A tracked scheduled workflow is not reporting fresh scheduled runs:',
                    '',
                    list,
                    '',
                    `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                    '',
                    "Likely causes: cron auto-disabled (60d repo inactivity), workflow renamed/deleted, broken YAML, or an actions:read query failure. Check the workflow's Actions tab.",
                  ].join('\n'),
                  labels: [LABEL, 'bug'],
                });
              }
              core.setFailed(alarms.join('; '));
            } else {
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved at ${new Date().toISOString()} — all tracked scheduled workflows reporting fresh.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                });
              }
            }
