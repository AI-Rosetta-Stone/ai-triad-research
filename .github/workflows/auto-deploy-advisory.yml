name: Auto-deploy advisory (t/4285)

# Decision D (PI-approved, t/4285): continuous-deploy of green main. This workflow is the
# ADVISORY phase only — it never deploys, builds an image, or dispatches another workflow. It
# posts a would-deploy / skip verdict so the one-week advisory evidence can be collected before
# the live flip (a separate, T2 PR per the ticket's rollout plan).
#
# Trigger: workflow_run on ci.yml, filtered to push events on main (TL condition 1). Reacting to
# ci.yml finishing — rather than polling hourly — is the whole point: the baseline problem (t/4107)
# is an 18h median merge-to-prod gap against a 14min PR-merge time, and polling would reintroduce
# up to an hour of pure waiting on top of an already-green signal.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-deploy-advisory
  cancel-in-progress: false

jobs:
  advise:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      # TL condition 2: prod's own /health buildSha is authoritative, not the known-good tag
      # (which can silently fail to apply — t/4273).
      PROD_HEALTH_URL: https://taxonomy-editor.yellowbush-aeda037d.eastus.azurecontainerapps.io/health
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the predicate needs `git diff <lastDeployedSha>..<headSha>`

      - name: Evaluate advisory verdict
        id: verdict
        shell: pwsh
        run: |
          # TL condition 4: advisory mode has no side effects — this step only reads (gh api,
          # git diff, prod /health) and writes step outputs/summary. No container.yml dispatch,
          # no deploy-azure.yml dispatch, no repo-variable write.
          $holdActive = '${{ vars.AUTO_DEPLOY_HOLD }}' -eq 'true'
          ./operations/devops/Invoke-AutoDeployAdvisory.ps1 `
            -Repo '${{ github.repository }}' `
            -HeadSha '${{ github.event.workflow_run.head_sha }}' `
            -ProdHealthUrl $env:PROD_HEALTH_URL `
            -HoldActive $holdActive
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set the run name to the verdict (t/4285 attribution — the 10-17 385aa982 gap)
        if: always()
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "display_title=${{ steps.verdict.outputs.verdict == 'WouldDeploy' && 'would-deploy' || format('skip ({0})', steps.verdict.outputs.skip_reason) }} ${{ env.HEAD_SHA }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
