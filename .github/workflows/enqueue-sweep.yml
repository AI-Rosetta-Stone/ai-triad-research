# ─── Merge-queue enqueue sweep ───
# What:  On every CI completion (+ an offset cron backstop, t/4779), as a GitHub
#        App, put PRs into the merge queue that are ready but were never (or not
#        successfully) enqueued:
#        1. Dependabot PRs that dependabot-auto-merge.yml armed (its minor/patch policy) with
#           ci-gate and CodeQL Analysis green (operations/devops/dependabot-enqueue-sweep.mjs).
#        2. T0 PRs (body starts `Tier: T0`, base main, not draft, no consult-hold / joint-gv /
#           no-auto-enqueue label) with all required checks green and NOTHING PUSHED FOR 15
#           MINUTES, since pushing to a queued PR is refused (operations/devops/t0-enqueue-sweep.mjs).
#        Both enqueue through operations/devops/enqueue-pr.mjs (pinned head, verified entry).
# Why:   Auto-merge armed with the built-in GITHUB_TOKEN never led to queue entry: every
#        Dependabot PR since the queue launched (2026-10-28) sat 16-41h until a human
#        re-armed it (#4262, #4263, #4280, #4282). Dependabot-triggered workflows cannot read
#        Actions secrets, so the App step runs here on a schedule. T0 PRs that authors forgot
#        to arm waited 1-14h each (~35h over five days); the PI approved auto-enqueue at
#        green + 15 min idle (2026-11-02).
# Setup: Repo variable DEPENDABOT_MERGE_APP_CLIENT_ID and repo secret
#        DEPENDABOT_MERGE_APP_PRIVATE_KEY, for an App installed on this repo with Contents,
#        Pull requests and Workflows write. (The names predate the T0 step; the same App now
#        enqueues both.) Until both exist, the job logs a warning and exits without acting.
# Triggers: GitHub's scheduler runs this repo's crons hours late (15-minute crons fired 3
#        times in a day, #4389), so the sweep runs when a CI run COMPLETES (workflow_run),
#        dozens of times an hour; the cron stays as a fallback. A workflow_run run always uses
#        main's copy of this file and checks out main: nothing from the triggering PR is run,
#        so PR code never sees the App key. When the triggering CI run was Dependabot's,
#        GitHub withholds secrets: the config check below warns and exits, and the next CI
#        completion covers it. Concurrency allows one running sweep plus one pending (a newer
#        trigger replaces the pending one; a running sweep is never cancelled mid-enqueue).
#        The T0 step waits up to 16 minutes for PRs blocked only by the 15-minute idle window.

name: Merge-queue enqueue sweep

# t/4779: never had a scheduled run in 3h despite `state: active` and valid cron syntax --
# this repo's GH Actions scheduler is congested for high-frequency crons (t/4173, t/4501:
# health-monitor.yml/main-ci-monitor.yml/sources-index.yml all measured 2-5h gaps despite a
# declared 15/30min cadence; a round-minute offset alone did NOT fix it). Mirrors
# main-ci-monitor.yml's fix: a workflow_run trigger makes the EFFECTIVE cadence track CI
# completions (frequent, not cron-bound), with the offset cron only as a backstop for what
# workflow_run can't see.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # No `branches:` filter: PR CI completions must trigger it too, or a PR that goes green waits
    # for the next merge to main. Safe because this job runs main's copy and checks out main only.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'  # offset off round-minute marks, same rationale as main-ci-monitor.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be enqueued without acting'
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # checkout only; all writes use the App token

concurrency:
  group: enqueue-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # up to 16 min of idle-window waiting in the T0 step, plus the sweeps
    steps:
      - name: Check App configuration
        id: cfg
        env:
          APP_CLIENT_ID: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          APP_KEY_PRESENT: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_PRESENT" != "true" ]; then
            echo "::warning::WARN: enqueue sweep skipped: DEPENDABOT_MERGE_APP_CLIENT_ID (variable) or DEPENDABOT_MERGE_APP_PRIVATE_KEY (secret) is not set. Ready Dependabot and T0 PRs will NOT be enqueued automatically."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Always main, never the triggering run's head: on workflow_run the App key is in this
      # job, so no PR-controlled code may be checked out or executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        if: steps.cfg.outputs.configured == 'true'
        with:
          ref: main
          persist-credentials: false

      - name: Sweep unit tests
        if: steps.cfg.outputs.configured == 'true'
        run: node --test operations/devops/dependabot-enqueue-sweep.test.mjs operations/devops/t0-enqueue-sweep.test.mjs operations/devops/live-pr-state.test.mjs operations/devops/pr-contexts.test.mjs operations/devops/infra-rearm-sweep.test.mjs

      - name: Mint App token
        id: app
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}

      - name: Enqueue green, armed Dependabot PRs
        id: dependabot
        if: steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node operations/devops/dependabot-enqueue-sweep.mjs "${{ github.repository }}" $DRY_RUN

      # Runs even if the Dependabot step failed: one stuck Dependabot PR must not hold back T0 PRs.
      - name: Enqueue green, idle T0 PRs
        if: always() && steps.cfg.outputs.configured == 'true' && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Dry runs report once; real runs wait up to 16 min for PRs blocked only by the idle window.
          MODE: ${{ inputs.dry_run && '--dry-run' || '--wait-max-minutes=16' }}
        run: node operations/devops/t0-enqueue-sweep.mjs "${{ github.repository }}" $MODE

      # t/387 (t/385 cause 3): re-arm PRs that an INFRA failure ejected from the merge queue (rate
      # limit, DNS/apt, runner loss, setup-step failure), at most twice per head, through
      # enqueue-pr.mjs (which still enforces approvals and the tier guard). A real failure gets a PR
      # comment instead. On the App token: a GITHUB_TOKEN enqueue would not trigger merge_group CI.
      # Runs even if the earlier sweeps failed.
      - name: Re-arm PRs ejected by an infra failure (t/387)
        if: always() && steps.cfg.outputs.configured == 'true' && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node operations/devops/infra-rearm-sweep.mjs "${{ github.repository }}" $DRY_RUN

      # t/318 (TL p/9#46): App-token variant of the canonical snapshot step, for the enqueue sweep, whose
      # work runs on the GitHub App installation token it mints (steps.app). Same script as
      # operations/devops/rate-limit-snapshot-step.yml except the labels (pool=app, the summary heading)
      # and the token; rate-limit-snapshot-step.test.mjs checks that parity. Canonical copy:
      # operations/devops/rate-limit-snapshot-step-app.yml. It reads the App's own pool, which the
      # GITHUB_TOKEN step cannot see. Never fails the job.
      - name: Rate-limit snapshot, App token (t/318)
        if: ${{ !cancelled() && steps.app.outputs.token != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Comma-joined, read with IFS=, (not whitespace), so an empty field can't shift the
          # later values; each value must be a number on its own (Quality, #5028 review).
          allnum() { for v in "$@"; do [[ "$v" =~ ^[0-9]+$ ]] || return 1; done; }
          if out=$(gh api rate_limit --jq '[.resources.core.used, .resources.core.remaining, .resources.core.limit, .resources.core.reset, .resources.graphql.used, .resources.graphql.remaining, .resources.graphql.limit] | map(tostring) | join(",")' 2>&1) \
            && IFS=, read -r cu cr cl creset gu gr gl extra <<<"$out" && [ -z "$extra" ] && allnum "$cu" "$cr" "$cl" "$creset" "$gu" "$gr" "$gl"; then
            reset=$(date -u -d "@$creset" +%H:%M:%SZ 2>/dev/null || echo "$creset")
            echo "t/314 rate-limit: pool=app workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB core used=$cu remaining=$cr limit=$cl reset=$reset graphql used=$gu remaining=$gr limit=$gl"
            {
              echo "### GitHub App installation token rate limit at end of job (t/318)"
              echo ""
              echo "| API | used | remaining | limit |"
              echo "|---|---|---|---|"
              echo "| REST core | $cu | $cr | $cl |"
              echo "| GraphQL | $gu | $gr | $gl |"
              echo ""
              echo "REST core window resets at $reset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::t/318: could not read GET /rate_limit with the App token, so no App-pool snapshot for this job (${out:-no output})."
          fi

      # t/314 (t/313 observability): CANONICAL COPY of this step lives in
      # operations/devops/rate-limit-snapshot-step.yml; operations/devops/rate-limit-snapshot-step.test.mjs
      # fails if a guard's copy drifts. Some guards have no checkout, so the step is inline.
      # Records the repo-wide GITHUB_TOKEN installation quota (REST core + GraphQL) as it stands at
      # the end of this job: a snapshot of the shared pool, not this job's own usage, and App tokens
      # are not in it. GET /rate_limit does not count against the PRIMARY limit but can count against
      # the secondary one (GitHub REST rate-limits doc). Never fails the job; timeout-minutes bounds a
      # hung call, since continue-on-error does not (Second-Opinion, #5029).
      - name: Rate-limit snapshot (t/314)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Comma-joined, read with IFS=, (not whitespace), so an empty field can't shift the
          # later values; each value must be a number on its own (Quality, #5028 review).
          allnum() { for v in "$@"; do [[ "$v" =~ ^[0-9]+$ ]] || return 1; done; }
          if out=$(gh api rate_limit --jq '[.resources.core.used, .resources.core.remaining, .resources.core.limit, .resources.core.reset, .resources.graphql.used, .resources.graphql.remaining, .resources.graphql.limit] | map(tostring) | join(",")' 2>&1) \
            && IFS=, read -r cu cr cl creset gu gr gl extra <<<"$out" && [ -z "$extra" ] && allnum "$cu" "$cr" "$cl" "$creset" "$gu" "$gr" "$gl"; then
            reset=$(date -u -d "@$creset" +%H:%M:%SZ 2>/dev/null || echo "$creset")
            echo "t/314 rate-limit: workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB core used=$cu remaining=$cr limit=$cl reset=$reset graphql used=$gu remaining=$gr limit=$gl"
            {
              echo "### GITHUB_TOKEN rate limit at end of job (t/314)"
              echo ""
              echo "| API | used | remaining | limit |"
              echo "|---|---|---|---|"
              echo "| REST core | $cu | $cr | $cl |"
              echo "| GraphQL | $gu | $gr | $gl |"
              echo ""
              echo "REST core window resets at $reset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::t/314: could not read GET /rate_limit, so no rate-limit snapshot for this job (${out:-no output})."
          fi
