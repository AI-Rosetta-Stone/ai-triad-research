# ─── Container Image ───
# What:  Builds the taxonomy-editor Docker image with baked-in taxonomy snapshot
#        for fallback data. Pushes to GHCR. Includes Trivy scan and SBOM.
# Before: Ensure the base image exists in GHCR (run base-image workflow if needed).
#         Triggers on version tag push (v*) or manual dispatch.
# After:  Image is available in GHCR. Auto-Deploy to Staging fires automatically.
#         For production, manually trigger the Deploy to Azure workflow.

name: Container Image
# t/4129: the run name carries the BUILT commit. Auto-Deploy to Staging (workflow_run) reads it back
# via operations/devops/Get-BuiltShaFromRunName.ps1, because workflow_run.head_sha is the DISPATCH
# ref tip, not the commit built from inputs.sha. Keep this expression IDENTICAL to the per-SHA tag
# (`type=raw,value=sha-...`), BUILD_SHA and the checkout `ref:` below; the staging parser expects `(sha-<hex>)`.
run-name: Container Image (sha-${{ inputs.sha || github.sha }})

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'true'
        type: boolean
      sha:
        description: 'Commit SHA to build (must have CI-green status). Full 40-char SHA required — short SHAs are auto-expanded via API. Leave blank to use dispatched ref HEAD — racy at fleet commit rate.'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write  # For SARIF upload
  id-token: write          # For build provenance attestation
  attestations: write      # For build provenance attestation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-rosetta-stone/taxonomy-editor

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # required for gh workflow run (dispatch CI on docs-only tips)
      contents: read
    steps:
      - name: Verify container-relevant CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          echo "Checking CI status for ${TARGET_SHA}..."

          # Normalize short SHA to full 40-char SHA (GitHub head_sha filter requires full SHA)
          if [ ${#TARGET_SHA} -lt 40 ]; then
            FULL_SHA=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}" --jq '.sha' 2>/dev/null || echo "")
            if [ -z "$FULL_SHA" ]; then
              echo "::error::Cannot resolve '${TARGET_SHA}' to a commit. Check the SHA and try again."
              exit 1
            fi
            echo "Expanded short SHA ${TARGET_SHA} → ${FULL_SHA}"
            TARGET_SHA="$FULL_SHA"
          fi

          # Get the latest CI run for this commit
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")

          if [ -z "$RUN_ID" ]; then
            # No CI run found — likely a docs-only tip that paths-ignore skipped.
            # Dispatch CI manually and wait for it rather than failing with an
            # unhelpful "push to main" instruction that no longer applies.
            echo "No CI run found for ${TARGET_SHA} (docs-only tip skipped by paths-ignore). Dispatching CI..."
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref main
            # Allow ~20s for the dispatched run to register in GitHub's API
            sleep 20
            for i in $(seq 1 18); do
              RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=1" \
                --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")
              [ -n "$RUN_ID" ] && break
              echo "  waiting for run to appear (${i}/18)..."; sleep 10
            done
            if [ -z "$RUN_ID" ]; then
              echo "::error::CI run did not appear within ~3 min after dispatch. Trigger manually: gh workflow run ci.yml --ref main"
              exit 1
            fi
            echo "CI run ${RUN_ID} started — waiting for completion..."
            gh run watch "${RUN_ID}" --exit-status || {
              echo "::error::CI run ${RUN_ID} failed. Container build blocked until CI passes."
              exit 1
            }
          fi

          # If the run is still in progress (found via fast path, not dispatched here),
          # wait for it to complete before checking individual job conclusions.
          RUN_STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
            --jq '.status' 2>/dev/null || echo "")
          if [ "$RUN_STATUS" = "in_progress" ] || [ "$RUN_STATUS" = "queued" ]; then
            echo "CI run ${RUN_ID} is still ${RUN_STATUS} — waiting for completion..."
            gh run watch "${RUN_ID}" --exit-status || {
              echo "::error::CI run ${RUN_ID} failed. Container build blocked until CI passes."
              exit 1
            }
          fi

          # Check only test-container — it needs: [test-powershell, test-electron]
          # so if it passed, all upstream jobs passed too. Checking test-electron
          # by name fails because the matrix creates per-app jobs (e.g. "test-electron (taxonomy-editor)").
          # "skipped" is also acceptable: the dorny/paths-filter gate skips test-container
          # when no container-relevant files changed, meaning the code being containerized
          # has been validated by prior successful runs. test-powershell failures do not
          # block container builds.
          for JOB in test-container; do
            # --paginate + per_page=100: the jobs API returns 30 per page by default and CI has
            # more than 30 jobs (35 on 2026-10-06), so an unpaginated lookup could not see
            # test-container and refused every build as "not found".
            STATUS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"${JOB}\") | .conclusion // .status" 2>/dev/null || echo "")
            if [ "$STATUS" = "success" ] || [ "$STATUS" = "skipped" ]; then
              echo "  ${JOB}: ${STATUS}"
            elif [ -z "$STATUS" ]; then
              echo "::error::Job '${JOB}' not found in CI run ${RUN_ID}."
              exit 1
            elif [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
              echo "::error::Job '${JOB}' is still ${STATUS} in CI run ${RUN_ID}. Wait for CI to complete."
              exit 1
            else
              echo "::error::Job '${JOB}' status is '${STATUS}' in CI run ${RUN_ID}. Container-relevant CI must pass before building."
              exit 1
            fi
          done
          echo "Container-relevant CI passed for ${TARGET_SHA}"

  build-and-push:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: taxonomy-editor/Dockerfile
          failure-threshold: error

      - name: Verify digest-pinned FROM lines
        run: |
          UNPINNED=$(grep -E '^FROM\s' taxonomy-editor/Dockerfile | grep -v '@sha256:' || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Non-digest-pinned FROM lines found in taxonomy-editor/Dockerfile:"
            echo "$UNPINNED"
            echo "All base images must use the form: FROM image:tag@sha256:<digest>"
            exit 1
          fi
          echo "All FROM lines are digest-pinned."

      - name: Verify base image exists
        run: |
          BASE_TAG=$(grep -oP 'FROM ghcr\.io/ai-rosetta-stone/ai-triad-base:\K[^@ ]+' taxonomy-editor/Dockerfile | head -1)
          echo "Base image tag: $BASE_TAG"
          if [ "$BASE_TAG" = "latest" ]; then
            echo "Using :latest — checking it exists..."
          fi
          TAGS=$(gh api orgs/ai-rosetta-stone/packages/container/ai-triad-base/versions --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          if echo "$TAGS" | grep -qx "$BASE_TAG"; then
            echo "Base image ghcr.io/ai-rosetta-stone/ai-triad-base:$BASE_TAG exists"
          else
            echo "::error::Base image tag '$BASE_TAG' not found in GHCR. Available tags: $(echo $TAGS | tr '\n' ', ')"
            echo "Run the base-image workflow first, or update the Dockerfile to use an existing tag."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pre-pull buildkit with retry — see t/2065 (Docker Hub boot flake).
      - name: Pre-pull buildkit image with retry (t/2065)
        run: |
          for i in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then break; fi
            if [ "$i" -lt 3 ]; then
              echo "buildkit pull attempt $i failed; retry in $((i * 10))s"; sleep $((i * 10))
            else
              echo "buildkit pre-pull failed after $i attempts; setup-buildx will attempt its own pull"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Publish :latest on BOTH v* release tags AND main-branch dispatch builds
            # (t/3522). The old `{{is_default_branch}}` fired only on main dispatch, so
            # `v*` releases never refreshed :latest — leaving a stale tag that deploy.ps1
            # / main.bicep default to (silent prod-deploy staleness). Adding the tag ref
            # keeps :latest = newest of {last release, last main dispatch}; the main-branch
            # clause is load-bearing for the Invoke-ContainerBuild dispatch -> deploy path.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # ── Per-SHA tag (t/3679 deploy-by-digest, condition 1) ───────────────────────
            # A PERMANENT, deploy-pinnable tag naming the BUILT commit. deploy-azure.yml and
            # deploy-staging.yml resolve `sha-<commit>` -> the immutable @sha256:<digest> and pin
            # the ACA revision to that digest, so a pod recycle re-pulls IDENTICAL bytes — never a
            # mutated :latest (the t/3679 recycle-swap hazard).
            #
            # WHY type=raw, NOT type=sha: docker/metadata-action's `type=sha` reads the git context
            # (github.sha) = the DISPATCH ref HEAD. On a workflow_dispatch build with an explicit
            # `sha`, the checkout builds `inputs.sha` (see BUILD_SHA at :279-285), so `type=sha`
            # would tag the image with a commit it does NOT contain (t/3278 wrong-SHA / t/3110
            # misleading-marker sink). The value below is IDENTICAL to BUILD_SHA and to `ref:`.
            #
            # GHCR-CLEANUP COUPLING — SYNC WITH operations/devops/Remove-StaleContainerImages.ps1:
            # this tag is PERMANENT by design. ghcr-cleanup deletes only UNTAGGED images (>30d,
            # keep 5 newest) — so a sha-tagged image is PRESERVED, which is what keeps a pinned
            # digest pullable on a recycle indefinitely (the outage-preventer, t/3679#8 SO finding 1;
            # also fixes t/3756 rollback-anchor expiry going forward). Tradeoff ACCEPTED: sha- tags
            # accumulate (never auto-pruned) — modest manifest storage; a bounded-retention policy is
            # a future call, not this change. TRAP: GHCR also lists `sha256-<digest>` COSIGN /
            # attestation tags — those are NOT per-SHA image tags and do NOT preserve the image
            # (t/3679#9 §4); do not mistake them for this tag.
            type=raw,value=sha-${{ inputs.sha || github.sha }}

      - name: Fetch taxonomy snapshot for fallback
        id: snapshot
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "Fetching taxonomy snapshot from ai-triad-data for baked fallback..."
          $Result = Get-TaxonomySnapshot -OutputPath taxonomy-snapshot

          if ($Result.Valid) {
            $TotalSize = (Get-ChildItem -Path taxonomy-snapshot -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host "Snapshot fetched successfully ($([math]::Round($TotalSize / 1MB, 1)) MB)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=true"
          } else {
            foreach ($f in $Result.MissingRequired) {
              Write-Host "::warning::Required file $f is missing or empty"
            }
            Write-Host "::warning::$($Result.MissingRequired.Count) required taxonomy files missing — fallback will be incomplete"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=false"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure snapshot directory exists
        if: always()
        run: |
          # Guarantee taxonomy-snapshot/ exists for the Dockerfile COPY layer.
          # If the fetch step was skipped or failed, create a minimal stub
          # so the build succeeds (fallback will just be empty).
          mkdir -p taxonomy-snapshot
          if [ ! -f taxonomy-snapshot/snapshot-meta.json ]; then
            echo '{"generated":"none","commit":"none","empty":true}' > taxonomy-snapshot/snapshot-meta.json
          fi

      - name: Determine push mode
        id: push_mode
        env:
          INPUTS_PUSH: ${{ inputs.push }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "$INPUTS_PUSH" == "true" ]]; then
            echo "push=true" >> $GITHUB_OUTPUT
            echo "load=false" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
            echo "load=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: taxonomy-editor/Dockerfile
          push: ${{ steps.push_mode.outputs.push }}
          load: ${{ steps.push_mode.outputs.load }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BUILD_SHA MUST match the checkout ref (inputs.sha || github.sha), NOT bare
          # github.sha — on a workflow_dispatch build with an explicit `sha`, github.sha is
          # the dispatch ref HEAD while the checkout builds inputs.sha. Baking the dispatch
          # HEAD would make the image report a commit it does NOT contain, and the t/3278
          # deploy-drift gate would then compare a WRONG running SHA vs main (t/3110 sink:
          # a misleading marker is worse than none). Keep this expression identical to `ref:`.
          build-args: BUILD_SHA=${{ inputs.sha || github.sha }}
          cache-from: type=gha,scope=shared-docker
          cache-to: type=gha,scope=shared-docker,mode=min

      # t/4129: fail the BUILD, not a later deploy, if the per-SHA tag the deploys resolve is absent
      # from the registry after the push. Reads the registry (authoritative), not metadata-action output.
      - name: Verify per-SHA tag exists in GHCR after push (t/4129)
        if: steps.push_mode.outputs.push == 'true'
        env:
          BUILT_SHA: ${{ inputs.sha || github.sha }}
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${BUILT_SHA}"
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
              echo "Per-SHA tag present: $ref"; exit 0
            fi
            echo "::warning::$ref not visible yet (attempt $attempt/3), retrying in 10s (registry propagation)"
            sleep 10
          done
          echo "::error::Per-SHA tag $ref is missing from GHCR after push. Deploys resolve this tag (Resolve-ImageDigest.ps1) and would fail with ImageTagNotFound. Check the metadata-action tags and the push step."
          exit 1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          # C4 (t/3520): pin the trivy BINARY. Actions are SHA-pinned already; the binary
          # floated to `latest`, so DB-schema / severity-mapping / fixed-version-detection /
          # .trivyignore-parsing semantics could change with no repo diff. Pin so gate
          # behaviour changes only by an explicit PR. (Verify on the next build's
          # "Install Trivy" log; re-pin deliberately when bumping.)
          version: v0.74.0

      # C3 (t/3520): DB warm-up with retry — makes an INFRA failure (Trivy-DB registry
      # unreachable / rate-limited) distinct from a FINDING failure (the gate step's
      # exit-code 1 on a fixable CVE). It runs BEFORE the scan/gate steps, so a transient
      # ghcr/OCI DB flake fails HERE, visibly labelled infra, and the run stops before the
      # gate evaluates findings. The scan + gate steps set TRIVY_SKIP_DB_UPDATE so they
      # reuse this warmed DB and can only fail on findings — never on a DB download.
      - name: Warm Trivy vuln DB (infra step — a failure here is DB/registry, NOT a CVE finding)
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          for attempt in 1 2 3; do
            if trivy image --download-db-only --cache-dir "$TRIVY_CACHE_DIR"; then
              echo "Trivy DB ready (attempt $attempt)"; exit 0
            fi
            echo "::warning::Trivy DB download failed (attempt $attempt/3) — retrying in 15s"
            sleep 15
          done
          echo "::error::Trivy DB download failed after 3 attempts — INFRA failure (DB registry unreachable/rate-limited), NOT a vulnerability finding. Re-run; if persistent, check ghcr.io/aquasecurity/trivy-db availability."
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'     # reuse the warmed DB; DB flakes already surfaced as infra above
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # ── Trivy blocking gate — fixable high/critical (t/3520) ────────────────────
      # NEW blocking gate (a promotion — there was previously NO build-failing Trivy
      # step; the scan above is report-only SARIF). Fails CI on a FIXABLE high/critical
      # so a patchable CVE can't ship unnoticed. `ignore-unfixed: true` means no-fix
      # trixie residuals do NOT fail here — those stay governed by the annotated
      # .trivyignore (report step above, t/2006 no-silent-suppression) + the weekly
      # base rebuild that auto-retires them. So: hard floor on fixable, full visibility
      # on the rest.
      #
      # ── UNBLOCK PLAYBOOK (SO condition 2, t/3520) — READ WHEN THIS GATE GOES RED ──
      # OWNER: DevOps. SCOPE: Option A — this scans EVERY IMAGE BUILT VIA THE DISPATCH PATH.
      # `container.yml`'s `push: tags: ['v*']` trigger exists but never fires — there are no
      # `v*` tags on origin (t/3520#11/#12), so the only build path is `workflow_dispatch`
      # (Invoke-ContainerBuild). A red here blocks that dispatched build/ship, not a PR merge;
      # merge-time coverage is deliberately out of scope (t/3520#3 Finding 1). ("Release gate"
      # is a misnomer while no tag-based release flow exists — it's a build-path gate.)
      #
      # EXOGENOUS RED — this gate can go red with ZERO repo change: the trivy vuln DB
      # refreshes nightly, so a CVE can be reclassified, or one of the annotated no-fix
      # .trivyignore residuals can gain an upstream fix — either flips a build red with no
      # code change. Expected, and release-scoped (an attended event, not a PR wall).
      #
      # DECISION RULE when red:
      #   1. VERIFY AGAINST THE REGISTRY, NOT THE YAML — read the actual Trivy finding
      #      (package + "Fixed Version"); don't reason from config (t/3520 / t/3522 lesson).
      #   2. FIXABLE (a patched version exists) -> BUMP THE FIX: OS pkg -> base rebuild
      #      (base-image.yml); npm dep -> pnpm-workspace.yaml override + regen both lockfiles.
      #   3. GENUINELY NO UPSTREAM FIX -> add an annotated `.trivyignore` entry (CVE + package
      #      + "no upstream fix as of <date>" + reachability note + REVISIT trigger, t/2006).
      #      A `.trivyignore` diff is a blocking-gate surface now — review it like a workflow diff.
      #   NEVER an ad-hoc skip. Emergency bypass = the EXISTING merge-guard override path
      #   (disable the feedback rule / `--no-verify` per the commit-guard pattern), recorded.
      #
      # STALENESS (Part 1b, 4-week rule): the deployed image is scanned out-of-band by
      # `deployed-image-scan.yml` (weekly, report-only) against `:latest` — the real deployed
      # artifact, since no `v*` tags exist. That workflow's freshness guard fails RED if
      # `:latest` is older than the 4-week window, so a stale deployed image can't report
      # false-clean. This gate here covers the freshly-built image at dispatch time.
      #
      # BLOCKING (flipped t/3520 after: Arm-A red proof run 35645266261 [__run_4 outcome=failure
      # on a fixable HIGH] + warn-cycle green run 35646605903 [__run_4 outcome=success, 0
      # findings] + Second Opinion Recommendation + TL sign-off). A fixable high/critical now
      # FAILS the dispatched build. TO REVERT to non-blocking in an emergency (self-buggy gate
      # downing builds), re-add `continue-on-error: true` to this step — same spirit as the
      # commit-guard `--no-verify` / merge-guard disable path; record the revert on t/3520.
      - name: Trivy blocking gate (fixable high/critical) — BLOCKING
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'     # C3: reuse the warmed DB — a red here is a FINDING, never a DB flake
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
          skip-setup-trivy: true

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Attest build provenance
        if: steps.push_mode.outputs.push == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Image size report
        if: success()
        run: docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  smoke-published:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    # Only runs when the image was actually pushed to GHCR.
    # A no-push dispatch (push=false) skips this job; the workflow still
    # succeeds so deploy-staging.yml is not spuriously blocked.
    if: |
      needs.build-and-push.result == 'success' &&
      (github.event_name == 'push' || inputs.push == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image by digest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

      - name: Readiness smoke against published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          SMOKE_MODE: readiness
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/azure/smoke-healthz.sh
