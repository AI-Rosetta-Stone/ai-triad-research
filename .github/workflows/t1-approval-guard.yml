name: t1-approval-guard

# Prevention (t/4247): #3343 and #3364 both auto-merged on 10-17 as T1 PRs with no `Approved
# (<role>):` comment — root AGENTS.md's PR-Flow line ("arm auto-merge at PR creation for T1")
# and Change Tiers' rule (T1 needs the reviewer's approval first) conflicted, and nothing
# mechanical enforced the approval. This checks that conflict mechanically. Modeled on
# tier-check.yml (github-script orchestration, predicate loaded from the BASE tip so a PR can't
# narrow its own gate, e/291 C1) and consult-hold-guard.yml (genuinely fails red rather than
# swallowing via continue-on-error; non-required until promoted — this workflow only computes and
# reports, branch protection decides blocking, same STATUS-INDEPENDENT framing).
#
# ROUTE TABLE (t/4247 AC2):
#   - manual merge / GitHub server-side auto-merge / admin-token merge -> all covered identically
#     once this becomes a required context (a required context binds every merge path alike,
#     same reasoning as consult-hold-guard's own header comment).
#   - merges into an epic branch -> excluded: this workflow's pull_request trigger is scoped to
#     base `main`, and the script skips entirely if `pull_request.base.ref` isn't `main`.
#   - an approval added by EDITING an older comment in place -> covered: the predicate uses the
#     comment's effective time (`updatedAt ?? createdAt`), and `issue_comment: [edited]` re-runs
#     this check so the PR isn't stuck red waiting for a new comment.
#   - t/4096 Reviewer switch-over: a real bot APPROVED review -> covered by the review relay
#     (t1-approval-review-relay.yml on `pull_request_review: [submitted, dismissed]`, then
#     `workflow_run` here, from main; t/534 part B), so the check re-runs seconds after the reviewer
#     App leaves its review, same as a new comment does. The legacy `Approved (<role>):` comment path is unchanged during the
#     transition; both forms satisfy the predicate (t1-approval-guard-predicate.mjs).
#
# ROLLOUT: ships warn-only (not a required context) for >=1 green cycle against real T1 PRs.
# Promotion to required is a separate T2 PR (branch-protection-adjacent).
#
# STATES (t/534, PI decision t/531 items 1 and 4). Two rows show on a PR: the job row `evaluate`
# and the API check run `t1-approval-guard` (the one enqueue-pr.mjs reads).
#   T1, no approval at the head, no changes-request -> `t1-approval-guard` PENDING (in_progress,
#       "awaiting review"); `evaluate` success. Not a pass: enqueue-pr.mjs refuses guard_in_progress.
#   approved after the latest push   -> `t1-approval-guard` success; `evaluate` success.
#   outstanding changes-request      -> `t1-approval-guard` failure; `evaluate` failure.
#   cannot evaluate (crash, no head) -> `t1-approval-guard` failure; `evaluate` failure (t/4819).
#   not T1                           -> `t1-approval-guard` success; `evaluate` success.
# While the head's `t1-approval-guard` run is pending, the next evaluation UPDATES it (postCheckRun),
# so an approval turns the push's pending row green instead of adding a second row (#5392). Once
# it has completed, a later evaluation (dismissal, changes-request) CREATES a new run, which is the
# newest and so the one shown and read (t/534#9). No consumer reads `evaluate` as a verdict: it is
# not a required context, and enqueue-pr.mjs, t1-approval-at-head.mjs, the sweeps, pr-triage,
# stuck-pr-classifier and my-prs.mjs select rows by name and never by `evaluate` (t/534#10).
#
# t/4247 (TL, 2026-10-20): the check went stale 6x in one day after an approval arrived -- the
# issue_comment/pull_request_review triggers above were already in place, but a workflow run
# triggered by either event does NOT attach its check-run to the PR's head SHA (`context.sha`
# resolves to the default branch's tip for those events, not `pr.head.sha` -- a documented
# GitHub Actions limitation). The job's own implicit pass/fail only updates the PR's displayed
# check for `pull_request`-triggered runs; for the other two, the PR kept showing the stale
# check-run from its last `synchronize` event. Fixed by explicitly posting a Checks API run
# pinned to `pr.head.sha` for every trigger, uniformly -- see postCheckRun() below. The job id
# is renamed (`t1-approval-guard` -> `evaluate`) so GitHub's own implicit per-job check (named
# after the job id) doesn't collide with the explicit one, which keeps the canonical name
# `t1-approval-guard` everywhere already documented (this file's own comments, t/4247, a future
# required-context promotion).
#
# t/4266 P1 (TL p/331#2585): `pull_request` -> `pull_request_target`, same as tier-check.yml and
# for the same reason -- GitHub sources THIS FILE from `main`, so a PR can no longer disable or
# weaken evaluation by editing t1-approval-guard.yml itself. `issue_comment`/`pull_request_review`
# are unaffected (those events have no "target" variant and never implied a PR-ref checkout to
# begin with -- this job already only ever reads the predicate from `main`'s explicitly-fetched
# tip, never from the checked-out tree). The self-test suite moved to ci.yml's gate-self-health
# job (plain pull_request, zero permissions, t/4266) -- this job never executes PR code at all.
#
# COMMENT FILTER: a created or edited PR comment runs this check only if it (or, for an edit, its
# previous text) contains a verdict word, the sweep's re-run marker, or `/recheck-guards`. A
# DELETED PR comment always runs it. To re-run this check by hand, post a PR comment containing
# `/recheck-guards`. The list and its reasons are on the job.
#
# REMOVED APPROVALS (Second Opinion condition on #5176): `issue_comment: [deleted]` and a review
# `dismissed` (through the relay, t/534) are triggers, so deleting an approval comment or dismissing an
# approving review re-evaluates at once. Without them the last `success` check run stayed on the
# head, and enqueue-pr.mjs reads that check run. The run lists comments and reviews afresh: a
# deleted comment is no longer in the list, and a dismissed review comes back with state DISMISSED,
# which the predicate never counts as an approval. EVERY deleted PR comment runs the job, whatever
# its text: filtering a deletion would depend on the event carrying the deleted comment's body,
# which is not confirmed, and an empty body there would skip a deleted sole approval and leave the
# stale `success` (Second Opinion on 3ebe74158). One run per deletion is cheap. LIMIT (t/534): the relay runs
# from the PR's side, so a branch cut before the relay existed re-evaluates a review only on its
# next comment, push or sweep, until it is rebased onto main.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled]
  issue_comment:
    types: [created, edited, deleted]
  # t/534 part B (t/537): NOT `pull_request_review`, whose runs take this file from the PR's side.
  # Reviews reach this guard through the permission-less relay (t1-approval-review-relay.yml); a
  # `workflow_run` run always takes this file from the default branch.
  workflow_run:
    workflows: [t1-approval-review-relay]
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # COMMENT FILTER. A created or edited PR comment runs this job only when the comment could
    # change the verdict. A deleted PR comment always runs it (`github.event.action == 'deleted'`),
    # and every other trigger runs as before. Most PR comments are agent status chatter
    # ("Head updated to ...", "Ready for reviewer approval"), and each run they set off re-read the
    # PR's comments, reviews and commits from the shared GITHUB_TOKEN quota without changing anything.
    #
    # The quoted strings between BEGIN/END comment-filter are THE list. It mirrors what
    # operations/devops/role-review-verdicts.mjs reacts to in a comment body (the same code is
    # inlined in t1-approval-guard-predicate.mjs):
    #   'Approved', 'Changes requested', 'Design-exempt'  -- VERDICT_RE's three verdict words. The
    #       bare word, not `Approved (`, because VERDICT_RE allows any whitespace, or none, before
    #       the parenthesis. 'Changes requested' also covers the reviewer App's fail-closed backstop
    #       (LOOSE_CHANGES_REQUESTED_RE, first line, any case).
    #   '<!-- t1-sweep-guard-rerun:'  -- the marker of the sweep comment (PR #4795) that is posted
    #       to make this guard run again when an earlier run was lost.
    #   '/recheck-guards'  -- the one documented way to re-run this guard and tier-check by hand:
    #       post a PR comment containing it (docs/pr-landing.md).
    # contains() ignores case and matches anywhere in the body, so the list is a SUPERSET of the
    # predicate: an extra run is harmless, a missed one loses an approval or a block. The text
    # searched is the comment's new body plus, for an edit, its previous body
    # (`changes.body.from`, empty on `created`), so a verdict edited AWAY also re-evaluates.
    # The list is not applied to a deletion at all: see REMOVED APPROVALS in the header.
    # When you change the grammar in role-review-verdicts.mjs, change the list here, in BOTH copies
    # (`if:` and `concurrency.group`). comment-filter-workflow.test.mjs fails if the copies differ
    # or if a body the predicate reacts to would not run this job.
    #
    # Review events arrive as `workflow_run` from the relay (t/534) and are not filtered: every one runs the job.
    #
    # A job skipped here reports as `evaluate` (the job id), on the default branch's tip. It never
    # creates or changes a `t1-approval-guard` check run, so it cannot read as a verdict.
    concurrency:
      # The filter is repeated in the group, so a run this filter skips gets a group of its own
      # (its run id). If it shared the PR's group, a chatter comment arriving while a verdict
      # comment's run was in progress could cancel that run and then skip, losing the verdict.
      # BEGIN comment-filter (group copy)
      group: >-
        ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha || github.run_id }}-${{
        (
        (github.event.issue.pull_request || !github.event.issue)
        && (
        github.event_name != 'issue_comment'
        || github.event.action == 'deleted'
        || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), 'Approved')
        || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), 'Changes requested')
        || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), 'Design-exempt')
        || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), '<!-- t1-sweep-guard-rerun:')
        || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), '/recheck-guards')
        )
        ) && 'evaluate' || github.run_id }}
      # END comment-filter (group copy)
      cancel-in-progress: ${{ github.event_name != 'merge_group' }}
    # BEGIN comment-filter
    if: >-
      ${{
      (github.event.issue.pull_request || !github.event.issue)
      && (
      github.event_name != 'issue_comment'
      || github.event.action == 'deleted'
      || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), 'Approved')
      || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), 'Changes requested')
      || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), 'Design-exempt')
      || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), '<!-- t1-sweep-guard-rerun:')
      || contains(format('{0} {1}', github.event.comment.body, github.event.changes.body.from), '/recheck-guards')
      )
      }}
    # END comment-filter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false  # never leave a git credential lying around for anything run later in this job

      - name: Evaluate T1 approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const { pathToFileURL } = require('url');
            const { execSync } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const owner = context.repo.owner, repo = context.repo.repo;
            const MARKER = '<!-- t1-approval-guard:verdict -->';
            // Gate Co-Location: this MUST match the reviewer App's slug in
            // operations/devops/AgentAppToken.psm1 ($script:AgentApps.reviewer.Slug) + GitHub's
            // own "[bot]" suffix convention. If that App is ever renamed, update both (TL review,
            // PR #3487 blocking 2: restrict the bot-review arm to this exact login, not any App).
            const REVIEWER_APP_LOGIN = 'ai-triad-reviewer-jpsnover[bot]';

            // BEGIN github-retry-loader (t/4819): withRetry is the shared helper
            // operations/devops/github-retry.mjs (also used by tier-check.yml). It retries ONLY a
            // 5xx/429 (max 3 attempts, exponential backoff, a WARN per retry) and rethrows
            // otherwise, so exhausted retries still land in the CANNOT EVALUATE catch. It replaces
            // the old inline loop, which also retried 4xx. Loaded from the DEFAULT BRANCH'S LIVE TIP
            // via git show, never the PR tree, so a PR cannot weaken it. If it is missing
            // (bootstrap) or cannot be loaded, calls run once, unretried, with a WARN.
            let withRetry = (label, fn) => fn();
            try {
              const defaultBranch = context.payload.repository?.default_branch || 'main';
              execSync(`git fetch origin ${JSON.stringify(defaultBranch)}`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
              const helperSha = execSync('git rev-parse FETCH_HEAD', { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' }).trim();
              const helperText = execSync(`git show ${helperSha}:operations/devops/github-retry.mjs`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
              const helperDir = fs.mkdtempSync(path.join(os.tmpdir(), 't1-approval-guard-retry-'));
              const helperPath = path.join(helperDir, 'github-retry.mjs');
              fs.writeFileSync(helperPath, helperText);
              const { withGitHubRetry } = await import(pathToFileURL(helperPath).href);
              withRetry = (label, fn) => withGitHubRetry(label, fn, {
                warn: (m) => core.warning(m),
                sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
                prefix: 't1-approval-guard',
              });
            } catch (err) {
              core.warning(`WARN t1-approval-guard: retry helper not loadable from the default branch tip (${String(err && err.message ? err.message : err).split('\n')[0]}) -- GitHub calls in this run are NOT retried.`);
            }
            // END github-retry-loader

            async function postVerdictComment(prNumber, body) {
              const comments = await withRetry('issues.listComments', () => github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 }));
              const existing = comments.find((c) => c.body?.includes(MARKER));
              if (existing) {
                await withRetry('issues.updateComment', () => github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body }));
              } else {
                await withRetry('issues.createComment', () => github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }));
              }
            }

            // Explicitly posts the PR-visible check, pinned to the PR's own head SHA, for every
            // trigger type uniformly (the fix this comment block's header explains). conclusion
            // is 'success' or 'failure'. CANNOT EVALUATE also concludes 'failure', NEVER 'neutral':
            // GitHub counts a neutral check run as satisfying a required check, so a neutral
            // CANNOT EVALUATE would let an API outage that exhausts the retries PASS the gate
            // (fail-open). t/4819, TL condition p/12#44.
            //
            // t/534 (PI decision t/531 items 1 and 4): ONE ROW PER HEAD while it is pending.
            // `conclusion` may also be 'pending' (awaiting review): the run is left `in_progress`,
            // never failed. A later evaluation at the same head UPDATES that run while it is still
            // in progress, so the approval settles the row the push opened instead of adding a
            // green row beside a red or pending one (#5392). Once our run has COMPLETED, every
            // later evaluation CREATES a new run instead (Lead t/534#9 point 2): GitHub is not
            // shown to move a completed run back to in_progress or change its conclusion, so a
            // dismissal or a new changes-request must never rely on rewriting a green run.
            // enqueue-pr.mjs reads the LATEST non-skipped run at the head, so the new one decides.
            // If the lookup or the update fails, a new run is created too (WARN). ci.yml's
            // merge_group job shares the name but never sets this external_id, so it is never
            // picked up here.
            //
            // CHECK_EXTERNAL_ID IS NOT PROOF OF ORIGIN (Lead t/534#9 point 3). Any Actions run with
            // `checks: write`, including one running a PR's own workflow, can create a
            // `t1-approval-guard` run with this external_id under the same `github-actions` app, and
            // findOwnCheckRun would then pick it up. It only selects which display row to update.
            // That is harmless solely because the row is display only: enqueue-pr.mjs and the
            // sweeps decide from the reviews and comments themselves (t/534 part A, Security
            // condition 3) and never read this row as an input. Never treat it as an identity.
            const CHECK_EXTERNAL_ID = 't1-approval-guard:api';
            async function findOwnCheckRun(headSha) {
              const runs = await withRetry('checks.listForRef', () => github.paginate(github.rest.checks.listForRef, { owner, repo, ref: headSha, check_name: 't1-approval-guard', filter: 'all', per_page: 100 }));
              const own = (runs || []).filter((r) => r.external_id === CHECK_EXTERNAL_ID && r.app?.slug === 'github-actions');
              own.sort((a, b) => new Date(b.started_at) - new Date(a.started_at));
              return own[0] || null;
            }
            async function postCheckRun(headSha, conclusion, title, summary) {
              if (!headSha) return; // nothing to pin to -- a crash before the head SHA was resolved
              const fields = conclusion === 'pending'
                ? { status: 'in_progress', output: { title, summary } }
                : { status: 'completed', conclusion, output: { title, summary } };
              let existing = null;
              try {
                existing = await findOwnCheckRun(headSha);
              } catch (err) {
                core.warning(`WARN t1-approval-guard: could not list this head's check runs (${String(err && err.message ? err.message : err).split('\n')[0]}); creating a new t1-approval-guard run instead of updating one.`);
              }
              if (existing && existing.status === 'completed') {
                core.info(`t1-approval-guard: check run ${existing.id} at this head has already completed (${existing.conclusion}); creating a new run rather than rewriting a completed one (t/534#9).`);
                existing = null;
              }
              if (existing) {
                try {
                  await withRetry('checks.update', () => github.rest.checks.update({ owner, repo, check_run_id: existing.id, ...fields }));
                  return;
                } catch (err) {
                  core.warning(`WARN t1-approval-guard: could not update check run ${existing.id} (${String(err && err.message ? err.message : err).split('\n')[0]}); creating a new one at this head (the newest run decides).`);
                }
              }
              await withRetry('checks.create', () => github.rest.checks.create({
                owner, repo, name: 't1-approval-guard', head_sha: headSha, external_id: CHECK_EXTERNAL_ID, ...fields,
              }));
            }

            // t/534 part B: a `workflow_run` from the review relay carries the PR in
            // workflow_run.pull_requests (same-repo PRs); otherwise the open PR whose head is the
            // relay run's head_sha. Read from the API, never from the relay's own output.
            async function resolvePrNumber() {
              if (context.payload.pull_request) return context.payload.pull_request.number;
              if (context.payload.issue && context.payload.issue.pull_request) return context.payload.issue.number;
              const wr = context.payload.workflow_run;
              if (wr) {
                // Security (t/537#18): trust pull_requests[0] only when the relay ran on a branch of
                // THIS repository; a fork's run has none, and the API lookup below decides instead.
                const sameRepo = wr.head_repository && wr.head_repository.full_name === `${owner}/${repo}`;
                if (sameRepo && wr.pull_requests && wr.pull_requests.length) return wr.pull_requests[0].number;
                const { data: prs } = await withRetry('repos.listPullRequestsAssociatedWithCommit', () => github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: wr.head_sha }));
                const open = (prs || []).find((p) => p.state === 'open' && p.head && p.head.sha === wr.head_sha);
                return open ? open.number : null;
              }
              return null;
            }

            try {
              await run();
            } catch (err) {
              // A crash must never read as a pass (t/4103's own lesson on tier-check, PR #3155).
              // resolvePrNumber can call the API (workflow_run fallback); its failure here must not
              // skip the setFailed below.
              let prNumber = null;
              try { prNumber = await resolvePrNumber(); } catch (e) { core.error(`t1-approval-guard: could not resolve the PR after the crash either — ${e && e.message}`); }
              core.error(`t1-approval-guard CRASHED: ${err && err.stack ? err.stack : String(err)}`);
              if (prNumber) {
                // t/4819: best-effort. If GitHub is still down (the usual reason we are here),
                // posting throws too -- that must not skip the check run and setFailed below.
                try {
                  await postVerdictComment(prNumber, [
                    MARKER,
                    '**t1-approval-guard: CANNOT EVALUATE**',
                    '',
                    'The check crashed while evaluating this PR — not a pass, not a failure, an unknown.',
                    `Error: \`${String(err && err.message ? err.message : err)}\``,
                  ].join('\n'));
                } catch (postErr) {
                  core.error(`t1-approval-guard: could not post the CANNOT EVALUATE comment either — ${postErr.message}`);
                }
                // Best-effort: re-resolve the head SHA independently of run()'s own progress, so a
                // crash anywhere in run() still gets an explicit, PR-visible check posted.
                try {
                  const { data: pr } = await withRetry('pulls.get', () => github.rest.pulls.get({ owner, repo, pull_number: prNumber }));
                  // BEGIN cannot-evaluate-conclusion (t/4819, TL p/12#44): 'failure', never 'neutral'.
                  await postCheckRun(pr.head.sha, 'failure', 't1-approval-guard: GATE-UNREADABLE (CANNOT EVALUATE)', [
                    'GATE-UNREADABLE: the guard could not read what it needs to decide this PR, so no verdict was produced.',
                    'This is not a pass. The check fails closed until a run can evaluate the PR.',
                    '',
                    `Error: ${String(err && err.message ? err.message : err)}`,
                    '',
                    'Next step: if the error is a GitHub 5xx/429 that outlived its retries, re-run this workflow once the API recovers.',
                  ].join('\n'));
                  // END cannot-evaluate-conclusion
                } catch (postErr) {
                  core.error(`t1-approval-guard: could not post the explicit check run either — ${postErr.message}`);
                }
              }
              core.setFailed(`t1-approval-guard: CANNOT EVALUATE — ${String(err && err.message ? err.message : err)}`);
            }

            async function run() {
            const prNumber = await resolvePrNumber();
            if (!prNumber) {
              core.info('t1-approval-guard: not a PR event (a plain issue comment) — nothing to do.');
              return;
            }

            const { data: pr } = await withRetry('pulls.get', () => github.rest.pulls.get({ owner, repo, pull_number: prNumber }));

            if (pr.base.ref !== 'main') {
              core.info(`t1-approval-guard: base is '${pr.base.ref}', not main — skipped (epic-branch PRs aren't gated here).`);
              return;
            }

            // Security (t/537#18): a relay event is about the head it ran on. If the PR has moved
            // since, skip: a stale workflow_run never acts on a new head (that head's own push or
            // comment events evaluate it).
            const relayHead = context.payload.workflow_run && context.payload.workflow_run.head_sha;
            if (relayHead && pr.head.sha !== relayHead) {
              core.info(`t1-approval-guard: the review relay ran at ${relayHead}, but PR #${prNumber}'s head is now ${pr.head.sha} — skipped (stale workflow_run).`);
              return;
            }

            // Predicate loaded from the BASE branch's live tip, never the PR's own HEAD (e/291 C1
            // precedent via tier-check.yml): a T1 PR must not be able to weaken the very check
            // that's supposed to gate it, by editing the predicate in the same change.
            execSync(`git fetch origin ${JSON.stringify(pr.base.ref)}`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
            const baseTipSha = execSync('git rev-parse FETCH_HEAD', { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' }).trim();

            let basePredicateText;
            try {
              basePredicateText = execSync(`git show ${baseTipSha}:operations/devops/t1-approval-guard-predicate.mjs`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
            } catch {
              core.info('t1-approval-guard: predicate not yet on main\'s tip (bootstrap) — skipped.');
              return;
            }

            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 't1-approval-guard-'));
            const predicatePath = path.join(tmpDir, 't1-approval-guard-predicate.mjs');
            fs.writeFileSync(predicatePath, basePredicateText);
            // t/116: the predicate imports ./role-review-verdicts.mjs (latestRoleVerdicts), so the
            // same base tip's copy goes in the same temp dir. Same file list as ci.yml's merge_group arm.
            const baseVerdictsText = execSync(`git show ${baseTipSha}:operations/devops/role-review-verdicts.mjs`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
            fs.writeFileSync(path.join(tmpDir, 'role-review-verdicts.mjs'), baseVerdictsText);
            const { evaluateT1ApprovalGuard } = await import(pathToFileURL(predicatePath).href);

            const commits = await withRetry('pulls.listCommits', () => github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: prNumber, per_page: 100 }));
            const lastCommit = commits[commits.length - 1];
            const lastPushAt = lastCommit ? (lastCommit.commit.committer?.date || lastCommit.commit.author?.date) : pr.created_at;

            const rawComments = await withRetry('issues.listComments', () => github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 }));
            const approvalComments = rawComments.map((c) => ({ body: c.body, createdAt: c.created_at, updatedAt: c.updated_at, login: c.user?.login }));

            // t/4096 Reviewer switch-over: a real reviewer-App review also satisfies the gate
            // (t/4096#58's T1 decision), alongside the legacy `Approved (<role>):` comment; the
            // predicate applies the same owner-slug self-approval check to both (TL review, PR
            // #3487 blocking 1).
            // t/116: EVERY review is passed (human ones too, with commit_id): the predicate binds
            // each to the head SHA, and any outstanding changes-request at the head -- another
            // role through the shared App, or a human -- blocks. Only the reviewer App's role-tagged
            // body can approve. Same mapping as ci.yml's merge_group arm (keep them identical).
            const rawReviews = await withRetry('pulls.listReviews', () => github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 }));
            const botReviews = rawReviews.map((r) => ({ state: r.state, submittedAt: r.submitted_at, login: r.user?.login, body: r.body, commitId: r.commit_id }));

            const result = evaluateT1ApprovalGuard({ body: pr.body, headRefName: pr.head.ref, headSha: pr.head.sha, lastPushAt, approvalComments, botReviews, reviewerAppLogin: REVIEWER_APP_LOGIN });
            core.info(`t1-approval-guard verdict: pass=${result.pass} tier=${result.tier} reason=${result.reason}${result.blockers ? ' blockers=' + JSON.stringify(result.blockers) : ''}`);

            if (result.pass) {
              const okSummary = result.reason === 'not-t1' ? 'not a T1 PR' : 'approved after the latest push';
              await postVerdictComment(prNumber, `${MARKER}\nt1-approval-guard: OK — ${okSummary}.`);
              await postCheckRun(pr.head.sha, 'success', 't1-approval-guard: OK', okSummary);
              return;
            }

            if (result.reason === 'changes-requested-outstanding') {
              const who = result.blockers.map((b) => `\`${b.role}\` (${b.at})`).join(', ');
              await postVerdictComment(prNumber, [
                MARKER,
                `**t1-approval-guard: FAILING** — a changes-request is still outstanding from ${who}.`,
                '',
                'An outstanding changes-request blocks a T1 PR, whatever other roles approved, and a new push does NOT clear it (t/116, TL p/12#58). It clears only when the same role posts a later `Approved (<role>):` (the same human approves, for a human review), or when the review is dismissed. A request with no recognizable role clears only by dismissing that review (or editing or deleting that comment).',
                '',
                '_This check is warn-only (not yet a required context) — see t/4247._',
              ].join('\n'));
              await postCheckRun(pr.head.sha, 'failure', 't1-approval-guard: FAILING', `T1 PR #${prNumber} has an outstanding changes-request from ${who}.`);
              core.setFailed(`t1-approval-guard: T1 PR #${prNumber} has an outstanding changes-request from ${who}.`);
              return;
            }

            // t/534: no approval at the head yet, and no changes-request, is AWAITING REVIEW. The
            // check run is left pending (in_progress) and this job ends success, so no red row is
            // left behind; the approval later settles the same run (postCheckRun). Pending is not
            // a pass: enqueue-pr.mjs reads an in_progress run as `guard_in_progress` and refuses.
            if (result.reason === 'no-post-push-approval') {
              const why = result.summary ? `\n\n${result.summary}` : '';
              await postVerdictComment(prNumber, [
                MARKER,
                '**t1-approval-guard: AWAITING REVIEW (pending)** — this is a declared `Tier: T1` PR with no `Approved (<role>):` approval at the latest push yet.',
                '',
                'This is not a failure. The `t1-approval-guard` check stays pending, and the PR is not enqueued, until a reviewer approves at this head; the approval re-runs this check and settles the same check row to success (no push needed). A new push makes an earlier approval stale, so the check goes back to pending.' + why,
              ].join('\n'));
              await postCheckRun(pr.head.sha, 'pending', 't1-approval-guard: awaiting review', `T1 PR #${prNumber}: awaiting a reviewer approval at ${pr.head.sha.slice(0, 9)}.${result.summary ? ' ' + result.summary : ''}`);
              core.info(`t1-approval-guard: T1 PR #${prNumber} is awaiting review at ${pr.head.sha} -- check left pending, job not failed (t/534).`);
              return;
            }

            await postVerdictComment(prNumber, [
              MARKER,
              '**t1-approval-guard: FAILING** — this is a declared `Tier: T1` PR with no `Approved (<role>):` comment posted after the latest push.',
              '',
              'Per Change Tiers (root AGENTS.md), a T1 PR needs the owner plus one round-robin reviewer\'s approval before merging — arming auto-merge at PR creation does not satisfy that. Wait for a reviewer to post a comment starting `Approved (<role>):`, then this check re-runs and clears automatically (no push needed, it re-runs on new/edited comments).',
              '',
              '_This check is warn-only (not yet a required context) — see t/4247._',
            ].join('\n'));
            await postCheckRun(pr.head.sha, 'failure', 't1-approval-guard: FAILING', `T1 PR #${prNumber} has no post-push approval (${result.reason}).`);
            core.setFailed(`t1-approval-guard: T1 PR #${prNumber} has no post-push approval (${result.reason}).`);
            } // end run()

      # t/314 (t/313 observability): CANONICAL COPY of this step lives in
      # operations/devops/rate-limit-snapshot-step.yml; operations/devops/rate-limit-snapshot-step.test.mjs
      # fails if a guard's copy drifts. Some guards have no checkout, so the step is inline.
      # Records the repo-wide GITHUB_TOKEN installation quota (REST core + GraphQL) as it stands at
      # the end of this job: a snapshot of the shared pool, not this job's own usage, and App tokens
      # are not in it. GET /rate_limit does not count against the PRIMARY limit but can count against
      # the secondary one (GitHub REST rate-limits doc). Never fails the job; timeout-minutes bounds a
      # hung call, since continue-on-error does not (Second-Opinion, #5029).
      - name: Rate-limit snapshot (t/314)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Comma-joined, read with IFS=, (not whitespace), so an empty field can't shift the
          # later values; each value must be a number on its own (Quality, #5028 review).
          allnum() { for v in "$@"; do [[ "$v" =~ ^[0-9]+$ ]] || return 1; done; }
          if out=$(gh api rate_limit --jq '[.resources.core.used, .resources.core.remaining, .resources.core.limit, .resources.core.reset, .resources.graphql.used, .resources.graphql.remaining, .resources.graphql.limit] | map(tostring) | join(",")' 2>&1) \
            && IFS=, read -r cu cr cl creset gu gr gl extra <<<"$out" && [ -z "$extra" ] && allnum "$cu" "$cr" "$cl" "$creset" "$gu" "$gr" "$gl"; then
            reset=$(date -u -d "@$creset" +%H:%M:%SZ 2>/dev/null || echo "$creset")
            echo "t/314 rate-limit: workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB core used=$cu remaining=$cr limit=$cl reset=$reset graphql used=$gu remaining=$gr limit=$gl"
            {
              echo "### GITHUB_TOKEN rate limit at end of job (t/314)"
              echo ""
              echo "| API | used | remaining | limit |"
              echo "|---|---|---|---|"
              echo "| REST core | $cu | $cr | $cl |"
              echo "| GraphQL | $gu | $gr | $gl |"
              echo ""
              echo "REST core window resets at $reset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::t/314: could not read GET /rate_limit, so no rate-limit snapshot for this job (${out:-no output})."
          fi
