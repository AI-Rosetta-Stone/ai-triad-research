# ─── Dependabot Weekly ───
# What:  Weekly schedule that triggers a fresh container image build when any
#        Dependabot PR merged in the last 7 days, so dependency bumps reach an
#        image. Does NOT auto-deploy to production — production deploy remains a
#        manual owner-triggered step (p/247).
# When:  Mondays at 09:00 UTC (after the weekend Dependabot batch). Also
#        triggerable via workflow_dispatch with an optional dry_run mode.
# Merging: this workflow NO LONGER MERGES. It used a bare `gh pr merge` with
#        GITHUB_TOKEN, which AGENTS.md forbids (main lands only through the merge
#        queue) and which never got PRs into the queue. dependabot-auto-merge.yml
#        arms minor/patch bumps and dependabot-enqueue-sweep.yml enqueues them.
# After: Monitor the triggered Container Image workflow run in the Actions tab.
#        When satisfied, manually trigger deploy-azure.yml for production with the built
#        commit: gh workflow run deploy-azure.yml -f environment=production -f sha=<commit>
#        (t/3679 deploy-by-digest: `sha` is required — there is no image_tag/:latest path).

name: Dependabot Weekly

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count recent Dependabot merges without building'
        required: false
        default: false
        type: boolean

permissions:
  contents: read         # list merged PRs
  pull-requests: read    # list merged PRs
  actions: write         # trigger the container workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # No checkout in these jobs, so gh cannot infer the repo from .git ("fatal: not a git repository").
  # Every scheduled run since at least 2026-09-14 failed on this, unnoticed (t/4058).
  GH_REPO: ${{ github.repository }}

jobs:
  # ── Step 1: Count Dependabot PRs merged in the last 7 days ────────────────
  count-merges:
    runs-on: ubuntu-latest
    outputs:
      merged_count: ${{ steps.count.outputs.merged_count }}
    steps:
      - name: Count Dependabot PRs merged in the last 7 days
        id: count
        run: |
          echo "=== Dependabot Weekly — $(date -u '+%Y-%m-%d %H:%M UTC') ==="
          SINCE=$(date -u -d '7 days ago' '+%Y-%m-%d')
          MERGED_JSON=$(gh pr list \
            --author "app/dependabot" \
            --state merged \
            --search "merged:>=$SINCE" \
            --json number,title,mergedAt \
            --limit 100)
          COUNT=$(echo "$MERGED_JSON" | jq 'length')
          echo "Dependabot PRs merged since $SINCE: $COUNT"
          echo "$MERGED_JSON" | jq -r '.[] | "  #\(.number) \(.mergedAt) \(.title)"'
          echo "merged_count=$COUNT" >> "$GITHUB_OUTPUT"

  # ── Step 2: Build a fresh container image ──────────────────────────────────
  # Skipped when no Dependabot PRs merged in the last 7 days, or in dry-run mode.
  # Production deploy is NOT triggered here — run deploy-azure.yml manually with the built
  # commit: gh workflow run deploy-azure.yml -f environment=production -f sha=<commit> (t/3679).
  build-image:
    needs: [count-merges]
    if: needs.count-merges.outputs.merged_count > 0 && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger container image build
        run: |
          echo "Triggering container.yml (push=true)..."
          gh workflow run container.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field push=true

      - name: Wait for container build to complete
        timeout-minutes: 30
        run: |
          # Give GitHub a moment to queue the run
          sleep 15

          # Find the run ID of the workflow we just triggered
          for attempt in $(seq 1 10); do
            RUN_ID=$(gh run list \
              --workflow container.yml \
              --branch main \
              --limit 1 \
              --json databaseId,status \
              --jq '.[0] | select(.status != "completed") | .databaseId' 2>/dev/null || echo "")
            if [ -n "$RUN_ID" ]; then
              echo "Found in-progress container build: run $RUN_ID"
              break
            fi
            echo "  Waiting for run to appear (attempt $attempt/10)..."
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find the container build run. Check the Actions tab."
            exit 1
          fi

          echo "Waiting for run $RUN_ID to complete..."
          gh run watch "$RUN_ID" --exit-status
          echo "Container build completed successfully."

      - name: Summary
        run: |
          echo "=== Dependabot Weekly summary ==="
          echo "  Dependabot PRs merged (last 7 days): ${{ needs.count-merges.outputs.merged_count }}"
          echo "  Container build: triggered and completed"
          echo "  Production:      NOT auto-deployed — run: gh workflow run deploy-azure.yml -f environment=production -f sha=<commit> (t/3679; sha required)"
