name: tier-check

# Advisory tier-declaration check (t/4103, t/4092 SO dissent 2). Never blocks a merge, never
# touches labels or merge state — comment-only. Promotion to required is a separate T2 PR.
#
# t/4266 P1 (TL p/331#2585): runs as `pull_request_target` so GitHub sources THIS FILE from
# `main`, never the PR's own copy -- a PR can no longer disable or weaken evaluation by editing
# tier-check.yml itself (proven live, PR #3447: a pull_request_target check-run attaches to the
# PR's head SHA while the job's own code is base-branch code -- github.sha here is main's tip,
# not the PR). Hardening, per the TL's checklist: minimal permissions, never checkout the PR
# head with credentials (default checkout under pull_request_target fetches BASE only), and the
# head is read through the API (PR files/content), never git-diffed or git-shown locally. The
# self-test suite that used to run inline here now runs in ci.yml's gate-self-health job under
# plain `pull_request` with zero permissions (t/4266) -- this job never executes PR code at all.
#
# t/4266 P2 fix 4 (TL t/4266#13): without issue_comment/pull_request_review triggers, R6 only
# re-evaluates on a push -- but a push invalidates R6's head-bound approval evidence, so a PR
# that gets approved AFTER its last push would stay red forever once R6 is promoted to blocking
# (a deadlock). Re-run on the same events t1-approval-guard.yml already triggers on.
on:
  pull_request_target:
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

jobs:
  tier-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false  # never leave a git credential lying around for anything run later in this job

      - name: Evaluate tier declaration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const { pathToFileURL } = require('url');
            const { execSync } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const owner = context.repo.owner, repo = context.repo.repo;
            // t/4266 P2 fix 4: issue_comment fires on every issue, not just PRs -- filter to PRs
            // only (same check t1-approval-guard.yml's resolvePrNumber already applies).
            function resolvePrNumber() {
              if (context.payload.pull_request) return context.payload.pull_request.number;
              if (context.payload.issue && context.payload.issue.pull_request) return context.payload.issue.number;
              return null;
            }
            const prNumber = resolvePrNumber();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const MARKER = '<!-- tier-check:verdict -->';

            async function postVerdictComment(body, { createIfAbsent } = { createIfAbsent: true }) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
              const existing = comments.find((c) => c.body?.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else if (createIfAbsent) {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            try {
              if (!prNumber) {
                core.info('tier-check: not a PR event (a plain issue comment) -- nothing to do.');
              } else {
                await run();
              }
            } catch (err) {
              // A crash must never read as a verdict, and silence must never read as a pass
              // (t/4103, Lead review on PR #3155 run 37804716313 -- continue-on-error hid a
              // TypeError behind a reported "success" for 10 consecutive runs on main).
              const message = err && err.stack ? err.stack : String(err);
              core.error(`tier-check CRASHED: ${message}`);
              await postVerdictComment([
                MARKER,
                '**tier-check: CANNOT EVALUATE**',
                '',
                'The check crashed while evaluating this PR. No tier verdict was produced -- this',
                'is not a pass and not a failure, it is an unknown.',
                '',
                `Error: \`${String(err && err.message ? err.message : err)}\``,
                `Run: ${runUrl}`,
              ].join('\n'));
              core.setFailed(`CANNOT EVALUATE: ${String(err && err.message ? err.message : err)}`);
            }

            async function run() {
            // Config and predicate load from the BASE BRANCH'S LIVE TIP, not the PR's own merge
            // ref (so a PR cannot narrow R1 or weaken a rule in the same change that should be
            // caught by it) and not the PR's pinned `base.sha` either (t/4103#14, PR #3155
            // postmortem round 2: a PR opened before a predicate change landed on main has a
            // stale `base.sha` that predates exports the workflow now depends on -- loading from
            // the live tip instead fixes the staleness while keeping the anti-self-narrowing
            // guarantee, since the PR's own commits are never on base's tip regardless).
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const headSha = pr.head.sha;
            execSync(`git fetch origin ${JSON.stringify(pr.base.ref)}`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
            const baseTipSha = execSync(`git rev-parse FETCH_HEAD`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' }).trim();

            function showFromBase(repoPath) {
              try {
                return execSync(`git show ${baseTipSha}:${repoPath}`, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8', maxBuffer: 1024 * 1024 * 16 });
              } catch {
                return null;
              }
            }

            const baseConfigText = showFromBase('.github/ci/tier-paths.json');
            const basePredicateText = showFromBase('operations/devops/tier-check-predicate.mjs');

            // t/4266 P1: under `pull_request_target`, the checked-out tree is BASE only -- the
            // head is read exclusively through the API, never via a local checkout or git-fetch
            // of the PR's ref (which would pull untrusted content into this job's working tree).
            async function readFromHead(repoPath) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: repoPath, ref: headSha });
                if (Array.isArray(data) || !data.content) return null;
                return Buffer.from(data.content, data.encoding ?? 'base64').toString('utf8');
              } catch {
                return null;
              }
            }

            // The HEAD copy of the predicate is NOT trusted: under `pull_request_target` the
            // workflow FILE is base's, but the repo's other files at the head commit are still
            // whatever the PR wrote. It is NEVER imported (e/291 SO C1): an import runs the
            // head's top-level code in this step's realm, where it could patch
            // Array.prototype.some, RegExp.prototype.test or github.paginate before the fallback
            // runs. Its expected TIER_CHECK_API is read from the file's TEXT (via the API, not a
            // local checkout) with a fixed regex; anything unparseable reads as null and forces
            // the skew path, which then runs the self-contained inlineR1Fallback below, so an R1
            // path is still flagged (t/4103: the #3172 fallback had called headModule.evaluateR1Only).
            let headApi = null;
            const headText = await readFromHead('operations/devops/tier-check-predicate.mjs');
            if (headText !== null) {
              const apiMatch = /^export const TIER_CHECK_API\s*=\s*(\d+)\s*;/m.exec(headText);
              headApi = apiMatch ? Number(apiMatch[1]) : null;
            }

            async function postSkippedVerdict(reason) {
              core.info(`tier-check: verdict skipped (skew/bootstrap) -- ${reason}`);
              await postVerdictComment([
                MARKER,
                `_tier-check: verdict skipped (skew/bootstrap) -- ${reason}_`,
              ].join('\n'));
            }

            // BEGIN r1-inline
            // R1 fallback, SELF-CONTAINED: the block itself imports nothing, and the step never
            // imports the head predicate (its API is read as text above) (t/4103, e/291 C1).
            // Under `pull_request` the head predicate module IS the PR, so calling its
            // evaluateR1Only let a PR that bumps TIER_CHECK_API (forcing this skew path) also
            // stub the matcher and get "skipped" while touching an R1 path. Only the base-tip
            // CONFIG (JSON) is read here. The remaining blank: a PR that edits this workflow
            // file itself, which only promotion to a required, base-pinned check closes.
            // tier-check-workflow.test.mjs extracts and runs this exact block.
            function inlineR1Fallback(files, body, config) {
              // A rename away from an R1 path is still an R1 change (e/291 SO C2): judge the old name too.
              const paths = [];
              for (const f of files || []) {
                if (f && typeof f.filename === 'string') paths.push(f.filename);
                if (f && typeof f.previous_filename === 'string') paths.push(f.previous_filename);
              }
              const firstLine = String(body || '').trim().split('\n')[0].trim();
              const m = /^Tier:\s*T([012])\b/.exec(firstLine);
              const tier = m ? 'T' + m[1] : null;
              const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const globMatch = (p, g) => new RegExp('^' + g.split('*').map(esc).join('.*') + '$').test(p);
              let hit = null;
              for (const p of paths) {
                if ((config.r1Paths || []).includes(p) || (config.r1Globs || []).some((g) => globMatch(p, g))) { hit = p; break; }
              }
              if (hit && tier !== 'T2') return { pass: false, tier, comments: ['R1: touches ' + hit + ', must declare Tier: T2'] };
              return { pass: true, tier, comments: [] };
            }
            // END r1-inline

            async function r1FallbackCheck(config, reason) {
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
              const result = inlineR1Fallback(files, pr.body, config);
              const tier = result.tier;
              if (!result.pass) {
                await postVerdictComment([
                  MARKER,
                  `**tier-check (advisory)** — declared tier: \`${tier ?? '(none)'}\``,
                  '',
                  ...result.comments.map((c) => `- ${c}`),
                  '',
                  '_This check is advisory and never blocks a merge. See t/4103._',
                ].join('\n'));
                return;
              }
              await postSkippedVerdict(reason);
            }

            if (baseConfigText === null) {
              // True bootstrap: base has no config at all, so not even R1 can be checked.
              await postSkippedVerdict("not yet installed on the base branch's tip. Once this PR merges, later PRs are judged by main's rules.");
              return;
            }

            const config = JSON.parse(baseConfigText);

            if (basePredicateText === null) {
              await r1FallbackCheck(config, "predicate not yet installed on the base branch's tip (config present, predicate code missing)");
              return;
            }

            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'tier-check-base-'));
            const predicatePath = path.join(tmpDir, 'tier-check-predicate.mjs');
            fs.writeFileSync(predicatePath, basePredicateText);
            const baseModule = await import(pathToFileURL(predicatePath).href);

            // checkApiVersion comes from the BASE module (trusted); the head contributes only a number.
            const apiCheck = baseModule.checkApiVersion(baseModule.TIER_CHECK_API, headApi);
            if (!apiCheck.compatible) {
              await r1FallbackCheck(config, apiCheck.reason);
              return;
            }

            const { evaluateTierCheck, factsFromListFiles } = baseModule;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
            const { paths } = factsFromListFiles(files);

            // t/4266 P1: R2a/R2c's added/removed lines come from `pulls.listFiles`'s own
            // `.patch` (a unified-diff hunk string, already fetched above via the API) --
            // never from a local `git diff` against the head commit, which `pull_request_target`
            // never checks out. A file with no `.patch` (binary, or too large -- GitHub omits it
            // past a size threshold) reads as no added/removed lines, same fail-safe shape as a
            // `git diff` that found nothing.
            const filesByPath = new Map();
            for (const f of files) {
              if (f && typeof f.filename === 'string') filesByPath.set(f.filename, f);
            }
            function diffLines(path) {
              const patch = filesByPath.get(path)?.patch;
              if (!patch) return { addedLines: [], removedLines: [] };
              const addedLines = [], removedLines = [];
              for (const line of patch.split('\n')) {
                if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@')) continue;
                if (line.startsWith('+')) addedLines.push(line.slice(1));
                else if (line.startsWith('-')) removedLines.push(line.slice(1));
              }
              return { addedLines, removedLines };
            }

            // R2a: every changed workflow yml's removed lines.
            const workflowDiffs = paths
              .filter((p) => /^\.github\/workflows\/.*\.ya?ml$/.test(p))
              .map((p) => ({ path: p, ...diffLines(p) }));

            // R2c: every changed path matching the lint-config globs.
            function matchGlob(path, glob) {
              const re = new RegExp('^' + glob.split('*').map((s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$');
              return re.test(path);
            }
            const lintDiffs = paths
              .filter((p) => config.r2cGlobs.some((g) => matchGlob(p, g)))
              .map((p) => ({ path: p, ...diffLines(p) }));

            // R2b: parse ci-gate's `needs:` at base and head, compare sets (not diff lines).
            // Base is read locally (base.ref was fetched above, trusted content); head is read
            // through the API only (t/4266 P1 -- never a local git-show of the head commit).
            function ciGateNeedsFromText(content) {
              if (content === null) return null;
              const m = /^\s*ci-gate:\s*\n\s*name:.*\n\s*needs:\s*\[([^\]]*)\]/m.exec(content);
              if (!m) return null;
              return m[1].split(',').map((s) => s.trim()).filter(Boolean);
            }
            const baseCiGateNeeds = paths.includes('.github/workflows/ci.yml')
              ? ciGateNeedsFromText(showFromBase('.github/workflows/ci.yml')) : null;
            const headCiGateNeeds = paths.includes('.github/workflows/ci.yml')
              ? ciGateNeedsFromText(await readFromHead('.github/workflows/ci.yml')) : null;

            // R6 (t/4266 P2, fixed per t/4266#13/#15): the App review and the SO clearing
            // marker are head-bound (commitId/headSha text) and need no timestamp. The two
            // comment-only paths (Approved (PI): / "SO did not review") have no SHA-binding of
            // their own, so they still need `lastPushAt` freshness (created_at only -- fix 3:
            // never updated_at) or an old one of either would clear every future head forever.
            const rawComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const approvalComments = rawComments.map((c) => ({ body: c.body, createdAt: c.created_at }));
            // Gate Co-Location (t/4266#13 fix 1, same identity t1-approval-guard.yml already
            // trusts): the TL's T2 approval is a reviewer-App review, not a PI comment alone.
            const REVIEWER_APP_LOGIN = 'ai-triad-reviewer-jpsnover[bot]';
            const rawReviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 });
            const reviews = rawReviews.map((r) => ({ state: r.state, commitId: r.commit_id, login: r.user?.login, body: r.body }));
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: prNumber, per_page: 100 });
            const lastCommit = commits[commits.length - 1];
            const lastPushAt = lastCommit ? (lastCommit.commit.committer?.date || lastCommit.commit.author?.date) : pr.created_at;

            const result = evaluateTierCheck({
              body: pr.body,
              headRefName: pr.head.ref,
              paths,
              prCreatedAt: new Date(pr.created_at),
              graceCutoff: new Date(config.graceCutoffISO),
              labels: (pr.labels || []).map((l) => l.name || l),
              config,
              workflowDiffs,
              lintDiffs,
              baseCiGateNeeds,
              headCiGateNeeds,
              approvalComments,
              reviews,
              headSha,
              reviewerAppLogin: REVIEWER_APP_LOGIN,
              lastPushAt,
            });

            core.info(`tier-check verdict: pass=${result.pass} tier=${result.tier} comments=${JSON.stringify(result.comments)}`);

            // BEGIN requirements-note (t/4343): early, cheap visibility into what a declared
            // tier still needs before merge -- surfaced the moment the PR opens, not only once
            // the full CI suite (and the separate, slower gates that actually enforce each
            // requirement) finishes. Informational only: it duplicates no gate's authority and
            // changes no pass/fail outcome, same as every other line this workflow posts.
            // Both notes link to the AGENTS.md source instead of restating it in full, since the
            // restated text itself went stale once already (TL review, t/4343 PR #3518) --
            // tier-check-workflow.test.mjs asserts the linked heading still exists in AGENTS.md.
            // The URL must be ABSOLUTE (TL re-review): a relative `AGENTS.md#...` link in a PR
            // comment resolves against the comment's own page URL, not the repo, and 404s. The
            // URL is passed in rather than read from `context` inside this block, so the
            // function stays pure and the test can call it with no `context` global in scope.
            function tierRequirementsNote(tier, changeTiersUrl) {
              if (tier === 'T1') {
                return `Needs: an \`Approved (<role>):\` approval at the current head from a role other than this PR's owner. Use a reviewer-App review (\`docs/agent-pr-approval.md\`); a comment is accepted during the transition. Enforced by \`t1-approval-guard\`. Arm auto-merge only after it. See [${changeTiersUrl}](${changeTiersUrl}).`;
              }
              if (tier === 'T2') {
                return `Needs: one Second Opinion round, with \`consult-hold\` on until the SO clears this exact head. Then the TL approves (reviewer App). It goes to the PI instead if the SO dissents or didn't review, or if the change is itself a PI-only decision (spend, secrets policy, branch protection, deleting prod data). \`consult-hold-guard\` enforces the label. See [${changeTiersUrl}](${changeTiersUrl}).`;
              }
              return null;
            }
            // END requirements-note

            const changeTiersUrl = `${context.serverUrl}/${owner}/${repo}/blob/main/AGENTS.md#change-tiers-and-decision-rights-t4092-pi-approved-2026-10-07`;
            const requirementsNote = tierRequirementsNote(result.tier, changeTiersUrl);

            if (result.comments.length === 0 && !requirementsNote) {
              await postVerdictComment(`${MARKER}\ntier-check: clean — no advisory findings.`, { createIfAbsent: false });
              core.info('tier-check: clean, nothing to comment.');
              return;
            }

            const body = [
              MARKER,
              `**tier-check (advisory)** — declared tier: \`${result.tier ?? '(none)'}\``,
              '',
              ...result.comments.map((c) => `- ${c}`),
              ...(requirementsNote ? ['', requirementsNote] : []),
              '',
              '_This check is advisory and never blocks a merge. See t/4103._',
            ].join('\n');

            await postVerdictComment(body);
            } // end run()
