name: merge-queue-dequeue-alert

# t/4567 D1 (SO p/836#2, TL-adopted t/4567#38): the immediate, event-driven signal for a
# merge-queue entry dropping silently -- a dequeue GitHub itself initiates (timed-out
# checks, failed checks) starts a `pull_request` event with `action: dequeued` and a
# `reason`. A merge or a manual removal are expected, routine outcomes; anything else
# (CHECKS_TIMED_OUT, FAILED_CHECKS, or any future reason) means the entry left the queue
# without ever merging and without a human choosing to pull it -- exactly the silent-drop
# class t/4567#36 found. This fires immediately, not on a poll cadence; the companion
# merge-queue-liveness.yml is the time-based backstop for whatever this event itself
# fails to catch.
on:
  pull_request:
    types: [dequeued]

permissions:
  issues: write

jobs:
  alert-on-unexpected-dequeue:
    # SO live-fire finding (e/377#2, L1): the reason lives at github.event.reason (top
    # level of the dequeued payload), NOT github.event.pull_request.merge_queue_dequeue_reason
    # -- confirmed via a payload dump (reason: "MERGE" on a clean merge, "CI_FAILURE" on a
    # real test failure). The wrong path here meant this job's `if:` was always false --
    # D1 never ran on this file, even though arm 5b's scratch copy (fixed separately) did.
    #
    # M2 live-fire finding: MANUAL *is* a distinct GitHub reason value (confirmed via a
    # real manual dequeue, not the "manual isn't distinct today" assumption this comment
    # originally made) -- a human/agent choosing to pull a PR is the expected, routine
    # outcome D1 exists to distinguish FROM a silent drop, not to alert on. Exclude it too.
    if: github.event.reason != 'MERGE' && github.event.reason != 'MANUAL'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // t/4567 arm (b) live-fire finding (TL p/331#2497, acceptance condition 1):
            // under HEADGREEN, a CI_FAILURE on a batch's test group can collaterally
            // dequeue a CLEAN entry too, not just the actual culprit -- confirmed on
            // app-scratch (issues #87/#88: a never-individually-tested clean PR #84 was
            // dequeued CI_FAILURE alongside the real culprit #85). Per-entry alerting
            // made each dequeue look like an independent, unexplained failure. This
            // groups every dequeue from the same batch-failure episode into ONE issue so
            // owners see the whole picture, not a confusing solo alert.
            //
            // Collateral-marking heuristic (mechanically justified by the bisection
            // behavior observed live-fire, NOT a guess): each dequeue fires when an entry
            // falls OUT of the group GitHub is currently retesting. If ANOTHER dequeue
            // follows in the same episode, that proves the smaller group (with the
            // earlier entries already removed) STILL failed -- so every entry dequeued
            // so far was insufficient to explain the failure alone, i.e. collateral.
            // Only the LAST entry dequeued in an episode (the one whose removal finally
            // let a smaller group pass) is left unmarked as the probable actual cause.
            // GitHub never confirms this explicitly, so it stays "probable," but the
            // logic is sound: this alert never asserts something it didn't observe.
            const owner = context.repo.owner, repo = context.repo.repo;
            const pr = context.payload.pull_request;
            // Fail toward alerting, not silence -- an unrecognized/missing reason is NOT
            // the same as a known-safe one.
            const reason = context.payload.reason || 'unknown';
            const shortSha = pr.head.sha.slice(0, 7);
            const entryLine = `- [ ] PR #${pr.number} @ \`${shortSha}\` (reason: \`${reason}\`) -- ${pr.html_url}`;
            const BATCH_LABEL = 'merge-queue-dequeue-batch';
            // A real suite is ~25-30min/round and a batch can take several bisection
            // rounds (max_entries_to_build: 4) -- generous window so a slow multi-round
            // episode still correlates into one issue instead of splintering.
            const WINDOW_MS = 3 * 60 * 60 * 1000;
            const now = Date.now();

            const { data: candidates } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: BATCH_LABEL, sort: 'updated', direction: 'desc', per_page: 5,
            });
            const batchIssue = candidates.find(i => (now - new Date(i.updated_at).getTime()) < WINDOW_MS);

            if (!batchIssue) {
              const body = `**Merge-queue dequeue batch (t/4567 D1):** one or more PRs have left the merge queue without merging in this episode.\n\n`
                + `Under HEADGREEN, a batch-failure bisection can collaterally dequeue a CLEAN entry along with the actual culprit (t/4567 arm b, app-scratch #87/#88) -- any entry below marked \`[ ]\` is unresolved; once a LATER entry is added to this issue, every earlier entry is retroactively marked \`[COLLATERAL]\` (proven insufficient alone to explain the failure, since removing it didn't let a smaller group pass). The last entry added before this issue goes quiet is the probable actual cause, though GitHub never confirms that explicitly.\n\n`
                + `**Every PR below: re-arm pinned to your current head** (\`gh pr merge <N> --auto --squash --match-head-commit <sha>\`) to re-test individually. Do not blindly auto-re-enqueue without checking your own head is still intended -- this workflow never re-enqueues for you.\n\n${entryLine}`;
              const created = await github.rest.issues.create({
                owner, repo,
                title: `Merge-queue dequeue batch (t/4567 D1), starting PR #${pr.number}`,
                body,
                labels: ['alert-escalated', BATCH_LABEL],
              });
              console.log(`::warning::Created batch dequeue issue #${created.data.number} for PR #${pr.number} (reason: ${reason})`);
            } else {
              const { data: full } = await github.rest.issues.get({ owner, repo, issue_number: batchIssue.number });
              // Retroactively mark every still-open checklist line as collateral -- a
              // later dequeue in the SAME episode proves each earlier one, alone, did
              // not explain the failure.
              const updatedBody = full.body
                .split('\n')
                .map(line => line.startsWith('- [ ] ') ? line.replace('- [ ] ', '- [x] [COLLATERAL] ') : line)
                .concat([entryLine])
                .join('\n');
              await github.rest.issues.update({ owner, repo, issue_number: batchIssue.number, body: updatedBody });
              await github.rest.issues.createComment({
                owner, repo, issue_number: batchIssue.number,
                body: `PR #${pr.number} @ \`${shortSha}\` (reason: \`${reason}\`) also dequeued -- every entry listed before this one is now marked \`[COLLATERAL]\`. Re-arm pinned to re-test.`,
              });
              console.log(`::warning::Appended PR #${pr.number} to existing batch dequeue issue #${batchIssue.number} (reason: ${reason})`);
            }
