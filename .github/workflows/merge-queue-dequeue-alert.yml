name: merge-queue-dequeue-alert

# t/4567 D1 (SO p/836#2, TL-adopted t/4567#38): the immediate, event-driven signal for a
# merge-queue entry dropping silently -- a dequeue GitHub itself initiates (timed-out
# checks, failed checks) starts a `pull_request` event with `action: dequeued` and a
# `reason`. A merge or a manual removal are expected, routine outcomes; anything else
# (CHECKS_TIMED_OUT, FAILED_CHECKS, or any future reason) means the entry left the queue
# without ever merging and without a human choosing to pull it -- exactly the silent-drop
# class t/4567#36 found. This fires immediately, not on a poll cadence; the companion
# merge-queue-liveness.yml is the time-based backstop for whatever this event itself
# fails to catch.
on:
  pull_request:
    types: [dequeued]

permissions:
  issues: write

# t/4567 SO L3 (e/392#2/#3): two dequeues in the same episode can fire close together,
# and the read-modify-write on the shared batch issue below isn't atomic -- without
# this, two concurrent runs could both see "no open batch issue" and create duplicates,
# or both read the same body and one's update could clobber the other's (lost update).
# `cancel-in-progress: false` -- each dequeue MUST be processed, never dropped; this
# only serializes (queues), it never cancels a run.
concurrency:
  group: merge-queue-dequeue-alert
  cancel-in-progress: false

jobs:
  alert-on-unexpected-dequeue:
    # SO live-fire finding (e/377#2, L1): the reason lives at github.event.reason (top
    # level of the dequeued payload), NOT github.event.pull_request.merge_queue_dequeue_reason
    # -- confirmed via a payload dump (reason: "MERGE" on a clean merge, "CI_FAILURE" on a
    # real test failure). The wrong path here meant this job's `if:` was always false --
    # D1 never ran on this file, even though arm 5b's scratch copy (fixed separately) did.
    #
    # M2 live-fire finding: MANUAL *is* a distinct GitHub reason value (confirmed via a
    # real manual dequeue, not the "manual isn't distinct today" assumption this comment
    # originally made) -- a human/agent choosing to pull a PR is the expected, routine
    # outcome D1 exists to distinguish FROM a silent drop, not to alert on. Exclude it too.
    if: github.event.reason != 'MERGE' && github.event.reason != 'MANUAL'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // t/4567 arm (b)/(c) live-fire finding (TL p/331#2497, acceptance condition
            // 1): under HEADGREEN, a CI_FAILURE OR a consult-hold on a batch's test
            // group can collaterally dequeue a CLEAN entry too, not just the actual
            // culprit -- confirmed on app-scratch (#87/#88 real-failure arm; #89/#90/#93
            // hold arm). Per-entry alerting made each dequeue look like an independent,
            // unexplained failure. This groups every dequeue from the same
            // batch-failure episode into ONE issue so owners see the whole picture.
            //
            // SO L1 (e/392#2, HIGH; TL-adopted e/392#3, taking the SO's first option):
            // do NOT mark any entry [COLLATERAL]/"the cause". The original heuristic
            // ("every earlier entry is collateral, the last one is the cause") assumed
            // exactly one episode where collateral entries dequeue before the real
            // culprit -- both assumptions break with a consult-hold (arm c) or an
            // unrelated second failure inside the window, which could mislabel the REAL
            // culprit as collateral. List every dequeued PR plainly instead; GitHub
            // never tells us which one actually caused the failure, so this alert
            // never asserts a guess as fact.
            const owner = context.repo.owner, repo = context.repo.repo;
            const pr = context.payload.pull_request;
            // Fail toward alerting, not silence -- an unrecognized/missing reason is NOT
            // the same as a known-safe one.
            const reason = context.payload.reason || 'unknown';
            const shortSha = pr.head.sha.slice(0, 7);
            const entryLine = `- PR #${pr.number} @ \`${shortSha}\` (reason: \`${reason}\`) -- ${pr.html_url}`;
            const BATCH_LABEL = 'merge-queue-dequeue-batch';
            // A real suite is ~25-30min/round and a batch can take several bisection
            // rounds (max_entries_to_build: 4) -- generous window so a slow multi-round
            // episode still correlates into one issue instead of splintering.
            const WINDOW_MS = 3 * 60 * 60 * 1000;
            const now = Date.now();

            // SO L2 (e/392#2): key the episode window on the issue's CREATED_AT, not
            // updated_at. updated_at changes on ANY comment/edit, so a human replying to
            // an old, resolved episode would silently "revive" it and attach unrelated
            // future dequeues to the wrong issue. created_at is fixed at episode start.
            const { data: candidates } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: BATCH_LABEL, sort: 'created', direction: 'desc', per_page: 5,
            });
            const batchIssue = candidates.find(i => (now - new Date(i.created_at).getTime()) < WINDOW_MS);

            if (!batchIssue) {
              const body = `**Merge-queue dequeue batch (t/4567 D1):** one or more PRs have left the merge queue without merging in this episode.\n\n`
                + `Under HEADGREEN, a batch-failure bisection (or a mid-queue consult-hold) can collaterally dequeue a CLEAN entry along with the actual cause (t/4567 arms b/c, app-scratch #87/#88, #89/#90/#93). GitHub does not tell us which entry below actually caused the dequeue -- **some of these may be collateral; re-arm each one pinned to its own head** (\`gh pr merge <N> --auto --squash --match-head-commit <sha>\`) to re-test individually. Do not blindly auto-re-enqueue without checking your own head is still intended -- this workflow never re-enqueues for you.\n\n${entryLine}`;
              const created = await github.rest.issues.create({
                owner, repo,
                title: `Merge-queue dequeue batch (t/4567 D1), starting PR #${pr.number}`,
                body,
                labels: ['alert-escalated', BATCH_LABEL],
              });
              console.log(`::warning::Created batch dequeue issue #${created.data.number} for PR #${pr.number} (reason: ${reason})`);
            } else {
              const { data: full } = await github.rest.issues.get({ owner, repo, issue_number: batchIssue.number });
              const updatedBody = `${full.body}\n${entryLine}`;
              await github.rest.issues.update({ owner, repo, issue_number: batchIssue.number, body: updatedBody });
              await github.rest.issues.createComment({
                owner, repo, issue_number: batchIssue.number,
                body: `PR #${pr.number} @ \`${shortSha}\` (reason: \`${reason}\`) also dequeued in this episode. Re-arm pinned to re-test -- any entry in this issue may be the actual cause or collateral; this alert does not guess which.`,
              });
              console.log(`::warning::Appended PR #${pr.number} to existing batch dequeue issue #${batchIssue.number} (reason: ${reason})`);
            }
