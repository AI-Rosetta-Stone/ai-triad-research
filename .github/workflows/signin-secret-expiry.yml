# ─── Sign-in secret expiry monitor (t/4294) ───
# What:  Weekly, warn-only. Reads the Microsoft (Entra/AAD) sign-in app registration's credential
#        list (displayName + endDateTime only, never a secret value) and warns 30 days before any
#        `easyauth-*` client secret expires, so it gets rotated before users hit AADSTS7000222.
#        Logic: operations/devops/SignInSecretExpiryVerdict.ps1 (pure, Pester-tested in
#        tests/SignInSecretExpiryVerdict.Tests.ps1), via the Test-SignInSecretExpiry.ps1 shim.
# Verdicts: WARN (expiring or expired), CLEAN, UNREADABLE (couldn't read; NEVER reported as clean,
#        t/4496). WARN and UNREADABLE open or update ONE issue (label signin-secret-expiry);
#        CLEAN closes it. Never fails the run on a verdict.
# Google / GitHub: NOT covered. Neither provider's client secrets carry an expiry date, and
#        neither exposes an API that lists them. The script prints this gap on every run.
# Identity: the existing Reader-only monitoring OIDC identity (github-ai-triad-monitor, t/4340).
#        Azure RBAC Reader does not grant Microsoft Graph reads of app registrations; reading the
#        credential list needs Graph Application.Read.All on that identity. Until the PI decides
#        to grant it, this reports UNREADABLE with that reason. No new secrets: AAD_CLIENT_ID is
#        the same repo secret deploy-azure.yml passes to main.bicep as aadClientId.
# Before: Runs on schedule (or workflow_dispatch from main: the monitoring environment only
#        federates main).
# After:  WARN: rotate with operations/devops/Rotate-SignInSecret.ps1 -Provider aad, or delete an
#        expired leftover easyauth-* credential.

name: Sign-in Secret Expiry

on:
  schedule:
    - cron: '43 9 * * 1'  # Mondays 09:43 UTC; off round-minute marks (t/4501 scheduler congestion)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write  # Azure OIDC login (existing monitoring identity)

concurrency:
  group: signin-secret-expiry
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ISSUE_LABEL: signin-secret-expiry

jobs:
  expiry-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # t/4340: the Reader-only monitoring identity, federated to this environment (main-only).
    environment: monitoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Log in to Azure
        id: azlogin
        continue-on-error: true  # a login failure is reported as UNREADABLE below, never as clean
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.MONITOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MONITOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MONITOR_AZURE_SUBSCRIPTION_ID }}

      - name: Check sign-in secret expiry (warn-only, t/4294)
        id: expiry
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          AAD_APP_ID: ${{ secrets.AAD_CLIENT_ID }}
          AZ_LOGIN_OUTCOME: ${{ steps.azlogin.outcome }}
        run: |
          ./operations/devops/Test-SignInSecretExpiry.ps1 `
            -AadAppId $env:AAD_APP_ID `
            -AzLoginOutcome $env:AZ_LOGIN_OUTCOME `
            -OutputPath signin-secret-expiry.json

      - name: Open, update or close the expiry issue
        # !cancelled(): also on a shim failure, where the missing verdict file reads as UNREADABLE.
        # main ref only: a test dispatch from another branch must not comment UNREADABLE on the
        # standing alert issue (owner review, #4774). The verdict step still runs there.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const LABEL = process.env.ISSUE_LABEL;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ts = new Date().toISOString();
            let v;
            try {
              v = JSON.parse(fs.readFileSync('signin-secret-expiry.json', 'utf8'));
            } catch (e) {
              // Fallback: no verdict file means no verdict. Treat it as UNREADABLE, never clean.
              core.warning(`WARN: signin-secret-expiry.json unreadable (${e.message}); treating this run as UNREADABLE`);
              v = { status: 'UNREADABLE', reason: `verdict file unreadable: ${e.message}`, checked: [], providerGaps: [] };
            }
            const status = v.status;
            // listForRepo also returns pull requests; keep issues only, so a PR that happens to carry
            // the label can never be commented on or closed as the alert issue (owner review, #4774).
            const listed = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL, per_page: 5 });
            const existing = { data: listed.data.filter(i => !i.pull_request) };

            if (status === 'CLEAN') {
              for (const issue of existing.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `Resolved at ${ts}: CLEAN, ${v.reason}.\n\n- **Run:** ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              core.info(`CLEAN: ${v.reason}`);
              return;
            }

            const checked = (v.checked || []).map((c) => `- \`${c.displayName}\`: ${c.endDateTime} (${c.daysLeft} day(s) left)`);
            const gaps = (v.providerGaps || []).map((g) => `- ${g}`);
            const action = status === 'WARN'
              ? 'Rotate before expiry: `operations/devops/Rotate-SignInSecret.ps1 -Provider aad -AadAppId <AAD_CLIENT_ID>` (see its R5 pre-first-use warning, t/4288). If a newer `easyauth-*` credential is already live, delete the expired or expiring leftover instead.'
              : 'The check could not read the credential list, so expiry is UNKNOWN (not clean). If the reason is a Graph permission error, the monitoring identity (github-ai-triad-monitor) needs Microsoft Graph `Application.Read.All`. Granting it is a PI decision (t/4294).';
            const title = status === 'WARN'
              ? 'Sign-in client secret expires within 30 days (t/4294)'
              : 'Sign-in secret expiry check is UNREADABLE (t/4294)';
            const detail = [
              `**Microsoft (Entra): ${status}**: ${v.reason}`,
              '',
              ...(checked.length ? checked : ['- (no credentials judged)']),
              '',
              action,
              '',
              '**Not covered by this monitor:**',
              ...gaps,
              '',
              `- **Run:** ${runUrl}`,
              `- **Time:** ${ts}`,
            ].join('\n');

            if (existing.data.length === 0) {
              // lint:alert-label-exempt: t/4294 alert-escalated is applied on the WARN arm (an actual
              // expiry); UNREADABLE is a standing pending-PI-decision state (Graph permission), recorded
              // in this one issue and refreshed weekly rather than escalated hourly by the r/23 bridge.
              await github.rest.issues.create({ owner, repo, title, body: `## Sign-in secret expiry (t/4294)\n\n${detail}`,
                labels: status === 'WARN' ? [LABEL, 'alert-escalated'] : [LABEL] });
              return;
            }
            const issue = existing.data[0];
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Still ${status} at ${ts}.\n\n${detail}` });
            if (issue.title !== title) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, title });
            }
            const escalated = (issue.labels || []).some((l) => (l.name || l) === 'alert-escalated');
            if (status === 'WARN' && !escalated) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['alert-escalated'] });
            }
