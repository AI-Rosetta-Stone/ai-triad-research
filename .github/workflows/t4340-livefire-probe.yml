name: t/4340 Branch-Policy Live-Fire Probe (throwaway, delete after use)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Which environment to probe'
        required: true
        type: choice
        options:
          - production
          - staging
          - monitoring

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: No-op
        run: echo "If this ran, the branch policy did NOT refuse a non-main branch."
