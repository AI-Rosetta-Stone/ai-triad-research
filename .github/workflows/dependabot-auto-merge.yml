# Arms GitHub's NATIVE auto-merge on Dependabot MINOR and PATCH update PRs, but only after a PERSON has
# released the PR by removing its `no-auto-enqueue` label (t/797, t/753). Dependabot PRs open with that
# label (dependabot.yml) so nothing arms or enqueues them until someone has read the commits.
#
# Why this runs on `pull_request_target`, from the base branch (t/797): a `pull_request` run takes its workflow
# file from the PR's merge ref. #5618's base predated the label guard (#5614), so its run used the OLD,
# unguarded copy of this file and armed the PR at 22:57:33Z with the label on it (run 45907959749). A
# `pull_request_target` run always uses the file on the base branch tip, so a stale PR branch cannot run an
# older copy. Nothing in this workflow checks out or runs the PR's code: it only reads the PR through the API
# and arms it. The docker gate is loaded from the default branch, never the PR head.
#
# It does NOT fire on opened, synchronize or reopened: those never arm (a push onto an armed branch must not
# arm anything, and a new PR is held anyway). The only trigger is a label removal by a person.
#
# Since the merge queue (2026-10-28), this arm alone does NOT enqueue: auto-merge armed with GITHUB_TOKEN never
# entered the queue. The arm is the minor/patch POLICY MARKER; enqueue-sweep.yml enqueues armed, green PRs as a
# GitHub App. MAJOR bumps are deliberately excluded: they need human review.
name: Dependabot auto-merge

on:
  pull_request_target:
    types: [unlabeled]

# Least privilege: the job reads the PR and arms auto-merge, nothing else. `contents: write` is what GitHub's enable-auto-merge
# call requires of the token (Dependabot's own documented auto-merge workflow sets the same pair); a token without it cannot arm.
# It is not used to write any file: no step checks out the PR or pushes. Security to confirm (t/797).
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only the release of a Dependabot PR: the removed label is `no-auto-enqueue`, the PR author is Dependabot, the head
    # is in this repository, the base is the default branch, and the label was removed by a person (not a bot: a bot
    # removing the hold must never arm). Event payload values are compared here and never interpolated into a script.
    if: >-
      github.event.label.name == 'no-auto-enqueue' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.sender.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The live labels, through the API, not the event payload: the payload is a snapshot of the moment the event was
      # created. If `no-auto-enqueue` is back (or the labels cannot be read, or the list may be cut short) the step
      # fails, the job fails, and nothing arms (fail closed).
      - name: Read the PR's live labels (fail closed)
        id: labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const number = context.payload.pull_request.number;
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number: number, per_page: 100 });
            if (labels.length >= 100) core.setFailed('t/797: the label list may be cut short; not arming.');
            const held = labels.some((l) => l.name === 'no-auto-enqueue');
            core.info(`t/797 live labels: ${labels.map((l) => l.name).join(', ')} (held=${held})`);
            if (held) core.setFailed('t/797: no-auto-enqueue is on the PR again; not arming.');
            core.setOutput('held', held ? 'true' : 'false');

      # t/315 (t/313 P4): docker updates arm only when every changed FROM keeps the same image:tag
      # and only the @sha256: digest changes. #5015 (python 3.12 -> 3.15) was armed as
      # semver-minor and broke the dev image. The decision is Docker's pure predicate, loaded from
      # the trusted default branch (never the PR head); any failure leaves the PR unarmed.
      - name: Check out the docker gate from the default branch (t/315)
        if: steps.meta.outputs.package-ecosystem == 'docker'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            operations/devops/dependabot-docker-gate.mjs
            operations/devops/docker/docker-digest-only.mjs

      - name: Docker digest-only gate (t/315)
        id: docker_gate
        if: steps.meta.outputs.package-ecosystem == 'docker'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const { pathToFileURL } = require('url');
            const owner = context.repo.owner, repo = context.repo.repo;
            const pr = context.payload.pull_request;
            let verdict;
            try {
              const { dockerAutoMergeVerdict, dockerGateComment, DOCKER_GATE_MARKER } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/operations/devops/dependabot-docker-gate.mjs`).href);
              let files = null;
              try {
                files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
              } catch (e) {
                core.warning(`t/315: could not list changed files (${e.message}); not arming.`);
              }
              // GitHub caps pulls.listFiles at 3000 files; at the cap the list may be incomplete.
              verdict = dockerAutoMergeVerdict({ files, truncated: Array.isArray(files) && files.length >= 3000 });
              if (!verdict.arm) {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                const marker = `${DOCKER_GATE_MARKER}${pr.head.sha} -->`;
                if (!comments.some((c) => (c.body ?? '').includes(marker))) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: dockerGateComment({ headSha: pr.head.sha, reason: verdict.reason }) });
                }
              }
            } catch (e) {
              verdict = { arm: false, reason: `gate error: ${e.message}` };
              core.warning(`t/315: docker gate failed (${e.message}); not arming (fail closed).`);
            }
            core.info(`t/315 docker gate: arm=${verdict.arm} (${verdict.reason})`);
            core.setOutput('arm', verdict.arm ? 'true' : 'false');

      - name: Arm auto-merge for minor/patch bumps
        # Arms only a live-label-clear PR (steps.labels) of a minor or patch update, and a docker one only when the digest-only
        # gate allows it. The URL is built from the repository and the event's numeric PR number only and goes through env; no PR title, branch, label or body is used.
        if: >-
          steps.labels.outputs.held == 'false' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch') &&
          (steps.meta.outputs.package-ecosystem != 'docker' || steps.docker_gate.outputs.arm == 'true')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
