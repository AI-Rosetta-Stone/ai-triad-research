# ─── Sign-In Secret Drift Check (check-only, never deploys) ───
# What:  Runs Test-SignInSecretDrift.ps1 against live prod + staging secrets, with no deploy
#        step anywhere in this file. Structural guarantee (SO e/320, p/331): a workflow that
#        contains only azure/login and the drift step CANNOT reach a deploy, so there is no
#        `if:` guard to miss or later job to add without one — unlike a `check_only` input on
#        deploy-azure.yml, where that guard IS the only thing standing between a check run and
#        an actual prod deploy.
# Why:   t/4288 — before the t/4258 prod hold lifts, prove neither AAD_CLIENT_SECRET nor the
#        other sign-in secrets drifted between their GitHub Actions copy and the live container
#        copies (the exact failure mode that would cause a third sign-in outage on the first
#        post-hold deploy).
# Uses the SAME `environment: production` as deploy-azure.yml's deploy job (SO e/320#4) — without
# it, the environment-scoped secrets and the OIDC federated-credential subject won't resolve
# (t/4273 lesson), and this would silently report "could not read"/"skipped" instead of a real
# comparison.

name: Check Sign-In Secret Drift

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # azure/login OIDC federated-credential exchange

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check sign-in secret drift (t/4288 — SO C1-C4, e/320)
        shell: pwsh
        env:
          AAD_CLIENT_SECRET: ${{ secrets.AAD_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # t/4418: same source deploy-azure.yml's Bicep apply writes; GitHub forbids GITHUB_* secret names.
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          ./operations/devops/Test-SignInSecretDrift.ps1 `
            -ResourceGroup 'ai-triad' `
            -DeploySourceValues @{
              'aad-client-secret'    = $env:AAD_CLIENT_SECRET
              'google-client-secret' = $env:GOOGLE_CLIENT_SECRET
              'github-client-secret' = $env:GH_OAUTH_CLIENT_SECRET
            }
