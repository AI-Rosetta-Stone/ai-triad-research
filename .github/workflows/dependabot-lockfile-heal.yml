# ─── Dependabot Standalone-Lockfile + License-Notices Heal (t/3116 / t/3134) ───
# What:  When a Dependabot PR bumps a taxonomy-editor workspace dependency, the
#        single root `/` Dependabot entry updates member manifests + the shared
#        root pnpm-lock.yaml — but NOT taxonomy-editor's in-dir STANDALONE lockfile
#        (Docker prod-deps) or its generated license notices. Those go stale →
#        test-container / test-electron(taxonomy-editor) red. This workflow
#        re-syncs both and commits them back onto the PR branch so it goes green.
#
# Design: Second Opinion e/127#2 (Option B), TL-approved (t/3116#7). This is the
#        CORRECTED re-introduction after #1668 was reverted (#1674) — the prior
#        version healed on EVERY ecosystem and failed without the credential
#        (t/3134). Fixes here:
#          1. SCOPE: job runs only on npm_and_yarn Dependabot branches, and heals
#             only when the PR diff actually touches taxonomy-editor/package.json
#             (the "Scope guard" step). An unrelated PR produces ZERO commits —
#             this is the GV arm-2 property the prior version failed.
#          2. CREDENTIAL GUARD: if the heal App's secrets (HEAL_APP_CLIENT_ID,
#             HEAL_APP_PRIVATE_KEY) are absent the job SUCCEEDS as a no-op (drift
#             detected but push skipped, never red).
#
# SECURITY (do not refactor without re-reading e/127#2 and t/799#2):
#   * t/799: TWO JOBS. `prepare` checks the PR out by SHA and runs PR-controlled code (the lockfile sync, pnpm, the licenses
#     script) with NO secret; `push` holds the credential and checks out NO PR content and runs NO PR code (the commit is built
#     from git objects, an index, never a working tree). The App secrets are referenced in exactly one step of `push` (the mint).
#     operations/devops/heal-job-isolation-workflow.test.mjs fails if one job ever has both.
#   * t/799 step 3: the write credential is a SHORT-LIVED GitHub App installation token, minted in `push` after the validate step and
#     right before the push step (actions/create-github-app-token, narrowed to this repository and contents: write), passed to the push
#     step by env and revoked by the action's post step when the job ends. `prepare` references neither secret. It replaced a classic,
#     repo-wide personal access token (Security t/799#1, #8; PI decision via the TL, p/9#797).
#   * `--lockfile-only` (inside sync-standalone-lockfile.mjs) + `--ignore-scripts`
#     belt → no registry lifecycle script executes during a resolve.
#   * Guard requires actor == dependabot[bot] AND same-repo head → forks excluded.
#   * An installation-token push (unlike GITHUB_TOKEN) DOES retrigger CI so the heal commit gets
#     fresh checks. Do not "simplify" to the default token.
#   * Auth is passed via http.extraheader (not the remote URL) so the token is
#     never materialized in a URL or log line.
#
# CREDENTIAL (PI / org owner, Security t/799#8): the GitHub App `ai-triad-dependabot-heal`, created under the org, Repository
#   permissions contents: write and metadata: read only, no webhook, installed on this repository only. Its Client ID and one private key
#   are stored as DEPENDABOT secrets (Dependabot-triggered runs read the Dependabot secret store, not the Actions store) named
#   HEAL_APP_CLIENT_ID and HEAL_APP_PRIVATE_KEY. Until both exist this workflow heals nothing: it prints a notice and stays green.
#   The pusher is `ai-triad-dependabot-heal[bot]` and a healed PR still needs a T1 review (t/773 option A).
#
# NOTE: lib/debate is NOT healed here — its root-workspace importer is empty (the
#   root entry never bumps it); its standalone lockfile is managed by the
#   /lib/debate Dependabot entry. Extend sync-standalone-lockfile.mjs + this scope
#   guard if that ever changes.
#
# POST-MERGE WATCH-ITEM (GV condition, t/3134; t/799 step 5): the installation-token push retriggering CI is
#   only observable once this workflow is on main (a pull_request workflow runs
#   from the BASE branch) AND the App secrets exist. VERIFY on the FIRST taxonomy-editor-touching Dependabot
#   npm PR after that: the heal commits as `ai-triad-dependabot-heal[bot]` → checks start on the heal commit → the
#   token is masked and revoked → no file other than the three allowed ones changed. If it loops/reds (e.g. the push fails to
#   retrigger, or an empty commit), REVERT per #1674 and re-open t/3134.

name: Dependabot Lockfile Heal

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-heal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # t/799 (Security t/799#2): the heal is split in two jobs so that PR-controlled code and the write credential never share a
  # job. `prepare` has NO secret: it checks the PR out by SHA, runs the classifier and the lockfile work, and uploads only the
  # three allowed files as an artifact. `push` has the credential and NO PR checkout: it downloads the artifact, validates its
  # shape, and builds the commit with git plumbing (no working tree of the PR, no PR code runs), then pushes.
  prepare:
    # actor + same-repo head + npm-workspace ecosystem only (skips docker/actions/pip).
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
    # Scripts-off belt via env (pnpm/npm honor NPM_CONFIG_*) — do NOT append to the
    # tracked root .npmrc: that dirties git status and breaks the scoped drift gate
    # below (GV blocker A, t/3134).
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # t/799: by SHA, not branch NAME. `github.head_ref` is the branch tip at run time, so a writer's later push (or a
          # re-run of this event) would check out a different tree from the one the event saw. The SHA is immutable per event.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0            # need base to diff what the PR changed
          persist-credentials: false

      # SCOPE GUARD: heal only when THIS PR changes taxonomy-editor's manifest.
      # An unrelated npm PR (e.g. a poviewer-only bump) leaves this false → the
      # whole heal is skipped → zero commits (GV arm-2). Without this, a branch
      # that is merely behind main would show standalone-lockfile drift and get a
      # spurious heal commit (the #1668 defect).
      - name: Scope guard — does this PR touch taxonomy-editor deps?
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          # Two-dot (endpoint compare), NOT three-dot: a shallow depth-1 base fetch
          # has no merge-base commit once main moves, so `A...HEAD` errors and the
          # heal never runs (GV blocker B, t/3134).
          if git diff --name-only "origin/${BASE_REF}" HEAD | grep -qx 'taxonomy-editor/package.json'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "PR changes taxonomy-editor/package.json — heal in scope."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "PR does not touch taxonomy-editor/package.json — nothing to heal."
          fi

      - name: Set up pnpm
        if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.0.10 (repo-standard pin)
        with:
          run_install: false

      - name: Set up Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6 (repo-standard pin)
        with:
          node-version: 22

      - name: Sync standalone lockfile
        if: steps.scope.outputs.relevant == 'true'
        run: node scripts/sync-standalone-lockfile.mjs

      - name: Regenerate license notices
        if: steps.scope.outputs.relevant == 'true'
        working-directory: taxonomy-editor
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm run licenses

      # Drift = changes to the 3 COMMITTED paths only. Scoping this to exactly
      # what the push job stages is load-bearing: on the healed-head re-run the
      # files are already in sync, so drift=false and the job no-ops — a whole-tree
      # `git status` would flag unrelated churn and drive an empty commit → red
      # (GV blocker A, t/3134).
      - name: Detect drift
        id: drift
        if: steps.scope.outputs.relevant == 'true'
        run: |
          CHANGED="$(git status --porcelain -- \
            taxonomy-editor/pnpm-lock.yaml \
            taxonomy-editor/THIRD-PARTY-NOTICES.txt \
            taxonomy-editor/src/renderer/data/oss-licenses.json)"
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Heal produced changes:"; echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already in sync — nothing to heal."
          fi

      # Only the three allowed files leave this job. They are copied into one staging directory first, so the artifact
      # keeps their repo-relative paths (upload-artifact roots a multi-path upload at the paths' common ancestor).
      # `if-no-files-found: error` makes a missing one a failure, and the push job independently refuses anything
      # but exactly these three paths.
      - name: Stage the three healed files
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for f in taxonomy-editor/pnpm-lock.yaml taxonomy-editor/THIRD-PARTY-NOTICES.txt taxonomy-editor/src/renderer/data/oss-licenses.json; do
            mkdir -p "$RUNNER_TEMP/heal-out/$(dirname "$f")"
            cp -- "$f" "$RUNNER_TEMP/heal-out/$f"
          done

      - name: Upload the three healed files
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: heal-files-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/heal-out
          if-no-files-found: error
          retention-days: 1

  push:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.head_ref }}
      # 'true' only when BOTH App secrets are set. A step `if` cannot read `secrets.*`, so this job-level boolean (it carries no
      # secret, only whether they exist) gates the mint and the push; absent secrets are a notice and a green no-op.
      HEAL_APP_CONFIGURED: ${{ secrets.HEAL_APP_CLIENT_ID != '' && secrets.HEAL_APP_PRIVATE_KEY != '' }}
    steps:
      # The classifier and nothing else, from the DEFAULT branch (never the PR). No PR content is checked out in this job.
      - name: Check out the push-failure classifier from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            operations/devops/classify-heal-push-failure.mjs

      - name: Download the healed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: heal-files-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/heal

      # Shape check before the credential is touched: exactly the three allowed paths, regular files only, each under a size
      # cap, the JSON one parses, and the PR's head is still the SHA this run was started for (else a newer run owns it).
      - name: Validate the artifact and the PR head
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAL="$RUNNER_TEMP/heal"
          EXPECTED_FILES=$'taxonomy-editor/THIRD-PARTY-NOTICES.txt\ntaxonomy-editor/pnpm-lock.yaml\ntaxonomy-editor/src/renderer/data/oss-licenses.json'
          ACTUAL_FILES="$(cd "$HEAL" && find . -type f | sed 's#^\./##' | LC_ALL=C sort)"
          if [ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]; then
            echo "::error::t/799: the artifact is not exactly the three allowed files. Found: $(printf '%s' "$ACTUAL_FILES" | tr '\n' ' ')"
            exit 1
          fi
          if [ -n "$(find "$HEAL" ! -type f ! -type d)" ]; then
            echo "::error::t/799: the artifact holds something other than regular files (a link or device)."
            exit 1
          fi
          if [ -n "$(find "$HEAL" -type f -size +25M)" ]; then
            echo "::error::t/799: a healed file is over the 25 MB cap."
            exit 1
          fi
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$HEAL/taxonomy-editor/src/renderer/data/oss-licenses.json"
          NOW_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$NOW_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::notice::t/799: PR #$PR_NUMBER head moved ($EXPECTED_HEAD -> $NOW_HEAD); a newer run owns the heal. Not pushing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Absent App secrets: a notice and a green no-op (the heal is skipped, never red). Nothing below runs.
      - name: Heal App not configured (no-op)
        if: env.HEAL_APP_CONFIGURED != 'true'
        run: echo "::notice::HEAL_APP_CLIENT_ID / HEAL_APP_PRIVATE_KEY are not both set: drift was detected but the heal is skipped (no-op)."

      # ── SECURITY BOUNDARY ─────────────────────────────────────────────────
      # The write credential is MINTED here, after the validate step and right before the push step: a short-lived installation token
      # of the heal App, narrowed to this repository and contents: write. This job holds NO PR checkout and runs NO PR code: the commit
      # is built from git objects (an index, never a working tree of the PR). The token goes to the push step by env (it is masked)
      # and is revoked by the action's post step when the job ends. Like any App token and UNLIKE the default GITHUB_TOKEN, a push with
      # it RETRIGGERS CI on the heal commit (load-bearing — do NOT "simplify" to the default token).
      - name: Mint the heal App token
        id: app
        if: steps.validate.outputs.ok == 'true' && env.HEAL_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ secrets.HEAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEAL_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit and push heal
        if: steps.validate.outputs.ok == 'true' && env.HEAL_APP_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # A configured App whose token came back empty is an error, never a silent skip.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the minted heal App token is empty although HEAL_APP_CONFIGURED is true."
            exit 1
          fi
          HEAL="$RUNNER_TEMP/heal"
          WORK="$RUNNER_TEMP/healrepo"
          git init -q "$WORK"
          cd "$WORK"
          git config user.name "dependabot-heal[bot]"
          git config user.email "dependabot-heal[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Auth via extraheader so the token never appears in the remote URL/logs.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # The PR head's commit object only, by SHA; read into the INDEX, never checked out (no PR file reaches a working tree).
          git fetch -q --depth=1 origin "$EXPECTED_HEAD"
          git read-tree "$EXPECTED_HEAD"
          for f in taxonomy-editor/pnpm-lock.yaml taxonomy-editor/THIRD-PARTY-NOTICES.txt taxonomy-editor/src/renderer/data/oss-licenses.json; do
            blob="$(git hash-object -w -- "$HEAL/$f")"
            git update-index --add --cacheinfo "100644,$blob,$f"
          done
          # Belt: never attempt an empty commit (would exit non-zero → red).
          if git diff --cached --quiet "$EXPECTED_HEAD"; then
            echo "Nothing differs from the PR head — skipping commit/push (no-op)."
            exit 0
          fi
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -p "$EXPECTED_HEAD" -m "ci(deps): heal standalone lockfile + license notices [dependabot-heal]")"
          # t/4137 item 3 (observability): the crash guard above only covers an ABSENT
          # credential. A REJECTED one (lapsed PAT, rotated/uninstalled App key) still failed
          # with git's own opaque stderr -- no signal that the credential itself is the
          # problem. Capture the push's output; on a rejected-credential shape, emit a
          # distinct, actionable ::error:: naming the fix. Any OTHER push failure keeps its
          # own message (git's own stderr, already printed above) -- this never changes
          # WHICH credential is used, only what gets logged on failure.
          # Quality must-fix (p/780#52): `$?` read INSIDE an `if ! CMD; then` block is always 0
          # -- entering the then-branch already means `! CMD` evaluated true (0), so by the time
          # the block runs, $? reflects THAT negation, not CMD's real exit code. Capture it with
          # `&&`/`||` instead, before any other statement can overwrite it.
          # The push is a plain fast-forward onto the branch: if the branch moved since EXPECTED_HEAD it is rejected (fail closed).
          PUSH_OUTPUT=$(git push origin "$COMMIT:refs/heads/$HEAD_REF" 2>&1) && PUSH_EXIT=0 || PUSH_EXIT=$?
          if [ "$PUSH_EXIT" -ne 0 ]; then
            echo "$PUSH_OUTPUT"
            CLASS=$(printf '%s' "$PUSH_OUTPUT" | (cd "$GITHUB_WORKSPACE" && node operations/devops/classify-heal-push-failure.mjs))
            if [ "$CLASS" = "credential_rejected" ]; then
              echo "::error::heal credential rejected — check the heal App: its installation on this repository, contents: write, and the HEAL_APP_CLIENT_ID / HEAL_APP_PRIVATE_KEY secrets"
            else
              echo "::error::heal push failed (exit $PUSH_EXIT) — see output above"
            fi
            exit 1
          fi
