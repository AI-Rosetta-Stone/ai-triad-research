name: Stray File Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  stray-file-guard:
    name: Check for code files outside allowlisted roots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # actions/setup-node v6
        with:
          node-version: '20'

      - name: Run stray-file guard
        # t/4665 (TL, p/331#2547): sources the guard script from the PR's base ref, not the
        # PR head, with a fail-open WARN if it's still missing -- see run-stray-file-guard.sh.
        run: bash scripts/ci/run-stray-file-guard.sh "${{ github.base_ref }}"
