# ─── Deploy to Azure ───
# What:  Blue-green PRODUCTION deployment to Azure Container Apps via Bicep.
#        Deploys new revision at 0% traffic, health checks, then shifts to 100%.
#        Auto-rollback on health failure.
# Environments: production ONLY. Staging deploys are handled automatically by
#        deploy-staging.yml (triggered via workflow_run on container.yml success).
#        Dispatching with environment=staging is explicitly rejected.
# Before: Container image must exist in GHCR (run Container Image workflow first).
#         Requires AZURE_* OIDC secrets and OAuth secrets configured.
# After:  Verify the app is healthy at the production URL. Check Azure Log Analytics
#         for any startup errors. Monitor costs against the $5/month target.

name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (production only — staging auto-deploys via deploy-staging.yml)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      sha:
        description: 'Commit SHA to deploy — the SAME sha built via Invoke-ContainerBuild.ps1 -Sha. The deploy resolves its PERMANENT sha-<commit> tag -> immutable @sha256 digest and pins the revision to it (t/3679, deploy-by-digest). Empty ABORTS with an actionable message; the deploy never falls back to :latest.'
        required: false
        default: ''
        type: string
      auth_mode:
        description: 'Authentication mode: optional (login + anonymous read-only), required (must sign in), disabled (no auth)'
        required: true
        default: 'optional'
        type: choice
        options:
          - optional
          - required
          - disabled
      staging_shared_read_only:
        description: 'Mount staging shared volume read-only (true = RO flip for arm-A verification, t/2643)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      # enable_git_sync removed — GitHub API-first mode is always on (STORAGE_MODE=github-api)

permissions:
  contents: read
  packages: read   # t/4170 SO C3 (p/682#28): packages:write is scoped to the tag-known-good job
                   # only, not granted workflow-wide (every job, including preflight which
                   # handles dispatch inputs, would otherwise get a token that can push/overwrite
                   # images).
  id-token: write  # For Azure OIDC login
  actions: read    # t/4194 SO C1: `gh run list` in the cross-workflow wait-gate step
  issues: write    # t/4242 SO C2: ops-alert issue when the post-deploy AC2 check fails after the existing rollback gates

# t/4194: SO C1 (p/682#16) — a SHARED concurrency group across both workflows was tried first, but
# a GitHub Actions concurrency group only holds ONE pending run: a third arrival (prod running,
# staging queued, a second prod dispatch arrives) REPLACES the queued one, silently dropping it —
# trading the original race for a different silent-drop bug. Reverted to this workflow's own group
# (self-serializes repeat dispatches of THIS workflow only); cross-workflow mutual exclusion is now
# the explicit "Wait for a concurrent staging deploy" step below, not a shared GH-native group.
concurrency:
  group: deploy-${{ inputs.environment }}
  # SO C1c (p/682#20): with per-workflow groups, a pending-run replacement only ever drops an
  # OLDER run of THIS SAME workflow, which is what we want — so cancel-in-progress:false is safe
  # and avoids cancelling a live Bicep apply or traffic shift mid-flight.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-rosetta-stone/taxonomy-editor
  RESOURCE_GROUP: ai-triad
  CONTAINER_APP_NAME: taxonomy-editor

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # SO C2 (t/4194): the `concurrency:` group is workflow-level, so this job
                         # holds the shared slot too, before `deploy` even starts.
    outputs:
      image_ref: ${{ steps.resolve_digest.outputs.image_ref }}
      digest: ${{ steps.resolve_digest.outputs.digest }}
    steps:
      - name: Reject staging dispatches
        if: inputs.environment == 'staging'
        run: |
          echo "::error::This workflow is production-only. Staging deploys are handled automatically by deploy-staging.yml (triggered via workflow_run on container.yml success). Do not dispatch deploy-azure.yml with environment=staging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Resolve image digest from per-SHA tag (t/3679 — never :latest)
        id: resolve_digest
        shell: pwsh
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # t/3679 conditions 2/4/7: resolve the deploy commit's PERMANENT `sha-<commit>` tag to its
          # immutable @sha256 digest (the TESTED artifact) — NEVER :latest. Fail-closed: empty / invalid /
          # not-found / ambiguous each ABORT here with an actionable message (Resolve-ImageDigest.ps1),
          # so this step also IS the image-existence gate (it throws when the tag is absent — replacing
          # the old "Verify container image exists" step).
          #
          # SECURITY — M14 (.orca/docs/security-analysis-2026-08-12.md), BOTH halves, because this sink is
          # in preflight BEFORE the production approval gate with workflow-level id-token: write:
          #   (a) env-indirection — $INPUT_SHA is read from env, NEVER interpolated into the script text,
          #       so an Actions-expression payload in `inputs.sha` cannot inject.
          #   (b) allowlist — reject anything but a hex commit SHA up front (below). `sha` REPLACES
          #       `image_tag`, whose M14 fix used env-indirection + a value allowlist; a SHA admits the
          #       tighter ^[0-9a-fA-F]{7,40}$. Static error, never echo the raw value (M14: a newline could
          #       inject a workflow command). This also gives an HONEST failure — a malformed sha dies here
          #       saying so, not deep in the resolver as ImageTagNotFound or as a mangled gh-api query.
          if ($env:INPUT_SHA -notmatch '^[0-9a-fA-F]{7,40}$') {
            Write-Host "::error::sha input is invalid — it must be a hex commit SHA matching ^[0-9a-fA-F]{7,40}$. Dispatch with -f sha=<commit>."
            exit 1
          }
          & ./operations/devops/Resolve-ImageDigest.ps1 -Sha $env:INPUT_SHA -GitHubOutput

      - name: Verify container-relevant CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          # t/3679: verify CI for the DEPLOYED commit (inputs.sha), not github.sha (the dispatch HEAD,
          # which can differ from what we're deploying). $DEPLOY_SHA is validated upstream by the
          # resolve_digest step (^[0-9a-fA-F]{7,40}$) and read from env, not interpolated inline.
          echo "Checking CI status for ${DEPLOY_SHA}..."

          # Get the latest CI run for this commit (or its nearest ancestor).
          # Docs-only pushes to main are intentionally skipped by ci.yml paths-ignore
          # (**.md, docs/**, deploy/azure/runbooks/**), so the commit may have no CI run.
          # Walk back up to 10 commits to find the last green ancestor — safe because
          # docs-only commits cannot affect the container image.
          COMMITS=$(gh api "repos/${GH_REPO}/commits?sha=${DEPLOY_SHA}&per_page=10" \
            --jq '.[].sha' 2>/dev/null || echo "")
          RUN_ID=""
          for COMMIT in $COMMITS; do
            RUN_ID=$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")
            if [ -n "$RUN_ID" ]; then
              if [ "$COMMIT" != "${DEPLOY_SHA}" ]; then
                echo "Commit ${DEPLOY_SHA} has no CI run (docs-only skip). Using ancestor ${COMMIT} (run ${RUN_ID})."
              fi
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run found for commit ${DEPLOY_SHA} or recent ancestors. CI must run before deploying."
            exit 1
          fi

          # Wait for the run to complete if it is still in progress.
          RUN_STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
            --jq '.status' 2>/dev/null || echo "")
          if [ "$RUN_STATUS" = "in_progress" ] || [ "$RUN_STATUS" = "queued" ]; then
            echo "CI run ${RUN_ID} is still ${RUN_STATUS} — waiting for completion..."
            gh run watch "${RUN_ID}" --exit-status || {
              echo "::error::CI run ${RUN_ID} failed. Deploy blocked until CI passes."
              exit 1
            }
          fi

          # Check only test-container — it needs: [test-powershell, test-electron]
          # so if it passed, all upstream jobs passed too. Checking test-electron
          # by name fails because the matrix creates per-app jobs (e.g. "test-electron (taxonomy-editor)").
          # "skipped" is also acceptable: the dorny/paths-filter gate skips test-container
          # when no container-relevant files changed, meaning the deployed image is identical
          # to the last image that DID pass the container tests.
          for JOB in test-container; do
            # --paginate + per_page=100: the jobs API returns 30 per page by default and CI has
            # more than 30 jobs (35 on 2026-10-06), so an unpaginated lookup could not see
            # test-container and refused every deploy as "not found".
            STATUS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"${JOB}\") | .conclusion // .status" 2>/dev/null || echo "")
            if [ "$STATUS" = "success" ] || [ "$STATUS" = "skipped" ]; then
              echo "  ${JOB}: ${STATUS}"
            elif [ -z "$STATUS" ]; then
              echo "::error::Job '${JOB}' not found in CI run ${RUN_ID}."
              exit 1
            elif [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
              echo "::error::Job '${JOB}' is still ${STATUS} in CI run ${RUN_ID}. Wait for it to complete."
              exit 1
            else
              echo "::error::Job '${JOB}' status is '${STATUS}' in CI run ${RUN_ID}. Container-relevant CI must pass before deploying."
              exit 1
            fi
          done
          echo "Container-relevant CI passed for this commit"

      # NOTE (t/3679): "Verify container image exists" was REMOVED — the resolve_digest step above
      # already fails-closed if the per-SHA tag is absent (it throws in Resolve-ImageDigest.ps1),
      # so image existence is proven by successful digest resolution. A separate tag-existence check
      # would be redundant and would reintroduce a `:latest`/tag-name code path this change retires.

  deploy:
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45  # SO C2 (t/4194, p/682#16): without this, a hung deploy holds the shared
                         # concurrency group for up to GitHub's 6h default, blocking the other
                         # workflow for the same window. 45m is generous over this job's observed
                         # real runtime (health checks + smoke + persona matrix all have their own
                         # shorter internal timeouts already).
    outputs:
      # t/4170: exposed so the separate tag-known-good job (packages:write, SO C3) can gate on
      # the same success condition as the in-job post-deploy steps, without needing packages:write
      # itself or re-running the gates.
      image_accepted: ${{ steps.acceptance.outputs.accepted }}
      persona_accepted: ${{ steps.persona.outputs.accepted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0  # t/4194: full history, so the refuse-older-than-running guard's
                           # `git merge-base --is-ancestor` below can actually see both commits.

      - name: Wait for a concurrent staging deploy to finish (t/4194 SO C1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # t/4194 SO C1 (p/682#16, p/682#20): this workflow's Bicep apply reconciles BOTH the
          # prod and staging Container Apps in one shot (t/2049/t/2047 landmine) — including
          # re-pinning staging's traffic from a value captured BEFORE the apply. If
          # deploy-staging.yml is concurrently mutating the staging app (new revision, traffic
          # promote), this apply can stomp that promotion with its stale pre-apply capture, or
          # vice versa. A single shared GH concurrency group was tried first and rejected: it
          # holds only ONE pending run, so a third trigger silently REPLACES (drops) the queued
          # one instead of serializing.
          #
          # SO C1a: a naive symmetric gate (both workflows wait for "any in-progress other-workflow
          # run") deadlocks into the exact failure it's meant to prevent — a run sitting in ITS OWN
          # wait step is itself in_progress, so two near-simultaneous dispatches see each other,
          # both wait out the full budget, and both proceed together. Fixed by ORDER, not
          # symmetry: wait only for an other-workflow run STARTED BEFORE this run. Exactly one of
          # any two near-simultaneous runs then waits.
          #
          # SO C1e: `createdAt`/`created_at` is NOT re-set on a re-run — a `gh run rerun` of an old
          # staging run would keep its original (old) timestamp and so never be seen as "earlier"
          # than a genuinely later-dispatched prod run, defeating the order check on exactly
          # staging's own recovery path. Use `startedAt` (gh run list) / `run_started_at` (API) —
          # both ARE re-set on a re-run — instead.
          #
          # SO C1b: budgets are tied to the OTHER job's own timeout-minutes, with asymmetric
          # failure modes. Prod waits up to staging's job timeout (30m = deploy-staging.yml's
          # `timeout-minutes: 30`) and then FAILS OPEN (warns, proceeds) — prod is not held
          # hostage to a hung staging run. (Staging's own gate, in deploy-staging.yml, waits up to
          # PROD's 45m timeout and fails CLOSED — see that file for the asymmetric rationale.)
          #
          # SO C1d: a failed/empty `gh run list` is NOT the same as "zero other runs" — treat it as
          # BUSY (keep polling) rather than proceeding, so a persistently unreachable API fails
          # open/closed at the budget (per C1b), never on the first blip.
          #
          # RESIDUAL VECTOR (named, not closed; SO-accepted at p/682#20): this is TOCTOU, not a
          # lock — a deploy-staging.yml run that starts in the instant after this poll's last
          # check is not caught. Only an actual mutex (e.g. a blob lease, t/4179) closes that.
          $MaxWaitSeconds = 1800  # SO C1b: matches deploy-staging.yml job's timeout-minutes: 30
          $PollIntervalSeconds = 20
          $Elapsed = 0
          $OwnStartedAt = gh api "repos/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID" --jq '.run_started_at'
          if (-not $OwnStartedAt) {
            Write-Host "::warning::t/4194 guard: could not resolve this run's own run_started_at via the API — skipping the order check (fail-open)."
          } else {
            while ($true) {
              $Raw = gh run list --repo $env:GH_REPO --workflow deploy-staging.yml --status in_progress --json databaseId,startedAt 2>$null
              $ApiOk = -not ($null -eq $Raw -or $Raw -eq '')
              if ($ApiOk) {
                $Others = @($Raw | ConvertFrom-Json)
                $Earlier = @($Others | Where-Object { [datetimeoffset]$_.startedAt -lt [datetimeoffset]$OwnStartedAt })
              } else {
                # SO C1d: unknown, NOT zero — fall through to the elapsed/poll logic below as "busy".
                $Earlier = $null
              }
              if ($ApiOk -and $Earlier.Count -eq 0) {
                Write-Host "No EARLIER in-progress deploy-staging.yml run — proceeding."
                break
              }
              if ($Elapsed -ge $MaxWaitSeconds) {
                if ($ApiOk) {
                  Write-Host "::warning::t/4194 guard: an earlier deploy-staging.yml run is still in progress after ${MaxWaitSeconds}s — proceeding anyway (fail-open, SO C1b; do not hold prod deploys hostage to a hung/long staging run)."
                } else {
                  Write-Host "::warning::t/4194 guard: 'gh run list' for deploy-staging.yml kept failing for ${MaxWaitSeconds}s — proceeding anyway (fail-open, SO C1b/C1d)."
                }
                break
              }
              if ($ApiOk) {
                Write-Host "$($Earlier.Count) earlier deploy-staging.yml run(s) still in progress — waiting ${PollIntervalSeconds}s (elapsed ${Elapsed}s/${MaxWaitSeconds}s)..."
              } else {
                Write-Host "::warning::t/4194 guard: 'gh run list' for deploy-staging.yml returned nothing this poll (API error or rate limit) — treating as busy, not clear (SO C1d); retrying in ${PollIntervalSeconds}s..."
              }
              Start-Sleep -Seconds $PollIntervalSeconds
              $Elapsed += $PollIntervalSeconds
            }
          }

      - name: Show resolved image (digest-pinned, from preflight)
        run: |
          # t/3679: the immutable @sha256 ref was resolved + verified in preflight (resolve_digest).
          # The deploy job consumes it via job output — no re-resolution, no tag/:latest code path here.
          echo "Deploying digest-pinned image: ${{ needs.preflight.outputs.image_ref }}"

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate auth config — tokenStore safety (warn-only — t/4133)
        # t/4133: tokenStore.enabled=true with no blob backing causes HTTP 500 for all signed-in
        # users on replica recycle or platform roll (t/4132 incident). Checks live Azure state
        # (not just the template) so ad-hoc CLI drift is also caught. Warn-only until
        # gate-promotion flip PR; blocking upgrade is T2 (gate flip, separate PR).
        shell: pwsh
        continue-on-error: true
        run: |
          ./operations/devops/Invoke-TokenStoreGateCheck.ps1 `
            -ContainerAppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup    '${{ env.RESOURCE_GROUP }}'

      - name: Capture current active revisions (traffic-pin + rollback targets)
        id: current_revision
        shell: pwsh
        run: |
          # t/2049 + t/2047 landmine: main.bicep defines BOTH the prod and staging
          # apps, so EVERY apply reconciles BOTH. Capture each app's CURRENT ACTIVE
          # revision BEFORE the apply and pass both as ingress traffic pins, so the
          # apply holds traffic on the known-good revision (never auto-promoting a
          # new one) — for both apps, regardless of which environment we deploy.
          # The prod capture doubles as the rollback target.
          $ErrorActionPreference = 'Stop'   # abort on az failure — never pass a
                                            # silent empty pin when capture itself
                                            # failed (t/2049#6). Empty is passed ONLY
                                            # when there is verifiably no active
                                            # revision (genuine first/only deploy).
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          function Get-ActivePin {
            param([string]$App, [string]$Rg)
            $Active = @(Get-ContainerAppRevision -Mode Active -AppName $App -ResourceGroup $Rg)
            if ($Active.Count -eq 0) { return '' }
            # Steady state = exactly one revision at >0% traffic. If a prior deploy
            # left a split, pin the highest-weight revision.
            $Top = @($Active | Sort-Object -Property TrafficWeight -Descending)[0]
            return $Top.Name
          }
          $ProdRev    = Get-ActivePin -App '${{ env.CONTAINER_APP_NAME }}'         -Rg '${{ env.RESOURCE_GROUP }}'
          $StagingRev = Get-ActivePin -App '${{ env.CONTAINER_APP_NAME }}-staging' -Rg '${{ env.RESOURCE_GROUP }}'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "revision=$ProdRev"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "staging_revision=$StagingRev"
          Write-Host "Prod pin / rollback target: '$ProdRev'"
          Write-Host "Staging pin target:         '$StagingRev'"

      - name: Refuse to deploy a commit older than the one running in prod (t/4194 prevention)
        shell: pwsh
        env:
          # workflow-lint: direct ${{ inputs.* }} in run block content requires env: indirection
          # (M14 shell-injection pattern, same convention as resolve_digest's INPUT_SHA above).
          PROD_REV: ${{ steps.current_revision.outputs.revision }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          # t/4194: the 10-14 rollback incident deployed an older commit over a newer one because
          # a stale local state check was trusted instead of re-reading the live revision. This
          # guard makes that class impossible at the workflow level: refuse the deploy outright if
          # the requested SHA isn't a descendant of (or equal to) the SHA already running in prod.
          # Decision logic lives in Get-DeployAgeVerdict.ps1 (Pester-tested) — SO C3 (p/682#16): a
          # git ERROR exit code (merge-base can exit >1, e.g. 128, on a bad ref) must NOT be read the
          # same as exit 1 ("confirmed not an ancestor"); only this step does the actual git calls.
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force -ErrorAction SilentlyContinue
          . ./operations/devops/Get-DeployAgeVerdict.ps1
          $ProdRev = $env:PROD_REV
          $Requested = $env:INPUT_SHA
          $ExitCode = $null
          if ($ProdRev -match '--deploy-([0-9a-f]{7,40})-') {
            $RunningFull = git rev-parse "$($Matches[1])^{commit}" 2>$null
            if ($RunningFull) {
              git merge-base --is-ancestor $RunningFull $Requested
              $ExitCode = $LASTEXITCODE
            }
          }
          $Verdict = Get-DeployAgeVerdict -ProdRevisionName $ProdRev -MergeBaseExitCode $ExitCode
          switch ($Verdict.Action) {
            'refuse' {
              Write-Host "::error::t/4194 guard: refusing to deploy $Requested — it is NOT a descendant of the commit already running in prod (revision '$ProdRev', short SHA $($Verdict.RunningShort)). Deploying it would roll prod backward. If this is a deliberate rollback, use the rollback procedure (docs/runbooks), not a forward deploy."
              exit 1
            }
            'warn-proceed' {
              Write-Host "::warning::t/4194 guard: $($Verdict.Reason) — skipping the older-than-running check (fail-open)."
            }
            default {
              Write-Host "t/4194 guard: $($Verdict.Reason) — proceeding."
            }
          }

      - name: Preview Bicep changes (what-if)
        run: |
          echo "Previewing infrastructure changes..."
          RESULT=$(az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file deploy/azure/main.bicep \
            --parameters \
              containerImage=${{ needs.preflight.outputs.image_ref }} \
              trafficPinRevisionName=${{ steps.current_revision.outputs.revision }} \
              trafficPinRevisionNameStaging=${{ steps.current_revision.outputs.staging_revision }} \
              googleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
              googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              githubClientId=${{ secrets.GH_OAUTH_CLIENT_ID }} \
              githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }} \
              authDisabled=${{ inputs.auth_mode == 'disabled' && '1' || '' }} \
              authOptional=${{ inputs.auth_mode == 'optional' && '1' || '' }} \
              adminUsers=${{ vars.ADMIN_USERS }} \
              aadClientId=${{ secrets.AAD_CLIENT_ID }} \
              aadClientSecret=${{ secrets.AAD_CLIENT_SECRET }} \
              aadIssuer=common \
              gitSyncEnabled=1 \
              githubRepo=${{ vars.SYNC_GITHUB_REPO }} \
              githubAppId=${{ vars.SYNC_GITHUB_APP_ID }} \
              githubAppInstallationId=${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }} \
              githubAppPrivateKeySecretName=${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }} \
              githubWebhookSecret=${{ secrets.SYNC_GITHUB_WEBHOOK_SECRET }} \
              freeTierGeminiKey=${{ secrets.FREE_TIER_GEMINI_KEY }} \
              geminiPaidKey=${{ secrets.GEMINI_PAID_KEY }} \
              budgetAlertEmail=${{ vars.ALERT_EMAIL }} \
              stagingSharedReadOnly=${{ inputs.staging_shared_read_only == 'true' && 'true' || 'false' }} \
            --no-pretty-print 2>&1) || true
          echo "$RESULT"

          # Fail on unexpected deletes (but allow NoChange and Modify)
          if echo "$RESULT" | grep -q '"changeType":"Delete"'; then
            echo "::error::Bicep what-if detected resource DELETIONS — review before deploying"
            exit 1
          fi

      - name: Deploy Bicep template
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5  # v2
        id: deploy
        with:
          # Bicep emits compile warnings (e.g. BCP422/BCP318 from runner.bicep)
          # to stderr. arm-deploy defaults failOnStdErr:true, which would fail
          # this step on those warnings even though the ARM deployment succeeds —
          # masking real failures and skipping the blue-green / DEPLOY_SHA steps
          # below. Tolerate stderr; real deploy failures still surface via the
          # action's non-zero exit. (t/702)
          failOnStdErr: false
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: deploy/azure/main.bicep
          parameters: >-
            containerImage=${{ needs.preflight.outputs.image_ref }}
            googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            githubClientId=${{ secrets.GH_OAUTH_CLIENT_ID }}
            githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
            authDisabled=${{ inputs.auth_mode == 'disabled' && '1' || '' }}
            authOptional=${{ inputs.auth_mode == 'optional' && '1' || '' }}
            adminUsers=${{ vars.ADMIN_USERS }}
            aadClientId=${{ secrets.AAD_CLIENT_ID }}
            aadClientSecret=${{ secrets.AAD_CLIENT_SECRET }}
            aadIssuer=common
            gitSyncEnabled=1
            githubRepo=${{ vars.SYNC_GITHUB_REPO }}
            githubAppId=${{ vars.SYNC_GITHUB_APP_ID }}
            githubAppInstallationId=${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }}
            githubAppPrivateKeySecretName=${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }}
            githubWebhookSecret=${{ secrets.SYNC_GITHUB_WEBHOOK_SECRET }}
            freeTierGeminiKey=${{ secrets.FREE_TIER_GEMINI_KEY }}
            geminiPaidKey=${{ secrets.GEMINI_PAID_KEY }}
            budgetAlertEmail=${{ vars.ALERT_EMAIL }}
            trafficPinRevisionName=${{ steps.current_revision.outputs.revision }}
            trafficPinRevisionNameStaging=${{ steps.current_revision.outputs.staging_revision }}
            stagingSharedReadOnly=${{ inputs.staging_shared_read_only == 'true' && 'true' || 'false' }}

      # NOTE: the current active revision is now captured BEFORE the Bicep apply
      # (see "Capture current active revisions" above) so it can be passed as the
      # traffic pin. steps.current_revision.outputs.revision remains the rollback
      # target below — and, with the pin, that revision holds 100% throughout the
      # deploy, so it can never drop to 0% / go stale / be GC'd mid-deploy (t/2047).

      - name: Validate auth config — tokenStore safety post-apply (warn-only — t/4133)
        # Second check: verifies the DEPLOYED state, not just the pre-apply live state.
        # Catches a Bicep template that re-enables tokenStore without backing (t/4132).
        shell: pwsh
        continue-on-error: true
        run: |
          ./operations/devops/Invoke-TokenStoreGateCheck.ps1 `
            -ContainerAppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup    '${{ env.RESOURCE_GROUP }}'

      # SYNC WITH main.bicep: analyticsContainer, stagingAnalyticsContainer,
      # userContentContainer, stagingUserContentContainer, communityContainer,
      # stagingCommunityContainer, briefExportsContainer, stagingBriefExportsContainer.
      # Update both if a container is added or removed.
      # Discriminates ContainerNotFound (404) from RBAC failures (403) — t/2718.
      - name: Verify blob containers exist post-deploy
        shell: pwsh
        run: |
          ./operations/devops/Invoke-BlobContainerGateCheck.ps1 `
            -StorageAccount '${{ steps.deploy.outputs.storageAccountName }}'

      # Warn-only: compares share data against the data-repo canonical blob sha via
      # GitHub Git Trees API. Catches seed-lag (t/3090 pattern — share stale relative
      # to data repo). Flip to blocking is a separate Gate-Promotion PR after ≥1 green
      # cycle on the real share. (t/3091)
      - name: Verify share data freshness (warn-only — t/3091)
        shell: pwsh
        continue-on-error: true
        run: |
          ./operations/devops/Invoke-ShareFreshnessGateCheck.ps1 `
            -StorageAccount '${{ steps.deploy.outputs.storageAccountName }}' `
            -GitHubToken    '${{ github.token }}'

      - name: Cleanup stale revisions
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          . ./operations/devops/Get-RevisionDeactivationVerdict.ps1
          Write-Host "Deactivating stale revisions to free resources..."
          # t/2050: NEVER deactivate the captured rollback target. With the t/2049
          # pin it stays at 100% (not stale) so it should never appear here, but we
          # guard explicitly so no reorder or transient split can strand the
          # rollback target the way t/2047 did.
          #
          # t/4242: a sibling bug in deploy-staging.yml deactivated the revision traffic was
          # pinned to. Get-ContainerAppRevision -Mode Stale already filters trafficWeight==0, but
          # that's exactly the single live read t/4242 showed can be stale (Azure read-after-write
          # propagation lag, t/4242#1) — a revision's `trafficWeight` is itself DERIVED from the
          # app's ingress traffic config, so re-reading the same derived field alone (SO review,
          # p/682#33) isn't enough. Every candidate that survives the cheap name-based exclusion
          # below gets a fresh re-check against BOTH independently-sourced inputs — `revision
          # show`'s own trafficWeight AND a fresh read of the ingress traffic config (the routing
          # source) — immediately before the actual deactivate call. (No -ServingRevisionName
          # here, unlike staging: this step runs BEFORE this run's own new revision is deployed —
          # steps.new_revision hasn't executed yet — so there is no "this run's serving revision"
          # to exclude by name yet. $Protected, the already-serving rollback target, is the only
          # name-based guard that applies here.)
          $Protected = @('${{ steps.current_revision.outputs.revision }}') | Where-Object { $_ }
          $Stale = @(Get-ContainerAppRevision -Mode Stale `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}')
          foreach ($Rev in $Stale) {
            if ($Protected -contains $Rev.Name) {
              Write-Host "Skipping $($Rev.Name): name-excluded (protected rollback target), no Azure call needed"
              continue
            }
            # Raw `az` call, NOT Get-ContainerAppRevision -Mode Fqdn: that cmdlet initialises
            # TrafficWeight=0 when the field is absent (SO review key risk #3) — exactly what C3
            # must NOT do. Read the raw JSON and apply our own null-safe extraction instead.
            $FreshRaw = az containerapp revision show `
              --name '${{ env.CONTAINER_APP_NAME }}' -g '${{ env.RESOURCE_GROUP }}' --revision $Rev.Name `
              -o json | ConvertFrom-Json
            $App = az containerapp show --name '${{ env.CONTAINER_APP_NAME }}' -g '${{ env.RESOURCE_GROUP }}' -o json `
              | ConvertFrom-Json
            $TrafficEntries = $null
            $LatestRevisionName = $null
            if ($App.PSObject.Properties['properties']) {
              if ($App.properties.PSObject.Properties['configuration'] -and
                  $App.properties.configuration.PSObject.Properties['ingress'] -and
                  $App.properties.configuration.ingress.PSObject.Properties['traffic']) {
                $TrafficEntries = @($App.properties.configuration.ingress.traffic)
              }
              if ($App.properties.PSObject.Properties['latestRevisionName']) {
                $LatestRevisionName = $App.properties.latestRevisionName
              }
            }
            $Ingress = Get-IngressTrafficWeightForRevision -RevisionName $Rev.Name `
              -TrafficEntries $TrafficEntries -LatestRevisionName $LatestRevisionName
            $FreshWeight = if ($FreshRaw.properties.PSObject.Properties['trafficWeight']) { $FreshRaw.properties.trafficWeight } else { $null }
            $FreshActive = if ($FreshRaw.properties.PSObject.Properties['active']) { [bool]$FreshRaw.properties.active } else { $false }
            $FreshVerdict = Get-RevisionDeactivationVerdict -RevisionName $Rev.Name `
              -TrafficWeight $FreshWeight -Active $FreshActive `
              -IngressWeight $Ingress.IngressWeight -IsLatestRevisionWithTraffic $Ingress.IsLatestRevisionWithTraffic `
              -ProtectedNames $Protected
            if ($FreshVerdict.Action -ne 'deactivate') {
              Write-Host "Skipping $($Rev.Name) on fresh re-check: $($FreshVerdict.Reason)"
              continue
            }
            Disable-ContainerAppRevision -RevisionName $Rev.Name `
              -AppName '${{ env.CONTAINER_APP_NAME }}' `
              -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          }
          Write-Host "Cleanup complete"

      - name: Deploy new revision (0% traffic)
        id: new_revision
        shell: pwsh
        env:
          INPUT_SHA: ${{ inputs.sha }}
          IMAGE_REF: ${{ needs.preflight.outputs.image_ref }}
          RESOLVED_DIGEST: ${{ needs.preflight.outputs.digest }}
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          # t/3679: deploy the DIGEST-PINNED ref (…@sha256:<digest>), not a tag — a pod recycle re-pulls
          # IDENTICAL bytes. DEPLOY_SHA and the revision suffix encode the DEPLOYED commit ($INPUT_SHA),
          # NOT github.sha (the dispatch HEAD, which can differ — the t/3278/t/3110 misleading-marker trap).
          # IMAGE_DIGEST + IMAGE_DEPLOYED_AT are stamped as env for the DETECT half (ServerAPI surfaces them
          # on /health, t/3679#7). IMAGE_DEPLOYED_AT is DEPLOY-time (not container start) so a recycle WITHOUT
          # a deploy shows the SAME timestamp — the out-of-band-revision-creation signal (condition 6).
          # DEPLOY_TAG carries the per-SHA tag for continuity (the resolved artifact reference).
          $ShortSha = $env:INPUT_SHA.Substring(0, [Math]::Min(7, $env:INPUT_SHA.Length))
          $Epoch = ([string]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds()))[-5..-1] -join ''
          $Suffix = "deploy-$ShortSha-$Epoch"
          $DeployedAt = [DateTimeOffset]::UtcNow.ToString('o')
          $Result = New-ContainerAppRevision `
            -ImageRef $env:IMAGE_REF `
            -RevisionSuffix $Suffix `
            -EnvVars @{
              DEPLOY_SHA        = $env:INPUT_SHA
              DEPLOY_TAG        = "sha-$($env:INPUT_SHA)"
              IMAGE_DIGEST      = $env:RESOLVED_DIGEST
              IMAGE_DEPLOYED_AT = $DeployedAt
            } `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "suffix=$Suffix"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "revision=$($Result.RevisionName)"

      - name: Assert revision is digest-pinned to the intended image (t/3679 condition 3)
        shell: pwsh
        env:
          EXPECTED_REF: ${{ needs.preflight.outputs.image_ref }}
        run: |
          # t/3679 §5 established ACA rejects an UNRESOLVABLE digest at provision time (New-ContainerAppRevision
          # above would already have thrown, atomically). This step covers the OTHER case condition 3 names —
          # a resolvable-but-WRONG digest — by asserting the created revision's resolved image ref EQUALS the
          # intended @sha256 ref (VALUE equality, per condition 3 "compare the value, not the form" — an
          # @sha256-shape check would pass on the wrong digest). Fail-closed: a mismatch or a Failed
          # provisioning state ABORTS here, before any traffic shift. (Readiness is gated by the health
          # check below; this asserts identity, not liveness.)
          $Rev = '${{ steps.new_revision.outputs.revision }}'
          $Info = az containerapp revision show `
            --name '${{ env.CONTAINER_APP_NAME }}' -g '${{ env.RESOURCE_GROUP }}' --revision $Rev `
            --query '{prov:properties.provisioningState, image:properties.template.containers[0].image}' -o json | ConvertFrom-Json
          Write-Host "New revision $Rev — provisioningState=$($Info.prov) image=$($Info.image)"
          if ($Info.prov -eq 'Failed') {
            Write-Host "::error::t/3679: new revision provisioningState is 'Failed' — NOT proceeding (fail-closed)."
            exit 1
          }
          if ($Info.image -ne $env:EXPECTED_REF) {
            Write-Host "::error::t/3679: new revision image '$($Info.image)' != intended '$($env:EXPECTED_REF)' — digest-pin MISMATCH, NOT proceeding (fail-closed)."
            exit 1
          }
          Write-Host "t/3679 assert OK: revision is digest-pinned to '$($env:EXPECTED_REF)' (value-equal), provisioningState=$($Info.prov)."

      - name: Health check new revision
        id: health_check
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force

          # Get the revision-specific FQDN to test the new revision directly
          $RevInfo = Get-ContainerAppRevision -Mode Fqdn `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          $RevFqdn = if ($RevInfo) { $RevInfo.Fqdn } else { $null }

          $BaseUrl = if ([string]::IsNullOrWhiteSpace($RevFqdn)) { "${{ steps.deploy.outputs.appUrl }}" } else { "https://$RevFqdn" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "base_url=$BaseUrl"

          # Unified check (t/1495): server-up (/health) and data-loaded (/healthz) in one probe per round.
          # t/4158: a bounded loop that also reads the revision's own state and log, so a revision that can
          # never start (ActivationFailed, or the GitHub App token-mint 404 of the 2026-10-12 attempt 2) fails
          # on the first round that shows it, with the cause named, instead of holding the job for 20+ min.
          # The 7-minute wall clock matches the prior combined budget (5 min server start + 2 min data load).
          # -TimeoutSec 15 keeps the protection against Envoy 504 gateway hangs.
          # The loop lives in Wait-RevisionActivation (unit-tested; shared with deploy-staging.yml, SO C3).
          . ./operations/devops/Get-RevisionActivationVerdict.ps1
          $Rev     = '${{ steps.new_revision.outputs.revision }}'
          $App     = '${{ env.CONTAINER_APP_NAME }}'
          $Rg      = '${{ env.RESOURCE_GROUP }}'
          $Verdict = Wait-RevisionActivation -TimeoutSeconds 420 -IntervalSeconds 15 `
            -GetState   { az containerapp revision show -n $App -g $Rg --revision $Rev --query '{r:properties.runningState,h:properties.healthState}' -o json 2>$null | ConvertFrom-Json } `
            -GetLogTail { (az containerapp logs show -n $App -g $Rg --revision $Rev --tail 60 --format text 2>$null) -join "`n" } `
            -Probe      { Test-TaxEditorHealth -BaseUrl $BaseUrl -TimeoutSec 15 -MaxAttempts 1 }
          $Result      = $Verdict.Result
          $LastRefusal = $Verdict.LastRefusal   # SO C2: named if the step times out

          if ($Verdict.Verdict -eq 'healthy') {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=true"
            Write-Host "Health check passed — server up and taxonomy data loaded"
          } elseif ($Verdict.Verdict -eq 'failed') {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=false"
            Write-Host "::error::Revision $Rev cannot start ($($Verdict.Cause)): $($Verdict.Message)"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=false"
            $ServerCheck = $Result.Checks | Where-Object { $_.Endpoint -eq '/health' }
            $DataCheck = $Result.Checks | Where-Object { $_.Endpoint -eq '/healthz' }
            if (-not $ServerCheck.Healthy) {
              Write-Host "::error::Server-up check failed — /health did not return ok within 7 minutes ($($ServerCheck.Detail))"
            } elseif (-not $DataCheck.Healthy) {
              Write-Host "::error::Data-loaded check failed — /healthz did not return healthy within 7 minutes ($($DataCheck.Detail))"
            } else {
              Write-Host "::error::Health check failed for an unexpected reason"
            }
            if ($LastRefusal) {
              Write-Host "::error::Last GitHub refusal seen in the revision log: $LastRefusal (transient refusals are not fatal on their own; t/4158 SO C1/C2)"
            }
          }

      - name: Acceptance tests — full smoke (pre-traffic shift)
        id: acceptance
        if: steps.health_check.outputs.healthy == 'true'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $BaseUrl = '${{ steps.health_check.outputs.base_url }}'
          Write-Host "=== Full smoke test against 0%-traffic revision: $BaseUrl ==="

          # Invoke-TaxEditorSmokeTest covers all 6 endpoint categories + health +
          # Azure + GitHub checks against the zero-traffic revision before any traffic
          # is shifted — mandatory pre-promotion gate (t/2376).
          $SmokeResult = Invoke-TaxEditorSmokeTest -BaseUrl $BaseUrl -Detailed -AssertDataPresence
          Write-Host ""
          Write-Host "=== Smoke: $($SmokeResult.EndpointsPassed)/$($SmokeResult.EndpointsTotal) endpoints passed ==="

          if (-not $SmokeResult.OverallPass) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=false'
            Write-Host "::error::Smoke test failed — NOT shifting traffic"
            Write-Host "  Health: $(if ($SmokeResult.HealthOk) { 'OK' } else { 'FAIL' })"
            Write-Host "  Azure:  $(if ($SmokeResult.AzureOk) { 'OK' } else { 'FAIL' })"
            Write-Host "  GitHub: $(if ($SmokeResult.GitHubOk) { 'OK' } else { 'FAIL' })"
            foreach ($F in $SmokeResult.FailedEndpoints) { Write-Host "  FAIL  $($F.Endpoint): $($F.Error)" }
          } else {
            # Embedding health check — blocks traffic shift if ONNX encoder is down (t/2786).
            # Must assert a real 384-dim vector, not just HTTP 200 — silent-degradation guard.
            Write-Host ""
            Write-Host "=== Embedding health check (pre-traffic shift) ==="
            $EmbedHealth = Test-EmbeddingHealth -BaseUrl $BaseUrl
            if (-not $EmbedHealth.Healthy) {
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=false'
              Write-Host "::error::Embedding health FAILED ($($EmbedHealth.Error)) — NOT shifting traffic. Trace: Get-ServerLog -RequestId $($EmbedHealth.RequestId)"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=true'
            }
          }

      - name: Persona matrix (pre-traffic shift)
        id: persona
        if: steps.health_check.outputs.healthy == 'true'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $BaseUrl = "${{ steps.health_check.outputs.base_url }}"
          $Results = Test-PersonaEndpoints -BaseUrl $BaseUrl -Detailed
          $Fails = @($Results | Where-Object { -not $_.Pass -and -not $_.Note })

          if ($Fails.Count -gt 0) {
            Write-Host "::error::Persona matrix: $($Fails.Count) real auth-gate regression(s) — NOT shifting traffic"
            foreach ($F in $Fails) {
              Write-Host "  FAIL  persona=$($F.Persona) $($F.Method) $($F.Endpoint) expected=$($F.ExpectedAccess) actual=$($F.ActualAccess) status=$($F.StatusCode)"
            }
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=false'
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=true'
          }

      - name: Warm-gate (/readyz) — PEER-BLOCKING (t/3148, promoted from observe-only)
        id: warm_gate
        if: steps.health_check.outputs.healthy == 'true'
        shell: pwsh
        run: |
          # t/3148 BLOCKING flip (mechanism B, TL-decided p/542#108; real-env evidence run
          # 33434586564: "Warm-gate PASSED after 1 poll … {status:ready,nodeCount:4144}"). Poll the
          # new revision's /readyz until the embeddings.json cache is warm, then emit warm=true/false.
          # This step is a PEER of the acceptance/persona gates: 'Shift traffic' requires
          # warm=='true'; warm=='false' takes the SAME full rollback path as an acceptance failure.
          # The runner is FAIL-CLOSED (warm defaults false; only a proven-warm 200 with body
          # {status:ready,nodeCount>0} sets true) and always exits 0 — the gate is OUTPUT-driven,
          # not exit-code-driven. A non-JSON SPA index.html 200 is NOT warm (body-shape check,
          # ServerAPI p/542#74). warm is UNSET only when this step is SKIPPED (health!='true'),
          # which every rollback condition already covers via its health!='true' clause (no limbo).
          $BaseUrl = "${{ steps.health_check.outputs.base_url }}"
          & ./operations/devops/Invoke-ReadyzWarmGateCheck.ps1 -BaseUrl $BaseUrl -TimeoutSec 300 -PollIntervalSec 10

      - name: Verify embeddings cache resolution (warn-only — t/3091)
        # Calls POST /api/embeddings/compute with canary acc-beliefs-003 (confirmed-real stored key,
        # p/555#4). Asserts cacheHits>=1: the same nodes[id] lookup computeEmbeddings uses. Runs
        # AFTER warm-gate (which proved corpusNodeCount>0), so cacheHits:0 here is a genuine
        # resolution failure on the compute path, not a dead-cache (t/3165 pattern).
        # Requires ServerAPI t/3165 PR #1704 merged (adds cacheHits/cacheMisses/corpusNodeCount
        # to compute 200 response). Script degrades gracefully (warn) if fields are absent.
        # WARN-ONLY BY DESIGN (t/3192; both GV arms now real-env-proven, t/3192#6): kept
        # continue-on-error:true. The FIRE arm (resolves:false → block the shift) is the WARM-GATE's
        # job (step above, peer-blocking t/3148) — this step is a logging confirmation. Flipping THIS
        # step to blocking would only catch a script crash (resolves:false is a handled exit-0 the
        # warm-gate already blocks) = a flaky surface with zero new coverage (TL, t/3192#5).
        id: embeddings_resolution
        if: steps.warm_gate.outputs.warm == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          & ./operations/devops/Invoke-EmbeddingsResolutionGateCheck.ps1 `
            -BaseUrl '${{ steps.health_check.outputs.base_url }}'

      - name: Shift traffic to new revision
        # t/3148: warm_gate is now a peer gate — traffic shifts only when the /readyz warm-gate
        # reports warm=='true' (embeddings.json cache proven warm), alongside acceptance/persona.
        if: steps.health_check.outputs.healthy == 'true' && steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true' && steps.warm_gate.outputs.warm == 'true'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "New revision healthy — waiting for provisioning to settle..."
          Start-Sleep -Seconds 30
          $Result = Set-ContainerAppTraffic `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}' `
            -MaxAttempts 5 `
            -RetryIntervalSec 30
          Write-Host "Traffic shifted to ${{ steps.new_revision.outputs.revision }} after $($Result.AttemptCount) attempt(s)"

      - name: Verify Bicep config (env vars + traffic pin)
        # Runs AFTER traffic shift — audits deployed state without blocking the rollout.
        # Hard fail (continue-on-error: false) so drift alerts the team via red CI.
        # Coverage: non-secret Bicep-declared env vars + traffic weight + firewall defaultAction.
        # Not covered: secretRef vars, ALLOWED_ORIGINS, APPLICATIONINSIGHTS_* (v2 path).
        if: steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true'
        continue-on-error: false
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Result = Test-AzureHealth -CheckConfig -UseCLI `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}' `
            -ExpectedTrafficRevision '${{ steps.new_revision.outputs.revision }}' `
            -ExpectedTrafficWeight 100 `
            -ExpectedEnvVars @{
              # MANDATORY: Keep in sync with the baseEnv block in deploy/azure/main.bicep.
              # Every PR that adds/changes a Bicep env var MUST update this table in the same PR.
              # Drift here = false-red OR silently missed config check (t/2631).
              NODE_ENV                           = 'production'
              WEBSITE_AUTH_ENABLED               = 'true'
              HOME                               = '/home/aitriad'
              AI_TRIAD_DATA_ROOT                 = '/mnt/shared'
              TAXONOMY_CACHE_DIR                 = '/mnt/shared'
              MAX_REPLICAS                       = '1'  # t/4176 — must equal main.bicep maxReplicas (AI RPM + rate limits divide by it)
              AUTH_OPTIONAL                      = '${{ inputs.auth_mode == 'optional' && '1' || '' }}'
              AUTH_DISABLED                      = '${{ inputs.auth_mode == 'disabled' && '1' || '' }}'
              ADMIN_USERS                        = '${{ vars.ADMIN_USERS }}'
              GIT_SYNC_ENABLED                   = '1'
              GITHUB_REPO                        = '${{ vars.SYNC_GITHUB_REPO }}'
              GITHUB_APP_ID                      = '${{ vars.SYNC_GITHUB_APP_ID }}'
              GITHUB_APP_INSTALLATION_ID         = '${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }}'
              GITHUB_APP_PRIVATE_KEY_SECRET_NAME = '${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }}'
              AZURE_KEYVAULT_URL                 = '${{ steps.deploy.outputs.keyVaultUri }}'
              AZURE_STORAGE_ACCOUNT_URL          = '${{ steps.deploy.outputs.storageAccountBlobUrl }}'
              EMBEDDING_WORKER_OFFLOAD           = '1'  # t/3165 durable close — gate verifies the offload flag is deployed
              EMBEDDING_WORKER_POOL_SIZE         = '1'  # t/4263 SO C3 — one worker at 1 vCPU; must match main.bicep baseEnv
              GROUNDING_RECONCILE_INLINE         = '1'  # t/3163 G8a — gate verifies the staged inline-reconcile flag is deployed
              GROUNDING_SWEEP_ENABLED            = '1'  # t/3163 G8b — gate verifies the staged sweep-enable flag is deployed
              # DATA_ROOT_VALIDATION_ENFORCE retired in t/3309 step-3 — /readyz warm-gate replaces the boot hard-fail (co-landed with the server.ts exit(1) removal).
            } `
            -CheckFirewall `
            -StorageAccountName '${{ steps.deploy.outputs.storageAccountName }}' `
            -KeyVaultName '${{ steps.deploy.outputs.keyVaultName }}' `
            -ConfigRetryCount 3
          $ConfigChecks = @($Result.Checks | Where-Object { $_.Check -like 'Config:*' })
          $Failed = @($ConfigChecks | Where-Object { -not $_.Pass })
          $ConfigChecks | Format-Table Check, Pass, Detail -AutoSize
          if ($Failed.Count -gt 0) {
            Write-Host "::error::Config drift detected ($($Failed.Count) checks failed) — deployed state != Bicep intent"
            exit 1
          }
          Write-Host "Config verification passed ($($ConfigChecks.Count) checks)"

      - name: Assert in-process offload flag (BLOCKING, t/3247)
        # Prevention for t/3165. The Verify-Bicep-config step above proves EMBEDDING_WORKER_OFFLOAD
        # is PRESENT in ACA config; this asserts the RUNNING process EVALUATED it truthy, via
        # ServerAPI's #1828 boot log (server.ts:1316 -> "embedding offload flag at boot"
        # {embeddingWorkerOffload:bool}). "Config present" != "flag effective" (t/3165).
        #
        # GATE PROMOTION (t/3247): BLOCKING (continue-on-error: false). Promoted from warn-only after
        # calibration — 4/4 real deploys (runs 33748402995 / 33778872175 / 33785227781 / 33891736936)
        # found the boot line on attempt 1 at ~0s ingest lag with the true-arm read cleanly. The 8x30s
        # (210s) retry ceiling below is RETAINED as over-provisioned headroom against LA ingestion
        # spikes (calibration showed ~0s, not a tight bound — shrinking it would remove anti-flake
        # margin). Predicate is DOT-SOURCED from operations/devops/Test-BootFlagEffective.ps1 — the
        # single source its Pester both-arms test also uses (t/3010 co-location). Cond 2: present+false
        # = 'drift' (blocks); absent-after-retry is a DISTINCT 'boot line not found' diagnostic
        # (ingestion/#1828), NOT drift — also fail-closed (never pass an unverifiable deploy).
        if: steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true'
        continue-on-error: false
        shell: pwsh
        env:
          NEW_REVISION: ${{ steps.new_revision.outputs.revision }}
        run: |
          . ./operations/devops/Test-BootFlagEffective.ps1
          $ws = az monitor log-analytics workspace list -g '${{ env.RESOURCE_GROUP }}' --query '[0].customerId' -o tsv
          if (-not $ws) {
            Write-Host '::warning::t/3247: no Log Analytics workspace in ${{ env.RESOURCE_GROUP }} — cannot assert in-process flag'
            exit 0
          }
          # Query the NEW revision's boot line only. Bounded retry absorbs LA ingestion lag
          # (~1-3 min typical). Ceiling RETAINED at 8x30s=210s as headroom — warn-phase calibration
          # observed attempt-1 / ~0s across 4 deploys (this step runs post-traffic-shift, so boot
          # logs are already ingested); the margin guards LA ingestion spikes, not a tight bound.
          $q = "ContainerAppConsoleLogs_CL | where RevisionName_s == '$env:NEW_REVISION' | where Log_s has 'embedding offload flag at boot' | project TimeGenerated, Log_s | order by TimeGenerated desc | take 5"
          $lines = @(); $maxAttempts = 8
          for ($i = 1; $i -le $maxAttempts; $i++) {
            $lines = @(az monitor log-analytics query --workspace $ws --analytics-query $q --query '[].Log_s' -o tsv 2>$null | Where-Object { $_ })
            if ($lines.Count -gt 0) { Write-Host "t/3247: boot line found on attempt $i (~$([int](($i-1)*30))s ingest lag)"; break }
            if ($i -lt $maxAttempts) { Write-Host "t/3247: boot line not yet ingested (attempt $i/$maxAttempts) — wait 30s"; Start-Sleep -Seconds 30 }
          }
          $r = Test-BootFlagEffective -BootLogLines $lines
          Write-Host "t/3247 in-process flag assert: Status=$($r.Status) Pass=$($r.Pass) — $($r.Detail)"
          if (-not $r.Pass) {
            if ($r.Status -eq 'Drift') {
              Write-Host "::error::t/3247 CONFIG DRIFT (present in ACA config but process not effective) — $($r.Detail)"
            } else {
              Write-Host "::error::t/3247 BOOT LINE NOT FOUND (ingestion/calibration, NOT drift) — $($r.Detail)"
            }
            exit 1   # BLOCKING (continue-on-error:false): fail-closed on drift OR unverifiable boot line
          }
          Write-Host "::notice::t/3247 in-process offload flag EFFECTIVE — $($r.Detail)"

      - name: Collect failure diagnostics
        # t/3148: warm_gate is a peer failure trigger — a warm-timeout (warm=='false') collects
        # diagnostics on the same footing as an acceptance/persona failure.
        if: steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false' || steps.warm_gate.outputs.warm == 'false'
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Diag = Get-ContainerAppDiagnostics `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          Write-Host '=== Revision Status ==='
          $Diag.RevisionState | Format-Table -AutoSize
          Write-Host ''
          Write-Host '=== Container Console Logs (last 100 lines) ==='
          if ($Diag.ConsoleLogs) { $Diag.ConsoleLogs | ForEach-Object { Write-Host $_ } }
          else { Write-Host '(no console logs available)' }
          Write-Host ''
          Write-Host '=== System Events ==='
          if ($Diag.SystemLogs) { $Diag.SystemLogs | ForEach-Object { Write-Host $_ } }
          else { Write-Host '(no system logs available)' }

      - name: Re-authenticate before rollback
        if: always() && (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false' || steps.warm_gate.outputs.warm == 'false') && steps.current_revision.outputs.revision != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback on failure
        if: always() && (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false' || steps.warm_gate.outputs.warm == 'false') && steps.current_revision.outputs.revision != ''
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "::error::New revision unhealthy — rolling back to ${{ steps.current_revision.outputs.revision }}"
          # TL note 4: traffic-shift BEFORE deactivate — shift failure is recoverable; deactivate-then-shift is not
          Set-ContainerAppTraffic `
            -RevisionName '${{ steps.current_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}' `
            -MaxAttempts 3 `
            -RetryIntervalSec 10
          # Belt-and-suspenders: new_revision.outputs.revision is empty when the
          # deploy step itself failed (e.g. bad image rejected at provision time).
          # Disable is a best-effort cleanup; skip silently if no revision to clean.
          if ('${{ steps.new_revision.outputs.revision }}') {
            Disable-ContainerAppRevision `
              -RevisionName '${{ steps.new_revision.outputs.revision }}' `
              -AppName '${{ env.CONTAINER_APP_NAME }}' `
              -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          }
          Write-Host "Rollback complete. Previous revision restored."
          exit 1

      - name: Fail if unhealthy (no previous revision to rollback to)
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false' || steps.warm_gate.outputs.warm == 'false') && steps.current_revision.outputs.revision == ''
        run: |
          echo "::error::Health check failed and no previous revision exists for rollback"
          exit 1

      - name: Post-deploy verification — serving revision active + /health 200 (t/4242 AC2)
        id: ac2
        if: steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $Rev = '${{ steps.new_revision.outputs.revision }}'
          $Info = az containerapp revision show `
            --name '${{ env.CONTAINER_APP_NAME }}' -g '${{ env.RESOURCE_GROUP }}' --revision $Rev `
            --query '{active:properties.active,weight:properties.trafficWeight}' -o json | ConvertFrom-Json
          $Reason = $null
          if (-not [bool]$Info.active) {
            $Reason = "serving revision '$Rev' is NOT active after deploy"
          } elseif ([int]$Info.weight -ne 100) {
            # SO C4: 100 assumes no canary split (two revisions both > 0% at once) — true today.
            # If canary deploys are introduced, this check needs to change to "the expected split",
            # not a flat 100.
            $Reason = "serving revision '$Rev' traffic weight is $($Info.weight), not 100"
          } else {
            Import-Module ./scripts/AITriad/AITriad.psm1 -Force
            $Health = Test-TaxEditorHealth -BaseUrl '${{ steps.deploy.outputs.appUrl }}' -TimeoutSec 15 -MaxAttempts 3 -RetryIntervalSec 10
            if (-not $Health.Healthy) {
              $Reason = "/health did not return a healthy 200 after deploy. Detail: $($Health | ConvertTo-Json -Depth 3 -Compress)"
            }
          }
          if ($Reason) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "failed=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "reason=$Reason"
            Write-Host "::error::t/4242 AC2 FAILED: $Reason"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "failed=false"
            Write-Host "t/4242 AC2 verified: '$Rev' active at weight 100, /health 200"
          }

      - name: Ops-alert on AC2 failure (t/4242 SO C2)
        # SO review (p/682#33, key risk #2): AC2 runs after the existing rollback steps, which
        # trigger on specific earlier step outputs, not a generic "a later step failed" signal —
        # reordering AC2 above them would NOT actually route its failure into that machinery. This
        # step is the agreed alternative: detect, red the run, AND open a named, actionable issue
        # rather than leaving prod broken until someone reads the run log.
        if: always() && steps.ac2.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ steps.new_revision.outputs.revision }}
          REASON: ${{ steps.ac2.outputs.reason }}
        run: |
          set -uo pipefail
          # SO C2b (p/682#36): a standalone label isn't routed anywhere. Reuse `alert-escalated` —
          # the label DevOps' existing hourly r/23 bridge (Get-CiAlertEscalations.ps1) already
          # polls (`gh issue list --state open --label alert-escalated`) — so this actually reaches
          # someone instead of sitting unrouted. `prod-ac2-alert` stays as a specific sub-label for
          # filtering/history. Dedup like deploy-drift-check.yml: comment on an existing open one
          # instead of opening a duplicate per run.
          gh label create "prod-ac2-alert" --color B60205 --description 'Prod post-deploy serving-revision check failed (t/4242 AC2)' --force >/dev/null 2>&1 || true
          TITLE="🚨 Prod AC2 failed: serving revision $REV is not healthy after deploy"
          BODY=$(printf '**t/4242 AC2 check failed after this deploy run.**\n\n- Revision: `%s`\n- Reason: %s\n- Run: %s/%s/actions/runs/%s\n\nThe deploy run is RED, but this ran after the existing rollback gates (which key off earlier step outputs, not this check), so prod may still be serving this revision. Verify prod state directly and roll back manually if needed (production-release.md).' "$REV" "$REASON" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          EXISTING=$(gh issue list --label "prod-ac2-alert" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing prod-ac2-alert issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --label "prod-ac2-alert,alert-escalated" --body "$BODY"
            echo "Opened new prod-ac2-alert issue (labelled alert-escalated for the r/23 bridge)"
          fi
          echo "::error::t/4242 AC2 failed — ops-alert issue opened/updated: $REASON"
          exit 1

      - name: Post-deploy verification (traffic shifted)
        if: steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $AppUrl = '${{ steps.deploy.outputs.appUrl }}'
          Write-Host "=== Post-deploy smoke test against $AppUrl ==="
          $Results = @(Test-TaxEditorEndpoints -BaseUrl $AppUrl)
          $Fails = @($Results | Where-Object { -not $_.Pass })
          $Results | Format-Table Endpoint, Pass, Status -AutoSize
          Write-Host ""
          Write-Host "=== Smoke test results: $($Results.Count - $Fails.Count) passed, $($Fails.Count) failed ==="
          if ($Fails.Count -gt 0) {
            Write-Host "::warning::Post-deploy smoke had $($Fails.Count) failure(s) — app is live but some endpoints may need attention"
          }

      - name: Prod/staging digest parity (warn-only, t/4194 prevention item 3)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          ./operations/devops/Test-ProdStagingDigestParity.ps1 `
            -ProdApp '${{ env.CONTAINER_APP_NAME }}' `
            -StagingApp '${{ env.CONTAINER_APP_NAME }}-staging' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'


  # ── tag-known-good: t/4170 ask 2 ──────────────────────────────────────────
  # Set-TaxEditorKnownGood was manual-only and never actually run, consistently, across the org
  # move — so the documented known-good rollback (Restore-TaxEditorKnownGood) had no target
  # (t/4170 ask 1, confirmed not a cleanup bug: Remove-StaleContainerImages only deletes
  # UNTAGGED versions). This job makes it part of every successful deploy instead of a manual
  # step nobody remembers to run.
  #
  # SO C3 (t/4170, p/682#28): a SEPARATE job, not a step in `deploy`, so packages:write (needed
  # to PUT the known-good tag via the GHCR OCI API) is scoped to only the one job that needs it —
  # NOT granted workflow-wide to every job, including `preflight`, which handles dispatch inputs.
  #
  # Gated on deploy's own success + the same acceptance/persona outputs the in-job post-deploy
  # steps use (exposed via `deploy`'s `outputs:` block, SO C3), so this never runs on a deploy
  # that didn't actually promote traffic.
  tag-known-good:
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    # Flipped on (t/4091 digest's own "then runs warn-only" plan): C1 (the cmdlet fix, PR #3340,
    # p/682#28) merged 2026-10-17 03:18Z. Caught by Azure (p/241#64) via health-monitor's
    # known-good-liveness job correctly reporting "missing" since 04:55Z — not a wiring bug, the
    # disable switch was simply never removed after its own trigger condition landed. Checkable
    # fact, acted on directly (Pre-Authorized-Trigger Discipline).
    if: needs.deploy.result == 'success' && needs.deploy.outputs.image_accepted == 'true' && needs.deploy.outputs.persona_accepted == 'true'
    timeout-minutes: 10
    continue-on-error: true  # SO C3: a checkout/login/module-import failure must not fail the
                              # job and turn an otherwise-successful deploy run red.
    permissions:
      # SO C3: job-level `permissions:` REPLACES the workflow-level set, it does not merge with
      # it — `packages: write` alone would leave this job with no `id-token`/`contents`, and
      # azure/login (OIDC) would fail. All three are required here.
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set known-good image tag and assert it resolves to the deployed digest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYED_IMAGE_REF: ${{ needs.preflight.outputs.image_ref }}
        run: |
          # WARN-ONLY (continue-on-error on the job's only real step, via try/catch + exit 0
          # below): a GHCR tagging hiccup here must never redden an otherwise-successful deploy.
          # t/4170 ask 3 (Worker, health-monitor.yml) is the liveness backstop that alerts if
          # known-good goes missing or stale across real deploys — that is the mechanism that
          # catches a PERSISTENT failure of this step, not this step's own exit code.
          #
          # SO C1 (owner: PowerShell, scripts/AITriad/Public/Set-TaxEditorKnownGood.ps1, tracked
          # separately): the cmdlet must select the 100%-traffic revision (not Active[0], which is
          # order-dependent across a 0%/100% split) and handle digest refs (prod deploys by
          # digest, t/3679) by fetching the manifest BY DIGEST rather than treating the raw hex as
          # a tag name. Until that lands, this step's try/catch below is expected to warn on every
          # run — tracked on t/4170, not silently masked here.
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $DeployedDigest = ($env:DEPLOYED_IMAGE_REF -split '@')[-1]
          try {
            $Result = Set-TaxEditorKnownGood -ResourceGroup '${{ env.RESOURCE_GROUP }}' -AppName '${{ env.CONTAINER_APP_NAME }}' -Confirm:$false

            # SO C2: assert known-good resolves to the digest actually serving traffic — "any
            # known-good exists" can't fail and proves nothing (e.g. a stale prior tag surviving
            # a failed PUT would pass that check).
            $Check = @(Get-TaxEditorImage -Last 20 | Where-Object { $_.IsKnownGood })
            if ($Check.Count -eq 0) {
              Write-Host "::warning::t/4170: known-good was set (cmdlet returned $($Result | ConvertTo-Json -Compress)) but no image reports IsKnownGood on re-check (GHCR propagation lag, or a real failure)."
            } elseif ($Check[0].Digest -ne $DeployedDigest) {
              Write-Host "::warning::t/4170: known-good resolves to $($Check[0].Digest), which does NOT match the digest serving 100% traffic ($DeployedDigest)."
            } else {
              Write-Host "t/4170: known-good resolves to the deployed digest ($DeployedDigest) — confirmed."
            }
          } catch {
            Write-Host "::warning::t/4170: Set-TaxEditorKnownGood failed: $($_.Exception.Message) — deploy succeeded, but the known-good rollback target was NOT updated this deploy."
          }
