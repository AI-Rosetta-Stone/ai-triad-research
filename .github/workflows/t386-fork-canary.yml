name: t386 fork canary (no-op)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  canary:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","trusted-only"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Print runner name only
        run: echo "runner_name=${{ runner.name }} runner_environment=${{ runner.environment }}"
