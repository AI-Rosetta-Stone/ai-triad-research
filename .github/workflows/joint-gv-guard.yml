# joint-gv-guard — dedicated required status context for the joint-gv auto-merge guard.
#
# WHY THIS IS ITS OWN WORKFLOW (t/3607): the guard was a job inside ci.yml, and the
# label/auto-merge PR events (labeled/unlabeled/auto_merge_enabled) that it needs were
# added to ci.yml's `pull_request` types (t/3332). That made a label toggle re-run the
# ENTIRE CI matrix, which (a) re-opened a transient BLOCKED window on an already-green PR
# (t/3605) and (b) — as Arm E proved (t/3607#3) — a filter-skip "fix" let a label flip
# ci-gate GREEN on a red SHA. Extracting the guard into a lightweight workflow lets ci.yml
# drop the label events entirely (no re-run, no matrix waste), while the guard still fires
# on them here.
#
# CRITICAL — MUST ALWAYS REPORT (mirror of the Arm E bug: a required check that never runs
# blocks a PR as hard as a false green clears one — same class, opposite sign). This is only
# TRUE IF `types` below covers EVERY PR event that can change the gated condition (base,
# labels, auto-merge state). It is NOT a free invariant — it is exactly as complete as that
# list. The list was audited against the failure modes at SO consult e/202#2:
#   • opened/synchronize/reopened — a PR opened or updated against main always gets a result.
#   • labeled/unlabeled          — the joint-gv label being added/removed.
#   • auto_merge_enabled/disabled— auto-merge armed OR disarmed. `auto_merge_disabled` is
#     LOAD-BEARING: it is the guard's own prescribed remediation (line ~"Disable auto-merge").
#     Without it, a compliant author who disables auto-merge would leave the context stuck RED.
#   • edited                     — fires on BASE-BRANCH RETARGET. A PR opened against a feature
#     branch (GitHub silently suggests the parent; pre-self-merge step 0 exists for this) does
#     not run here until its base becomes `main`; retargeting fires `edited`, so the context
#     appears and reports. Without it, a retargeted PR would have NO joint-gv-guard check at
#     all → permanently blocked once this is required.
# The job SELF-GATES: SUCCESS whenever the guard does not apply, FAILURE only when a joint-gv
# PR has auto-merge armed. (Parity note for anyone editing this: adding a new dimension to the
# gated condition means adding its event here, or the "always reports" property silently breaks.)
name: joint-gv-guard

on:
  pull_request:
    branches: [main]
    # See the audited list above. auto_merge_disabled + edited added at e/202#2 (SO conditions
    # 1 & 2) to close the two never-reports gaps in the remediation + base-retarget paths.
    # lint:gated-events: opened,synchronize,reopened,labeled,unlabeled,auto_merge_enabled,auto_merge_disabled,edited
    # ^ machine-readable declaration (t/3646): every event that can change the joint-gv label /
    #   auto-merge state this guard evaluates. workflow-lint asserts pull_request.types ⊇ this set.
    types: [opened, synchronize, reopened, labeled, unlabeled, auto_merge_enabled, auto_merge_disabled, edited]

# The job id below (joint-gv-guard) is the check-run name GitHub reports — the exact string
# to add to branch protection as a required status context.
jobs:
  # ── record-base-ref (t/3687): retarget stale-green guard sink ──────────────
  # Records the base ref NAME this workflow ran against as a commit STATUS, so the
  # pre-self-merge merge-guard can detect a base RETARGET after CI (base-ref-name
  # identity — timestamps and merge-SHA both failed; see merge-guard-predicate.mjs).
  # DIAGNOSTIC ONLY — this status must NEVER be added to required contexts (TL p/331):
  # that would turn a diagnostic into a merge blocker nobody designed. Scoped token
  # (statuses:write only). Posts to the PR HEAD sha, NOT github.sha — on pull_request
  # github.sha is the merge commit, which GitHub rebuilds when main advances (the merge-SHA
  # trap, t/3687), orphaning the status for exactly the long-lived PRs the guard protects.
  # (This workflow is pull_request-only, but the if-guard is kept uniform with the other recorders.)
  record-base-ref:
    name: Record base ref (t/3687)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post base-ref-record commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="base-ref-record/joint-gv-guard" \
            -f description="${BASE_REF}"

  joint-gv-guard:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check joint-gv label + auto-merge state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Make fail-closed EXPLICIT (SO residual 2, e/202#7): GitHub's default run shell is
          # `bash -eo pipefail`, so a malformed-but-200 API response makes jq error → the
          # HAS_* assignment inherits non-zero → job reds. That is the behaviour we want, but it
          # currently rests on an IMPLICIT flag — a future `shell:` override would silently flip
          # it to fail-OPEN (report success on garbage = the Arm E class). State it in-script so
          # it survives a shell change.
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # BEGIN guard-pr-read (t/369)
          # CANONICAL COPY: operations/devops/guard-pr-read.sh. consult-hold-guard.yml and joint-gv-guard.yml
          # inline this block (they have no checkout); operations/devops/guard-pr-read.test.mjs fails if a
          # copy drifts. Reads the PR over REST (core pool), not `gh pr view` (GraphQL pool, exhausted at
          # 14:11Z on 2026-11-11, t/318#8).
          #   guard_read_pr <guard> <owner/repo> <pr-number> <what-a-real-block-is>
          # On success sets PR_JSON to the pulls payload. On failure prints one ::error:: line and exits 1
          # (fail closed: required gate). The failure classes have different remedies, so each is named:
          #   - primary quota at 0: INFRA rate-limit line + step outputs infra/resets, at once. Never sleeps
          #     to the reset (up to an hour); DevOps & Release's ci-infra-rerun (#4967) re-runs once after it.
          #   - secondary limit: waits retry-after (or 60s if absent, per GitHub's docs), capped at 90s;
          #     longer, or still limited on attempt 3, it is the same INFRA line with pool=secondary.
          #   - 5xx / no response: retried with 3/6/9s backoff.
          #   - any other 4xx (token, permission, not found): fails at once; a re-run will not fix it.
          # Header value, or empty. `|| true`: the callers run under set -euo pipefail, and an absent header
          # (grep finds nothing) must read as empty, not end the step.
          _guard_hdr() { { tr -d '\r' <"$1" | sed '/^$/q' | grep -i "^$2:" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//'; } || true; }
          _guard_infra_ratelimit() {
            local resets pool="${1:-core}"
            resets=$(date -u -d "@$2" +%Y-%m-%dT%H:%M:%SZ)
            echo "infra=rate-limit" >>"${GITHUB_OUTPUT:-/dev/null}"
            echo "resets=${resets}" >>"${GITHUB_OUTPUT:-/dev/null}"
            echo "::error::INFRA rate-limit: GitHub API quota exhausted (pool=${pool}), resets=${resets}; not a policy verdict, re-run after the reset"
            exit 1
          }
          guard_read_pr() {
            local guard="$1" repo="$2" pr="$3" what="$4"
            local out="${RUNNER_TEMP:-/tmp}/${guard}.resp" errf="${RUNNER_TEMP:-/tmp}/${guard}.err"
            local attempt status remaining reset retry_after wait last_err=""
            PR_JSON=""
            for attempt in 1 2 3; do
              if gh api -i "repos/${repo}/pulls/${pr}" >"$out" 2>"$errf"; then
                PR_JSON=$(tr -d '\r' <"$out" | sed '1,/^$/d')
                return 0
              fi
              last_err=$(head -c 400 "$errf" 2>/dev/null | tr '\n' ' ')
              status=$(tr -d '\r' <"$out" | sed -n '1s/^HTTP\/[0-9.]* \([0-9][0-9]*\).*/\1/p')
              if [ "$status" = 403 ] || [ "$status" = 429 ]; then
                remaining=$(_guard_hdr "$out" x-ratelimit-remaining)
                reset=$(_guard_hdr "$out" x-ratelimit-reset)
                if [ "$remaining" = 0 ] && [[ "$reset" =~ ^[0-9]+$ ]]; then
                  _guard_infra_ratelimit "$(_guard_hdr "$out" x-ratelimit-resource | tr -cd 'a-z_')" "$reset"
                fi
                retry_after=$(_guard_hdr "$out" retry-after)
                if [ -n "$retry_after" ] || grep -qi 'secondary rate limit' "$out"; then
                  wait=60
                  if [[ "$retry_after" =~ ^[0-9]+$ ]]; then wait=$retry_after; fi
                  if [ "$wait" -gt 90 ] || [ "$attempt" -eq 3 ]; then
                    _guard_infra_ratelimit secondary "$(( $(date +%s) + wait ))"
                  fi
                  echo "::warning::${guard}: secondary rate limit on attempt ${attempt}/3 (HTTP ${status}) — retrying in ${wait}s"
                  sleep "$wait"
                  continue
                fi
              fi
              if [ -n "$status" ] && [ "$status" -lt 500 ]; then
                echo "::error::${guard}: could NOT read the PR (HTTP ${status}) — API failure, NOT ${what}. Last error: ${last_err}. A token/permission error will NOT recover on re-run: fix the workflow. (Failing closed — required gate.)"
                exit 1
              fi
              echo "::warning::${guard}: PR read attempt ${attempt}/3 failed (HTTP ${status:-none}) — ${last_err} — retrying in $((attempt * 3))s"
              sleep $((attempt * 3))
            done
            echo "::error::${guard}: could NOT read the PR after 3 attempts — API/INFRA failure, NOT ${what}. Last error: ${last_err}. A transient 5xx -> re-run this job. (Failing closed — required gate.)"
            exit 1
          }
          # END guard-pr-read
          guard_read_pr joint-gv-guard "$REPO" "$PR_NUMBER" "a joint-gv violation"

          # Shape assertion (SO e/202#9, TL p/331#1295 — COMPLEMENT to set -euo pipefail, not a
          # substitute): a malformed-but-200 payload ({}, partial JSON) makes the jq parses below
          # fail. set -e already reds the job (fail-closed, correct), but the only diagnostic would
          # be jq's raw "Cannot iterate over null" on a step whose legible errors all name auto-merge
          # / API failure — a THIRD indistinguishable red among {violation, infra, malformed}, each
          # with a different remedy. Name this cause explicitly so the red is triageable.
          if ! echo "$PR_JSON" | jq -e 'has("labels") and has("auto_merge")' >/dev/null 2>&1; then
            echo "::error::joint-gv-guard: PR state read succeeded but the payload is MALFORMED (missing labels/auto_merge) — NOT a joint-gv violation, NOT an API-unreachable failure. Re-run; if it persists, the REST pulls contract changed. (Failing closed — required gate.)"
            exit 1
          fi

          HAS_JOINT_GV=$(echo "$PR_JSON" | jq -r '[.labels[].name] | contains(["joint-gv"]) | tostring')
          HAS_AUTO_MERGE=$(echo "$PR_JSON" | jq -r '(.auto_merge != null) | tostring')

          echo "joint-gv label: $HAS_JOINT_GV"
          echo "auto-merge armed: $HAS_AUTO_MERGE"

          if [ "$HAS_JOINT_GV" = "true" ] && [ "$HAS_AUTO_MERGE" = "true" ]; then
            echo "::error::joint-gv PR has auto-merge enabled. Disable auto-merge; a joint-gv PR must be manually merged with --match-head-commit after the GV."
            exit 1
          fi
          echo "guard OK — not a joint-gv PR with auto-merge armed; reporting success."

      # t/314 (t/313 observability): CANONICAL COPY of this step lives in
      # operations/devops/rate-limit-snapshot-step.yml; operations/devops/rate-limit-snapshot-step.test.mjs
      # fails if a guard's copy drifts. Some guards have no checkout, so the step is inline.
      # Records the repo-wide GITHUB_TOKEN installation quota (REST core + GraphQL) as it stands at
      # the end of this job: a snapshot of the shared pool, not this job's own usage, and App tokens
      # are not in it. GET /rate_limit does not count against the PRIMARY limit but can count against
      # the secondary one (GitHub REST rate-limits doc). Never fails the job; timeout-minutes bounds a
      # hung call, since continue-on-error does not (Second-Opinion, #5029).
      - name: Rate-limit snapshot (t/314)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Comma-joined, read with IFS=, (not whitespace), so an empty field can't shift the
          # later values; each value must be a number on its own (Quality, #5028 review).
          allnum() { for v in "$@"; do [[ "$v" =~ ^[0-9]+$ ]] || return 1; done; }
          if out=$(gh api rate_limit --jq '[.resources.core.used, .resources.core.remaining, .resources.core.limit, .resources.core.reset, .resources.graphql.used, .resources.graphql.remaining, .resources.graphql.limit] | map(tostring) | join(",")' 2>&1) \
            && IFS=, read -r cu cr cl creset gu gr gl extra <<<"$out" && [ -z "$extra" ] && allnum "$cu" "$cr" "$cl" "$creset" "$gu" "$gr" "$gl"; then
            reset=$(date -u -d "@$creset" +%H:%M:%SZ 2>/dev/null || echo "$creset")
            echo "t/314 rate-limit: workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB core used=$cu remaining=$cr limit=$cl reset=$reset graphql used=$gu remaining=$gr limit=$gl"
            {
              echo "### GITHUB_TOKEN rate limit at end of job (t/314)"
              echo ""
              echo "| API | used | remaining | limit |"
              echo "|---|---|---|---|"
              echo "| REST core | $cu | $cr | $cl |"
              echo "| GraphQL | $gu | $gr | $gl |"
              echo ""
              echo "REST core window resets at $reset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::t/314: could not read GET /rate_limit, so no rate-limit snapshot for this job (${out:-no output})."
          fi
