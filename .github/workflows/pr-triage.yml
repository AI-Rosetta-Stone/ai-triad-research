# ─── PR Backlog Triage ────────────────────────────────────────────────────────
# What:  Weekly hygiene pass over the open PR backlog.
#        1. Closes superseded bot PRs (older bump of the same dep).
#        2. Closes conflicting bot PRs — EXCEPT security-labeled ones (digest instead).
#        3. Re-triggers stranded fleet PRs (green checks but stuck/behind).
#        4. Posts a digest of everything remaining that needs a human decision.
# When:  Monday 09:00 UTC (cron) or manually (workflow_dispatch, dry_run=true default).
#        The schedule trigger is ALWAYS dry until observation runs validate (t/2075).
# Fleet PRs are NEVER closed — only re-triggered or surfaced. (t/2075)

name: PR triage

on:
  schedule:
    - cron: '0 9 * * 1'    # Monday 09:00 UTC — full weekly triage
    - cron: '0 */2 * * *'  # every 2 hours — idle-green nudge sweep (t/2523)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report only, no destructive actions'
        type: boolean
        default: true

permissions:
  contents: write       # updateBranch
  pull-requests: write  # close + comment
  actions: write        # rerequestSuite fallback (silent 403 without this)
  issues: write         # t/4115: stuck-PR tracking issue + sweep-signature alerts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: PR triage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // ── 0. Dry-run resolution ──────────────────────────────────────────────
            // Schedule runs LIVE — observation runs validated (t/2075#5, TL approved).
            // Dispatch default remains dry_run=true (safe for manual runs).
            const dryRun = context.eventName === 'schedule'
              ? false
              : (context.payload.inputs?.dry_run === 'true');

            core.info(`PR triage — trigger=${context.eventName}, dryRun=${dryRun}`);

            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // ── 1. Semver helpers ──────────────────────────────────────────────────
            // Numeric comparison — "9.0.0" < "10.0.0" correctly.
            function parseSemver(v) {
              const m = String(v).match(/^(\d+)\.(\d+)\.(\d+)/);
              return m ? [parseInt(m[1]), parseInt(m[2]), parseInt(m[3])] : null;
            }
            function semverGt(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a[i] > b[i]) return true;
                if (a[i] < b[i]) return false;
              }
              return false;
            }

            // ── 2. Fetch all open PRs (paginated) ─────────────────────────────────
            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            core.info(`Open PRs: ${allPRs.length}`);

            // ── 3. Classify PRs ────────────────────────────────────────────────────
            // github-actions[bot] is only used as a git commit identity in this
            // repo (cluster-conflicts.yml commits directly; it does NOT open PRs).
            // Keeping it in BOT_LOGINS as a safe guard in case that changes.
            const BOT_LOGINS = new Set(['dependabot[bot]', 'github-actions[bot]']);
            const botPRs   = allPRs.filter(pr => BOT_LOGINS.has(pr.user.login));
            const fleetPRs = allPRs.filter(pr => !BOT_LOGINS.has(pr.user.login));
            core.info(`Bot: ${botPRs.length}, Fleet: ${fleetPRs.length}`);

            // ── 4. Title parser (strict fail-safe) ────────────────────────────────
            // Only matches the exact Dependabot single-package format:
            //   "Bump <dep> from <old> to <new> in <dir>"
            // Grouped updates ("Bump the npm group…"), security-suffix variants,
            // and root-dir PRs (no "in <dir>") do NOT match → never closed.
            const BUMP_RE = /^Bump (.+) from (\S+) to (\S+) in (.+)$/;

            function parseTitle(title) {
              const m = title.match(BUMP_RE);
              if (!m) return null;
              const [, dep, fromVer, toVer, dir] = m;
              const toSemver = parseSemver(toVer);
              if (!toSemver) return null;  // non-semver "to" → don't close
              return { dep, fromVer, toVer, toSemver, dir };
            }

            // ── 5. Process bot PRs ────────────────────────────────────────────────
            const closedPRs   = [];
            const digestItems = [];
            const nudgedPRs   = [];  // step 9 — idle-green nudges (t/2523)

            // 5a. Group by (dep, dir) — keep highest semver "to", close the rest
            const groups = new Map();
            for (const pr of botPRs) {
              const parsed = parseTitle(pr.title);
              if (!parsed) {
                digestItems.push({ pr, reason: 'Unparseable title — skipped auto-close, needs review' });
                continue;
              }
              const key = `${parsed.dep}::${parsed.dir}`;
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push({ pr, parsed });
            }

            for (const [, entries] of groups) {
              if (entries.length <= 1) continue;

              // Numeric semver — find the highest "to" version
              let best = entries[0];
              for (const e of entries.slice(1)) {
                if (semverGt(e.parsed.toSemver, best.parsed.toSemver)) best = e;
              }

              for (const e of entries) {
                if (e === best) continue;
                const reason = `Superseded by #${best.pr.number} (${best.parsed.dep} → ${best.parsed.toVer})`;
                if (!dryRun) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: e.pr.number,
                    body: `Closing as superseded: ${reason}.`,
                  });
                  await github.rest.pulls.update({
                    owner, repo, pull_number: e.pr.number, state: 'closed',
                  });
                }
                closedPRs.push({ pr: e.pr, reason });
                core.info(`${dryRun ? '[DRY]' : '[LIVE]'} Close #${e.pr.number}: ${reason}`);
              }
            }

            // 5b. Conflicting bot PRs — exempt security-labeled ones
            const handledNums = new Set(closedPRs.map(c => c.pr.number));
            const digestNums  = new Set(digestItems.map(d => d.pr.number));

            for (const pr of botPRs) {
              if (handledNums.has(pr.number) || digestNums.has(pr.number)) continue;

              // Fetch full PR for mergeable state (not available in list response)
              const { data: full } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });

              // null = GitHub still computing; skip rather than risk a false close
              if (full.mergeable !== false) continue;

              // Security-labeled → NEVER auto-close, always digest
              const labels = pr.labels.map(l => l.name.toLowerCase());
              if (labels.includes('security')) {
                digestItems.push({ pr, reason: 'Conflicting + security-labeled — needs human review' });
                digestNums.add(pr.number);
                continue;
              }

              const reason = 'Conflicting with main (no security label)';
              if (!dryRun) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: 'Closing: PR conflicts with main. A newer Dependabot update will cover this dependency.',
                });
                await github.rest.pulls.update({
                  owner, repo, pull_number: pr.number, state: 'closed',
                });
              }
              closedPRs.push({ pr, reason });
              handledNums.add(pr.number);
              core.info(`${dryRun ? '[DRY]' : '[LIVE]'} Close #${pr.number}: ${reason}`);
            }

            // ── 6. Re-trigger stranded fleet PRs ─────────────────────────────────
            // Fleet PRs are NEVER closed — only re-triggered or surfaced.
            const retriggeredPRs = [];

            for (const pr of fleetPRs) {
              if (pr.draft) continue;

              // Get check runs for this PR's head SHA
              const { data: checksData } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });

              // Keep the most recent result per check name
              const byName = {};
              for (const c of checksData.check_runs) {
                const prev = byName[c.name];
                if (!prev || new Date(c.started_at) > new Date(prev.started_at)) {
                  byName[c.name] = c;
                }
              }

              const ciGate = byName['ci-gate'];
              const codeQL = byName['CodeQL'];

              // Case A: Both required checks green — branch may be behind main
              const isGreen = ciGate?.conclusion === 'success' && codeQL?.conclusion === 'success';
              if (isGreen) {
                const { data: full } = await github.rest.pulls.get({
                  owner, repo, pull_number: pr.number,
                });
                if (full.mergeable_state === 'behind') {
                  if (!dryRun) {
                    try {
                      await github.rest.pulls.updateBranch({
                        owner, repo, pull_number: pr.number,
                      });
                    } catch (e) {
                      core.warning(`update-branch #${pr.number}: ${e.message}`);
                      digestItems.push({ pr, reason: `Green but update-branch failed: ${e.message}` });
                      continue;
                    }
                  }
                  retriggeredPRs.push({ pr, action: 'update-branch (was behind main)' });
                  core.info(`${dryRun ? '[DRY]' : '[LIVE]'} update-branch #${pr.number}`);
                  continue;
                }
                // Green + not behind → already in queue, just slow — digest
                digestItems.push({ pr, reason: 'Checks green, not behind main — auto-merge pending or stuck in queue' });
                continue;
              }

              // Case B: ci-gate never ran — dispatch ci.yml on the PR branch.
              // rerequestSuite always 403s with GITHUB_TOKEN (t/2115); workflow_dispatch
              // with actions:write works and targets the branch directly.
              if (!ciGate) {
                if (!dryRun) {
                  try {
                    await github.rest.actions.createWorkflowDispatch({
                      owner, repo,
                      workflow_id: 'ci.yml',
                      ref: pr.head.ref,
                    });
                  } catch (e) {
                    core.warning(`workflow-dispatch ci.yml on #${pr.number} (${pr.head.ref}): ${e.message}`);
                    digestItems.push({ pr, reason: `ci-gate absent — workflow dispatch failed: ${e.message}` });
                    continue;
                  }
                }
                retriggeredPRs.push({ pr, action: `workflow-dispatch ci.yml on ${pr.head.ref} (ci-gate never ran)` });
                core.info(`${dryRun ? '[DRY]' : '[LIVE]'} workflow-dispatch ci.yml #${pr.number} (${pr.head.ref})`);
                continue;
              }

              // Case C: checks exist but not all green — let digest explain
            }

            // ── 7. Digest — everything remaining ─────────────────────────────────
            const allHandled = new Set([
              ...closedPRs.map(c => c.pr.number),
              ...retriggeredPRs.map(r => r.pr.number),
              ...digestItems.map(d => d.pr.number),
            ]);

            for (const pr of allPRs) {
              if (allHandled.has(pr.number)) continue;

              const { data: checksData } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const byName2 = {};
              for (const c of checksData.check_runs) byName2[c.name] = c;

              let reason = 'Needs human/TL decision';
              if (pr.draft) {
                reason = 'Draft — awaiting author';
              } else if (byName2['ci-gate']?.conclusion === 'failure') {
                reason = `ci-gate failing — ${pr.html_url}/checks`;
              } else if (byName2['ci-gate']?.status === 'in_progress') {
                reason = 'ci-gate still running';
              } else if (!byName2['ci-gate']) {
                reason = 'ci-gate missing — checks never triggered';
              } else if (byName2['CodeQL']?.conclusion === 'failure') {
                reason = 'CodeQL failing';
              } else if (byName2['CodeQL']?.status === 'in_progress') {
                reason = 'CodeQL still running';
              } else if (!byName2['CodeQL']) {
                reason = 'CodeQL check absent';
              }

              digestItems.push({ pr, reason });
            }

            // ── 9. Nudge idle-green fleet PRs (t/2523) ────────────────────────────
            // Advisory nudge — not a blocking gate. Posts exactly once per head SHA
            // on fleet PRs where CI has been green >30 min with no recorded hold.
            // Idempotent: the hidden marker prevents re-nudge on repeat sweeps.
            //
            // CodeQL absent vs pending (Quality TL note): absent = satisfied
            // (docs-only PR skipped by paths-ignore); in_progress/queued = still
            // running, skip nudge. These are different states and must be checked
            // explicitly — do NOT treat absent and pending the same.
            const NUDGE_MARKER_PREFIX = '<!-- pr-triage-nudge-sha:';
            const HOLD_RE = /^HOLD:/im;
            const THIRTY_MIN_MS = 30 * 60 * 1000;
            const nowMs = Date.now();

            for (const pr of fleetPRs) {
              if (pr.draft) continue;

              // Fetch check runs for this head SHA
              const { data: nudgeChecks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const byNameNudge = {};
              for (const c of nudgeChecks.check_runs) {
                const prev = byNameNudge[c.name];
                if (!prev || new Date(c.started_at) > new Date(prev.started_at))
                  byNameNudge[c.name] = c;
              }

              const ciGateNudge = byNameNudge['ci-gate'];
              const codeQLNudge = byNameNudge['CodeQL'];

              // ci-gate must be present and successful
              if (!ciGateNudge || ciGateNudge.conclusion !== 'success') continue;

              // CodeQL: absent → satisfied (docs-only, paths-ignore skipped it).
              // in_progress/queued → still running, don't nudge yet.
              // failure/cancelled → not green, don't nudge.
              if (codeQLNudge) {
                if (codeQLNudge.status === 'in_progress' || codeQLNudge.status === 'queued') continue;
                if (codeQLNudge.conclusion !== 'success') continue;
              }

              // Must have been green for >30 min
              const greenAt = new Date(ciGateNudge.completed_at).getTime();
              if (nowMs - greenAt < THIRTY_MIN_MS) continue;

              // Check for holds: CHANGES_REQUESTED reviews or HOLD: comments
              const { data: prReviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number,
              });
              if (prReviews.some(r => r.state === 'CHANGES_REQUESTED')) continue;

              const { data: prComments } = await github.rest.issues.listComments({
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              if (prComments.some(c => HOLD_RE.test(c.body))) continue;

              // Idempotency: skip if this exact head SHA was already nudged.
              // A repeat sweep must NOT post a second nudge (Quality TL note).
              const nudgeMarker = `${NUDGE_MARKER_PREFIX} ${pr.head.sha} -->`;
              if (prComments.some(c => c.body.includes(nudgeMarker))) continue;

              // Post nudge comment
              const elapsedMin = Math.round((nowMs - greenAt) / 60000);
              const nudgeBody = [
                `@${pr.user.login} CI has been green for ${elapsedMin} min — merge when ready,`,
                `or add a comment starting with \`HOLD: <reason>\` to suppress this nudge.`,
                nudgeMarker,
              ].join('\n');

              if (!dryRun) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number, body: nudgeBody,
                });
              }
              nudgedPRs.push({ pr, elapsedMin });
              core.info(`${dryRun ? '[DRY]' : '[LIVE]'} Nudge #${pr.number} (green ${elapsedMin} min, @${pr.user.login})`);
            }

            // ── 8. Job summary ────────────────────────────────────────────────────
            const runDate = new Date().toISOString().slice(0, 10);
            const mode    = dryRun ? 'DRY RUN' : 'LIVE';

            const toRow = ({ pr, reason }) => [`#${pr.number}`, pr.title.slice(0, 80), reason ?? ''];
            const header3 = (cells) => cells.map(data => ({ data, header: true }));

            await core.summary
              .addHeading(`PR Triage — ${mode} — ${runDate}`, 2)
              .addRaw(dryRun ? '> ⚠️ Dry run — no destructive actions taken.\n\n' : '')
              .addHeading(`Closed (${closedPRs.length})`, 3)
              .addTable([
                header3(['PR', 'Title', 'Reason']),
                ...(closedPRs.length ? closedPRs.map(toRow) : [['—', '—', '—']]),
              ])
              .addHeading(`Re-triggered (${retriggeredPRs.length})`, 3)
              .addTable([
                header3(['PR', 'Title', 'Action']),
                ...(retriggeredPRs.length ? retriggeredPRs.map(({ pr, action }) => [`#${pr.number}`, pr.title.slice(0, 80), action]) : [['—', '—', '—']]),
              ])
              .addHeading(`Nudged — idle green >30 min (${nudgedPRs.length})`, 3)
              .addTable([
                header3(['PR', 'Title', 'Green for']),
                ...(nudgedPRs.length ? nudgedPRs.map(({ pr, elapsedMin }) => [`#${pr.number}`, pr.title.slice(0, 80), `${elapsedMin} min`]) : [['—', 'No items', '']]),
              ])
              .addHeading(`Digest — needs attention (${digestItems.length})`, 3)
              .addTable([
                header3(['PR', 'Title', 'Stuck reason']),
                ...(digestItems.length ? digestItems.map(toRow) : [['—', 'No items', '']]),
              ])
              .write();

            core.info(`Done — closed:${closedPRs.length} retriggered:${retriggeredPRs.length} nudged:${nudgedPRs.length} digest:${digestItems.length}`);

  # ── Stuck-PR SLA alert + sweep-signature detector (t/4115, t/4096 item 2) ───────────────
  # ALERT-ONLY — never blocks a merge, never pings the PI. Runs every 2h, same cadence as the
  # idle-green nudge above. The pure classifier (operations/devops/stuck-pr-classifier.mjs) is
  # reviewed and unit-tested separately; this step is the thin, impure fact-fetch + routing
  # half (main-ci-monitor.yml's pure/impure split, same convention).
  stuck-pr-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Self-health — classifier unit suite
        # Same t/3737#4 principle as main-ci-monitor: re-run the unit suite every scheduled
        # run, so a regression that breaks detection FAILS THIS JOB loudly instead of letting
        # the alert silently stop firing.
        run: node --test operations/devops/stuck-pr-classifier.test.mjs

      - name: Stuck-PR SLA + sweep-signature alert
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const { pathToFileURL } = require('url');
            const {
              classifyBlocker, escalationLevel, detectSweepSignature, classifySweepHits,
              REQUIRED_CONTEXTS, REQUIRED_CONTEXT_PATHS, ARM_EVENT_RE,
            } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/operations/devops/stuck-pr-classifier.mjs`).href);

            const owner = context.repo.owner, repo = context.repo.repo;
            const nowMs = Date.now();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // ── Facts: open, non-draft PRs + their required-context runs ──────────────
            const allPRs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const openPRs = allPRs.filter((pr) => !pr.draft);

            // t/4096#1: derive a branch-hint ticket (t/NNNN) for the bridge to try FIRST, per
            // the Lead's review (#4): resolution itself happens in the bridge (Get-StuckPRAlerts.ps1
            // -- ticket assignee via get_ticket, then resolve_owners_batch on changed files), not
            // here. This is a hint only -- the workflow never claims to have resolved an owner.
            function ticketHintFromBranch(ref) {
              const m = (ref || '').match(/t(\d{3,5})/i);
              return m ? `t/${m[1]}` : null;
            }

            // MUST-fix (Lead review, PR #3141): exclude the alert's OWN writes (and other bot
            // activity) from "last activity", or every scheduled run resets its own idle/held
            // clock. Last activity = newest of the head commit date and the latest comment or
            // review from a NON-bot actor.
            async function lastNonBotActivity(pr) {
              const times = [pr.head?.commit?.committer?.date ?? pr.created_at];
              const [{ data: comments }, { data: reviews }] = await Promise.all([
                github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 }),
                github.rest.pulls.listReviews({ owner, repo, pull_number: pr.number, per_page: 100 }),
              ]);
              for (const c of comments) {
                if (c.user?.type === 'Bot') continue;
                times.push(c.created_at);
              }
              for (const r of reviews) {
                if (r.user?.type === 'Bot') continue;
                times.push(r.submitted_at);
              }
              return times.filter(Boolean).sort().at(-1);
            }

            const blockerFindings = [];
            for (const pr of openPRs) {
              const { data: full } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              const runsResp = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: pr.head.sha, per_page: 100,
              }).catch(() => ({ data: { workflow_runs: [] } }));

              // Newest run per required-context workflow PATH on this exact head SHA (MUST-fix:
              // match on .path, never .name -- "CI"/"CodeQL SAST" are workflow DISPLAY names,
              // not the required-context names; see stuck-pr-classifier.mjs's REQUIRED_CONTEXT_PATHS).
              //
              // t/4322 (Azure, p/786#11): a path can carry MULTIPLE runs on the same head_sha from
              // different trigger events -- e.g. a manual workflow_dispatch re-run alongside the
              // real pull_request-event run. Only the pull_request-event run (associated with THIS
              // PR via run.pull_requests) feeds the PR's required-status rollup; a failing
              // workflow_dispatch run on the same head is a different, non-rollup check-run entirely,
              // and picking "newest run regardless of event" can select it over a green PR-event run
              // (observed on #3392: a 15:58Z workflow_dispatch failure outranked the 15:49Z green
              // pull_request run by timestamp, producing a false required-check-failed/stuck alert).
              // Prefer pull_request-event runs associated with this exact PR number; fall back to
              // any event only when no pull_request-event run exists yet for that path (e.g. a
              // brand-new required workflow that hasn't had a PR-triggered run), so detection isn't
              // silently lost before a PR-event run shows up.
              const requiredPaths = new Set(Object.values(REQUIRED_CONTEXT_PATHS));
              const isPrEventRunForThisPr = (run) => run.event === 'pull_request'
                && (run.pull_requests ?? []).some((p) => p.number === pr.number);
              const byPath = new Map();
              const byPathAnyEvent = new Map();
              for (const run of runsResp.data.workflow_runs ?? []) {
                if (!requiredPaths.has(run.path)) continue;
                const entry = {
                  path: run.path, status: run.status, conclusion: run.conclusion,
                  createdAt: run.created_at, startedAt: run.run_started_at, runAttempt: run.run_attempt, id: run.id,
                };
                const prevAny = byPathAnyEvent.get(run.path);
                if (!prevAny || new Date(run.created_at) > new Date(prevAny.createdAt)) {
                  byPathAnyEvent.set(run.path, entry);
                }
                if (!isPrEventRunForThisPr(run)) continue;
                const prev = byPath.get(run.path);
                if (!prev || new Date(run.created_at) > new Date(prev.createdAt)) {
                  byPath.set(run.path, entry);
                }
              }
              // Fallback fills any path with no pull_request-event run for this PR yet.
              for (const [path, entry] of byPathAnyEvent) {
                if (!byPath.has(path)) byPath.set(path, entry);
              }

              const prFacts = {
                mergeableState: full.mergeable_state,
                // t/4356 (TL, p/331#2172): #3432/#3455 sat armed-but-DIRTY for hours, unflagged --
                // `full.mergeable` (a lazily-computed tri-state true/false/null) can lag or read
                // non-false while GitHub's own `mergeable_state` already reports 'dirty'. Check
                // both, matching this field's own documented contract in stuck-pr-classifier.mjs
                // ("mergeable === false / mergeable_state === 'dirty'"), which this line never
                // actually implemented.
                isConflicting: full.mergeable === false || full.mergeable_state === 'dirty',
                autoMergeEnabled: !!full.auto_merge,
                labels: (full.labels || []).map((l) => (typeof l === 'string' ? l : l.name)),
                runs: [...byPath.values()],
                mergeRefusalText: full.mergeable_state === 'blocked'
                  ? `Derived (not a live REST attempt): mergeable_state=blocked with required contexts ${JSON.stringify([...byPath.entries()].map(([p, r]) => `${p}:${r.status}/${r.conclusion}`))}`
                  : null,
                lastActivityAt: await lastNonBotActivity(full),
              };

              const blocker = classifyBlocker(prFacts, nowMs);
              if (blocker) blockerFindings.push({ pr: full, ticketHint: ticketHintFromBranch(full.head.ref), ...blocker });
            }

            // ── SLA: one idempotent comment per blocker episode, escalate at 2h/6h ─────
            const EPISODE_MARKER = '<!-- stuck-pr-alert:';
            for (const f of blockerFindings) {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: f.pr.number, per_page: 100 });
              const marker = `${EPISODE_MARKER}${f.class}:${f.pr.head.sha} -->`;
              const existing = comments.find((c) => c.body.includes(marker));

              // Episode age: time since this EXACT (class, head sha) was first named, not
              // since the PR opened -- a new head sha or a new blocker class starts a fresh clock.
              const episodeStartMs = existing ? Date.parse(existing.created_at) : nowMs;
              const episodeAgeHours = (nowMs - episodeStartMs) / 3600000;
              const level = escalationLevel(f.class, episodeAgeHours);

              if (f.class === 'held') {
                core.info(`#${f.pr.number}: held (${f.detail.labels.join(',')}) -- reporting age only, no action`);
                continue;
              }
              if (existing) continue; // one comment per episode; escalation happens via the digest below, not a repost

              const remedyText = f.detail.remedy ? `\n\nRemedy: ${f.detail.remedy}` : '';
              // Owner RESOLUTION happens in the local bridge (Get-StuckPRAlerts.ps1), not here
              // (Lead review #4): this comment carries the branch-derived ticket as a HINT only.
              const hintText = f.ticketHint ? `ticket hint ${f.ticketHint} (branch name)` : 'no ticket hint in branch name';
              const body = [
                `**Stuck-PR alert (t/4115, alert-only — never blocks the merge):**`,
                `Blocker: \`${f.class}\` — ${JSON.stringify(f.detail)}`,
                `Owner: resolved by the local bridge from the ticket assignee, falling back to the changed files (${hintText}).${remedyText}`,
                `This comment is posted once per blocker episode (same class + head SHA). Escalation: owner ping at 2h, TL at 6h, never the PI — via the stuck-pr-alert label bridge.`,
                marker,
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: f.pr.number, body });
              core.info(`#${f.pr.number}: NEW blocker ${f.class}, level=${level}`);
            }

            // Escalation label: lets a local Orca bridge (same pattern as main-ci-monitor's
            // alert-escalated label) find PRs needing an owner/TL ping without re-parsing
            // every PR comment. Applied once the SLA threshold is actually crossed.
            for (const f of blockerFindings) {
              if (f.class === 'held') continue;
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: f.pr.number, per_page: 100 });
              const marker = `${EPISODE_MARKER}${f.class}:${f.pr.head.sha} -->`;
              const existing = comments.find((c) => c.body.includes(marker));
              if (!existing) continue;
              const episodeAgeHours = (nowMs - Date.parse(existing.created_at)) / 3600000;
              const level = escalationLevel(f.class, episodeAgeHours);
              if (level === 'none') continue;
              const label = level === 'tl' ? 'stuck-pr-alert-tl' : 'stuck-pr-alert-owner';
              const hasLabel = (f.pr.labels || []).some((l) => (l.name || l) === label);
              if (!hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: f.pr.number, labels: [label] });
                core.info(`#${f.pr.number}: labelled ${label} (episode age ${episodeAgeHours.toFixed(1)}h)`);
              }
            }

            core.summary.addHeading('Stuck-PR alert (t/4115)', 3)
              .addTable([
                [{ data: 'PR', header: true }, { data: 'Class', header: true }, { data: 'Ticket hint', header: true }, { data: 'Detail', header: true }],
                ...(blockerFindings.length
                  ? blockerFindings.map((f) => [`#${f.pr.number}`, f.class, f.ticketHint ?? '(none)', JSON.stringify(f.detail).slice(0, 100)])
                  : [['—', 'No blockers found', '', '']]),
              ]).write();

            // ── Sweep-signature detector (t/4096#4, t/3716; D1/D2/D3 fixed under t/4123) ────
            // Repo-wide issue-events feed, NOT GraphQL timelines (t/3716#18: GraphQL omits
            // AutoMergeEnabledEvent). D3: lookback is 3h, not 2h -- GitHub's cron runs late
            // (the 12:00 slot once ran at 12:36), so a fixed 2h window could leave an
            // unscanned gap between consecutive runs. The <!-- sweep-signature: --> marker
            // (below) makes re-scanning the same window idempotent, so widening the lookback
            // costs nothing but a few extra API reads.
            const LOOKBACK_MS = 3 * 3600000;
            const sinceMs = nowMs - LOOKBACK_MS;
            const rawEvents = await github.paginate(github.rest.issues.listEventsForRepo, { owner, repo, per_page: 100 })
              .catch((e) => { core.warning(`issue-events fetch failed: ${e.message}`); return []; });
            // D1 (BLOCKING): filter on ARM_EVENT_RE (imported from the classifier -- ONE list,
            // not a second hardcoded one) instead of the two assumed names ('auto_merge_enabled',
            // 'auto_update_enabled') that matched ~0.1% of this repo's real arm events. Also pull
            // 'labeled'/'unlabeled' into the SAME feed so the pure detector can compute held-at-
            // arm-time itself (D2), instead of a scan-time pulls.get snapshot. 'merged' is pulled
            // in too (t/4131): ready_for_review -> merged with no arm event in between is an
            // ARM-EQUIVALENT hit -- exactly what `gh pr ready` + `gh pr merge --auto` produces on
            // an already-green PR (GitHub merges immediately, logging no arm event at all).
            const relevant = rawEvents
              .filter((e) => e.event === 'ready_for_review' || e.event === 'labeled' || e.event === 'unlabeled' || e.event === 'merged' || ARM_EVENT_RE.test(e.event))
              .filter((e) => new Date(e.created_at).getTime() >= sinceMs)
              .map((e) => ({ prNumber: e.issue?.number, event: e.event, label: e.label?.name, actor: e.actor?.login ?? 'unknown', createdAt: e.created_at }))
              .filter((e) => e.prNumber);

            // D2 fix (Lead review, PR #3152): held-at-arm-time is computed by the pure
            // function walking BACKWARDS from the live (current) label snapshot, undoing
            // every labeled/unlabeled event after the arm -- exact regardless of whether the
            // PR's original hold label predates the lookback window. Fetch the live snapshot
            // for every PR that has at least one arm OR merged event in the window (a cheap
            // existence check; the full ready+arm/merged pairing happens inside the pure
            // function itself). GitHub keeps a PR's labels readable via pulls.get after it
            // merges, so this works unchanged for the merge-equivalent case (t/4131).
            const candidatePrNumbers = [...new Set(relevant.filter((e) => ARM_EVENT_RE.test(e.event) || e.event === 'merged').map((e) => e.prNumber))];
            const liveLabelsByPr = new Map();
            for (const prNumber of candidatePrNumbers) {
              const { data: p } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber }).catch(() => ({ data: null }));
              liveLabelsByPr.set(prNumber, p ? (p.labels || []).map((l) => l.name || l) : []);
            }
            const sweepHits = detectSweepSignature(relevant, liveLabelsByPr);
            const sweepVerdicts = classifySweepHits(sweepHits);

            const SWEEP_MARKER_PREFIX = '<!-- sweep-signature:';
            for (const v of sweepVerdicts) {
              const hit = sweepHits.find((h) => h.prNumber === v.prNumber);
              const marker = `${SWEEP_MARKER_PREFIX}${hit.armedAt} -->`;
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: v.prNumber, per_page: 100 }).catch(() => ({ data: [] }));
              if (comments.some((c) => c.body.includes(marker))) continue; // idempotent per (PR, armedAt)

              const shape = hit.signatureType === 'merge-equivalent'
                ? '`ready_for_review` → merged with no arm event in between (t/4131 -- an ARM-EQUIVALENT shape: what `gh pr ready` + `gh pr merge --auto` produces on an already-green PR)'
                : '`ready_for_review` → auto-merge/update armed';
              const verbedAt = hit.signatureType === 'merge-equivalent' ? 'merged at' : 'armed at';

              if (v.escalate) {
                const body = [
                  `🔺 **Sweep-signature ESCALATION (t/4096 item 2, t/3716 pattern)**`,
                  `${shape} within the sweep window. ${v.reason}.`,
                  `Ready at ${hit.readyAt}, ${verbedAt} ${hit.armedAt} by ${hit.actor}.`,
                  `@${owner} — escalated straight to DevOps + TL per design (held PR or multi-PR burst).`,
                  marker,
                ].join('\n');
                await github.rest.issues.createComment({ owner, repo, issue_number: v.prNumber, body });
                await github.rest.issues.addLabels({ owner, repo, issue_number: v.prNumber, labels: ['sweep-signature-alert'] }).catch(() => {});
              } else {
                const body = [
                  `**Sweep-signature check (t/4096 item 2, informational):**`,
                  `This PR went ready-for-review then ${hit.signatureType === 'merge-equivalent' ? 'merged' : 'had auto-merge/update armed'} ${hit.deltaSeconds.toFixed(0)}s later, by ${hit.actor}.`,
                  `This is usually just you moving fast — confirm it was your own action. No escalation; this fires once per ${hit.signatureType === 'merge-equivalent' ? 'merge' : 'arm'} event.`,
                  marker,
                ].join('\n');
                await github.rest.issues.createComment({ owner, repo, issue_number: v.prNumber, body });
              }
            }
            core.info(`Sweep signature: ${sweepHits.length} hit(s), ${sweepVerdicts.filter((v) => v.escalate).length} escalated`);
