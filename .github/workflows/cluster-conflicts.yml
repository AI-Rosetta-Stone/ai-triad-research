# ─── Cluster Conflicts ───
# What:  Computes conflict clusters, regenerates taxonomy embeddings, and builds
#        the conflict index. Commits results to the ai-triad-data repo.
# Before: Requires GEMINI_API_KEY and DATA_REPO_TOKEN secrets. Runs automatically
#         after Batch POV Summarization completes, weekly on Sunday, or manually.
# After:  Updated clusters, embeddings, and conflict index are committed to
#         ai-triad-data. The deployed app picks up changes on next poll cycle.

name: Cluster Conflicts

on:
  # Run after batch summarization completes (when new conflicts are generated)
  workflow_run:
    workflows: ["Batch POV Summarization"]
    types: [completed]

  # Weekly refresh (Sunday 3 AM UTC)
  schedule:
    - cron: '0 3 * * 0'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cluster:
    runs-on: ubuntu-latest
    # Only run on successful batch-summarize, or on schedule/manual
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: AI-Rosetta-Stone/ai-triad-data
          path: ai-triad-data
          token: ${{ secrets.DATA_REPO_TOKEN || secrets.GITHUB_TOKEN }}  # Scope: contents:write on AI-Rosetta-Stone/ai-triad-data (checkout + git push)

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install sentence-transformers scikit-learn numpy

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '22'

      - name: Check for GEMINI_API_KEY (visibility only -- t/4059)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY intentionally unset — conflict clusters use generic \"Cluster N\" labels by PI decision (t/4059#1). Do not add a key without revisiting that decision."
            echo "**GEMINI_API_KEY not set:** conflict clusters are labelled generically (\"Cluster N\") -- intentional, by PI decision (t/4059#1), not a misconfiguration." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute conflict clusters
        env:
          AI_TRIAD_DATA_ROOT: ${{ github.workspace }}/ai-triad-data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/compute-conflict-clusters.mjs

      - name: Regenerate embeddings (includes conflicts)
        env:
          AI_TRIAD_DATA_ROOT: ${{ github.workspace }}/ai-triad-data
        run: |
          python scripts/embed_taxonomy.py \
            --taxonomy-dir "$AI_TRIAD_DATA_ROOT/taxonomy/Origin" \
            generate

      - name: Build conflict index
        env:
          AI_TRIAD_DATA_ROOT: ${{ github.workspace }}/ai-triad-data
        run: node scripts/build-conflict-index.mjs

      - name: Commit cluster data
        working-directory: ai-triad-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conflicts/_conflict-clusters.json conflicts/_conflict-index.json taxonomy/Origin/embeddings.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh conflict clusters and embeddings"
            git push
          fi
