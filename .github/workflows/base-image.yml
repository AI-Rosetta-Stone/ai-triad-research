# ─── Base Image ───
# What:  Builds and pushes the shared Node.js base image to GHCR. Includes
#        Hadolint linting, Trivy security scanning, and SBOM generation.
# Before: Update deploy/azure/Dockerfile.base as needed. Runs automatically
#         weekly or on push to that file.
# After:  The new base image tag is available in GHCR. Update the taxonomy-editor
#         Dockerfile's FROM line if using a specific tag (not :latest).

name: Base Image

on:
  workflow_dispatch:
  schedule:
    # Rebuild WEEKLY (Sunday 00:00 UTC) so apt-get upgrade auto-retires trixie CVEs
    # within ~1 week of Debian shipping a fix, and the Trivy rescan uploads a fresh
    # SARIF that clears the corresponding code-scanning alerts — no human dismissals
    # (t/3520; auto-retirement for t/3513#2 cond. 3). Was monthly; weekly is the
    # responsiveness the no-fix residual policy needs. Cost negligible (public GHCR +
    # Actions minutes are free; base build ~6 min).
    - cron: '0 0 * * 0'
  pull_request:
    # t/220: verify Dockerfile.base changes early, before main, with in-image smoke tests
    paths:
      - 'deploy/azure/Dockerfile.base'
      - '.github/workflows/base-image.yml'
  push:
    branches: [main]  # t/4157: a feature branch touching this file must not publish :latest unreviewed
    paths:
      - 'deploy/azure/Dockerfile.base'

permissions:
  contents: read
  packages: write
  security-events: write  # For SARIF upload
  issues: write  # For failure alert (t/220)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-rosetta-stone/ai-triad-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      date_tag: ${{ steps.date_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: deploy/azure/Dockerfile.base
          failure-threshold: error

      - name: Verify digest-pinned FROM lines
        run: |
          UNPINNED=$(grep -E '^FROM\s' deploy/azure/Dockerfile.base | grep -v '@sha256:' || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Non-digest-pinned FROM lines found in deploy/azure/Dockerfile.base:"
            echo "$UNPINNED"
            echo "All base images must use the form: FROM image:tag@sha256:<digest>"
            exit 1
          fi
          echo "All FROM lines are digest-pinned."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      # Pre-pull buildkit with retry — see t/2065 (Docker Hub boot flake).
      - name: Pre-pull buildkit image with retry (t/2065)
        run: |
          for i in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then break; fi
            if [ "$i" -lt 3 ]; then
              echo "buildkit pull attempt $i failed; retry in $((i * 10))s"; sleep $((i * 10))
            else
              echo "buildkit pre-pull failed after $i attempts; setup-buildx will attempt its own pull"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date tag
        id: date_tag
        run: echo "tag=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: deploy/azure/Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name != 'pull_request' && format('{0}/{1}:latest,{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.date_tag.outputs.tag) || 'ai-triad-base:test' }}
          # CACHE_BUST invalidates the npm@latest + apt-get upgrade layers so security
          # upgrades genuinely re-run instead of restoring a stale cached layer (t/3137).
          # Date-tag granularity busts on the real rebuild cadence (weekly cron / new-day
          # dispatch); the in-image version tripwires catch any residual same-day no-op.
          build-args: |
            CACHE_BUST=${{ steps.date_tag.outputs.tag }}
          cache-from: type=gha,scope=shared-docker
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=shared-docker,mode=min' || '' }}
          platforms: linux/amd64

      - name: Smoke tests in loaded base image (t/220)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ai-triad-base:test /bin/bash -c '
            set -e
            echo "=== CA certificates ==="
            curl -fsSI https://github.com >/dev/null || { echo "✗ curl with CA bundle failed"; exit 1; }
            echo "✓ curl with CA bundle works"
            echo "=== Python SSL ==="
            python3 -c "import ssl, urllib.request; urllib.request.urlopen(\"https://pypi.org\", timeout=10)" || { echo "✗ Python SSL failed"; exit 1; }
            echo "✓ Python SSL works"
            echo "=== Node.js HTTPS ==="
            node -e "const https = require(\"https\"); https.get(\"https://nodejs.org\", () => process.exit(0)).on(\"error\", e => { console.error(e); process.exit(1); })" || { echo "✗ Node.js HTTPS failed"; exit 1; }
            echo "✓ Node.js HTTPS works"
            echo "=== npm ==="
            npm --version | grep -E "^[0-9]" || { echo "✗ npm version check failed"; exit 1; }
            echo "✓ npm works"
            echo "=== git ==="
            git ls-remote https://github.com/AI-Rosetta-Stone/ai-triad-data HEAD >/dev/null || { echo "✗ git ls-remote failed"; exit 1; }
            echo "✓ git works"
            echo "=== All smoke tests passed ==="
          '

      - name: Install Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date_tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        if: github.event_name != 'pull_request' && always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date_tag.outputs.tag }}
          format: spdx-json
          output-file: sbom-base.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-base
          path: sbom-base.spdx.json

      - name: Image size report
        if: success()
        run: docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Alert on build failure (t/220)
        if: failure() && github.event_name != 'pull_request'
        run: |
          # Ensure label exists
          gh label create base-image-build-alert --repo ${{ github.repository }} --description "Base image build failed" --color FF0000 2>/dev/null || true
          
          ISSUE_TITLE="base-image build failed ($(date -u +'%Y-%m-%d %H:%M')Z)"
          ISSUE_BODY="## Workflow Failure
          
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Event: ${{ github.event_name }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          ### Next steps
          - Check the run log for the failed step
          - Verify base-image dependencies (Debian, npm, git, Python)
          - Investigate Dockerfile.base or re-run"
          
          # Find existing open issue with this label
          ISSUE_NUM=$(gh issue list --repo ${{ github.repository }} --label base-image-build-alert --state open --json number -q ".[0].number" 2>/dev/null || echo "")
          
          if [ -z "$ISSUE_NUM" ]; then
            gh issue create --repo ${{ github.repository }} --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --label base-image-build-alert
          else
            gh issue comment $ISSUE_NUM --repo ${{ github.repository }} --body "## Workflow Failure (run ${{ github.run_id }})
            
            [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
