# ─── Base Image ───
# What:  Builds and pushes the shared Node.js base image to GHCR. Includes
#        Hadolint linting, Trivy security scanning, and SBOM generation.
# Before: Update deploy/azure/Dockerfile.base as needed. Runs automatically
#         weekly or on push to that file.
# After:  The new base image tag is available in GHCR. Update the taxonomy-editor
#         Dockerfile's FROM line if using a specific tag (not :latest).

name: Base Image

on:
  workflow_dispatch:
  schedule:
    # Rebuild WEEKLY (Sunday 00:00 UTC) so apt-get upgrade auto-retires trixie CVEs
    # within ~1 week of Debian shipping a fix, and the Trivy rescan uploads a fresh
    # SARIF that clears the corresponding code-scanning alerts — no human dismissals
    # (t/3520; auto-retirement for t/3513#2 cond. 3). Was monthly; weekly is the
    # responsiveness the no-fix residual policy needs. Cost negligible (public GHCR +
    # Actions minutes are free; base build ~6 min).
    - cron: '0 0 * * 0'
  push:
    paths:
      - 'deploy/azure/Dockerfile.base'

permissions:
  contents: read
  packages: write
  security-events: write  # For SARIF upload

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-rosetta-stone/ai-triad-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      date_tag: ${{ steps.date_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: deploy/azure/Dockerfile.base
          failure-threshold: error

      - name: Verify digest-pinned FROM lines
        run: |
          UNPINNED=$(grep -E '^FROM\s' deploy/azure/Dockerfile.base | grep -v '@sha256:' || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Non-digest-pinned FROM lines found in deploy/azure/Dockerfile.base:"
            echo "$UNPINNED"
            echo "All base images must use the form: FROM image:tag@sha256:<digest>"
            exit 1
          fi
          echo "All FROM lines are digest-pinned."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      # Pre-pull buildkit with retry — see t/2065 (Docker Hub boot flake).
      - name: Pre-pull buildkit image with retry (t/2065)
        run: |
          for i in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then break; fi
            if [ "$i" -lt 3 ]; then
              echo "buildkit pull attempt $i failed; retry in $((i * 10))s"; sleep $((i * 10))
            else
              echo "buildkit pre-pull failed after $i attempts; setup-buildx will attempt its own pull"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date tag
        id: date_tag
        run: echo "tag=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: deploy/azure/Dockerfile.base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date_tag.outputs.tag }}
          # CACHE_BUST invalidates the npm@latest + apt-get upgrade layers so security
          # upgrades genuinely re-run instead of restoring a stale cached layer (t/3137).
          # Date-tag granularity busts on the real rebuild cadence (weekly cron / new-day
          # dispatch); the in-image version tripwires catch any residual same-day no-op.
          build-args: |
            CACHE_BUST=${{ steps.date_tag.outputs.tag }}
          cache-from: type=gha,scope=shared-docker
          cache-to: type=gha,scope=shared-docker,mode=min
          platforms: linux/amd64

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1

      - name: Scan image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date_tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date_tag.outputs.tag }}
          format: spdx-json
          output-file: sbom-base.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-base
          path: sbom-base.spdx.json

      - name: Image size report
        if: success()
        run: docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
