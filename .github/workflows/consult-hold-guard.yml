# consult-hold-guard — dedicated required status context that BLOCKS a merge while a
# `consult-hold` label is present (t/3680). This is the ENFORCEMENT half of the consult/
# review-hold discipline: a hold recorded in a PR comment (the landed 89b26d41 practice) is
# ADVISORY and stops nothing. This makes the hold block at the merge button for every merge path
# SUBJECT TO BRANCH PROTECTION — human, agent, and GitHub's server-side auto-merge alike (t/3716;
# auto-merge honors required contexts by construction) — because the refusal is GitHub's, not an
# agent-side hook's. COVERAGE (SO e/219#2 risk 2, resolved by t/3736): with `enforce_admins: true`
# on `main` (t/3736, verified 2026-09-30), a required context binds ADMINS too — so once this guard
# is a required context, a red `consult-hold-guard` refuses EVERY merge path: human, agent, GitHub
# server-side auto-merge, AND an admin-token direct merge (`PUT /pulls/{n}/merge`). The SO's open
# question — does the t/3716 automation merge via auto-merge (honored) or admin-token (formerly
# bypassed) — no longer decides coverage; `enforce_admins` closes the bypass. Cond-1's end-to-end
# merge-refusal proof confirms this empirically (t/3680). The outage-escape (a sustained fail-closed
# API error blocks all merges) is now the PI `enforce_admins` toggle-off — shared by EVERY fail-closed
# required check (ci-gate/CodeQL/joint-gv-guard, and this one once promoted), documented once in
# deploy/azure/runbooks/enforce-admins-override.md rather than restated per-gate.
#
# WHY NOT A FEEDBACK RULE (t/3680#3): a PreToolUse feedback rule intercepts an AGENT'S tool
# call. The automation merges SERVER-SIDE through the GitHub API and never passes through
# anyone's shell, so a feedback-rule guard would stop only the compliant and be invisible to
# the thing that breaks holds. A required status check is the only mechanism that blocks a
# server-side merge. Precedent: joint-gv-guard, promoted to its own required context by t/3607.
#
# CRITICAL — MUST ALWAYS REPORT + MUST BE CLEARABLE WITHOUT A PUSH. The `types` list must cover
# EVERY event that changes the gated condition (the label):
#   • opened/synchronize/reopened — a PR against main always gets a result.
#   • labeled/unlabeled          — LOAD-BEARING: without `unlabeled`, removing the label would
#     never re-run the check and the PR would stay RED forever (t/3680 AC2). A guard you can
#     apply but not clear is worse than none.
#   • edited                     — base-retarget. A PR opened against a feature branch does not
#     run here until its base becomes `main`; retargeting fires `edited`, so the context appears
#     and reports. Without it, a retargeted PR would have NO check → permanently blocked once
#     this is required (the joint-gv-guard never-reports / Arm-E class, t/3607).
# The job SELF-GATES: SUCCESS when `consult-hold` is absent; FAILURE only when it is present.
# Fail-CLOSED on an API/parse error (retry 3x → red with a legible infra message), because once
# this is a REQUIRED context a transient error must not silently open the gate.
name: consult-hold-guard

on:
  pull_request:
    branches: [main]
    # lint:gated-events: opened,synchronize,reopened,labeled,unlabeled,edited
    # ^ machine-readable (t/3646): every event that can change the consult-hold label this guard
    #   evaluates. workflow-lint asserts pull_request.types ⊇ this set. labeled/unlabeled are
    #   load-bearing for clear-without-a-push (t/3680 AC2); edited covers base-retarget.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

# The job id below (consult-hold-guard) is the check-run name GitHub reports — the exact string
# to add to branch protection as a required status context (Jeffrey does that wiring; agents are
# classifier-blocked from branch-protection changes — t/3680 Constraint A).
# STATUS-INDEPENDENT (SO e/219#4): this workflow only COMPUTES and REPORTS the verdict. Whether the
# context is REQUIRED (i.e. actually blocks a merge) is configured in BRANCH PROTECTION, not here —
# branch protection is the single source of truth for enforcement. This comment deliberately makes
# no claim about the current required/not-required state, so it cannot go stale at the flip (the
# flip is a settings change with no repo edit to prompt a comment update).
jobs:
  consult-hold-guard:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Refuse merge while a consult-hold label is present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Make fail-closed EXPLICIT (mirror joint-gv-guard): GitHub's default run shell is
          # `bash -eo pipefail`, so a malformed-but-200 API response makes jq error and reds the
          # job. That is the behaviour we want for a required gate, but it rests on an implicit
          # flag — state it in-script so a future `shell:` override can't silently flip it to
          # fail-OPEN (report success on garbage — the Arm-E class).
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # BEGIN guard-pr-read (t/369)
          # CANONICAL COPY: operations/devops/guard-pr-read.sh. consult-hold-guard.yml and joint-gv-guard.yml
          # inline this block (they have no checkout); operations/devops/guard-pr-read.test.mjs fails if a
          # copy drifts. Reads the PR over REST (core pool), not `gh pr view` (GraphQL pool, exhausted at
          # 14:11Z on 2026-11-11, t/318#8).
          #   guard_read_pr <guard> <owner/repo> <pr-number> <what-a-real-block-is>
          # On success sets PR_JSON to the pulls payload. On failure prints one ::error:: line and exits 1
          # (fail closed: required gate). The failure classes have different remedies, so each is named:
          #   - primary quota at 0: INFRA rate-limit line + step outputs infra/resets, at once. Never sleeps
          #     to the reset (up to an hour); DevOps & Release's ci-infra-rerun (#4967) re-runs once after it.
          #   - secondary limit (retry-after, any 429, or the "secondary rate limit" / "abuse detection"
          #     body): waits retry-after (or 60s if absent, per GitHub's docs), capped at 90s;
          #     longer, or still limited on attempt 3, it is the same INFRA line with pool=secondary.
          #   - 5xx / no response: retried with 3/6/9s backoff.
          #   - any other 4xx (token, permission, not found): fails at once; a re-run will not fix it.
          # Header value, or empty. `|| true`: the callers run under set -euo pipefail, and an absent header
          # (grep finds nothing) must read as empty, not end the step.
          _guard_hdr() { { tr -d '\r' <"$1" | sed '/^$/q' | grep -i "^$2:" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//'; } || true; }
          _guard_infra_ratelimit() {
            local resets pool="${1:-core}"
            resets=$(date -u -d "@$2" +%Y-%m-%dT%H:%M:%SZ)
            echo "infra=rate-limit" >>"${GITHUB_OUTPUT:-/dev/null}"
            echo "resets=${resets}" >>"${GITHUB_OUTPUT:-/dev/null}"
            echo "::error::INFRA rate-limit: GitHub API quota exhausted (pool=${pool}), resets=${resets}; not a policy verdict, re-run after the reset"
            exit 1
          }
          guard_read_pr() {
            local guard="$1" repo="$2" pr="$3" what="$4"
            local out="${RUNNER_TEMP:-/tmp}/${guard}.resp" errf="${RUNNER_TEMP:-/tmp}/${guard}.err"
            local attempt status remaining reset retry_after wait last_err=""
            PR_JSON=""
            for attempt in 1 2 3; do
              if gh api -i "repos/${repo}/pulls/${pr}" >"$out" 2>"$errf"; then
                PR_JSON=$(tr -d '\r' <"$out" | sed '1,/^$/d')
                return 0
              fi
              last_err=$(head -c 400 "$errf" 2>/dev/null | tr '\n' ' ')
              status=$(tr -d '\r' <"$out" | sed -n '1s/^HTTP\/[0-9.]* \([0-9][0-9]*\).*/\1/p')
              if [ "$status" = 403 ] || [ "$status" = 429 ]; then
                remaining=$(_guard_hdr "$out" x-ratelimit-remaining)
                reset=$(_guard_hdr "$out" x-ratelimit-reset)
                if [ "$remaining" = 0 ] && [[ "$reset" =~ ^[0-9]+$ ]]; then
                  _guard_infra_ratelimit "$(_guard_hdr "$out" x-ratelimit-resource | tr -cd 'a-z_')" "$reset"
                fi
                retry_after=$(_guard_hdr "$out" retry-after)
                # Secondary: retry-after, a 429 (always a rate limit), or GitHub's body text, old or new.
                if [ -n "$retry_after" ] || [ "$status" = 429 ] || grep -qiE 'secondary rate limit|abuse detection' "$out"; then
                  wait=60
                  if [[ "$retry_after" =~ ^[0-9]+$ ]]; then wait=$retry_after; fi
                  if [ "$wait" -gt 90 ] || [ "$attempt" -eq 3 ]; then
                    _guard_infra_ratelimit secondary "$(( $(date +%s) + wait ))"
                  fi
                  echo "::warning::${guard}: secondary rate limit on attempt ${attempt}/3 (HTTP ${status}) — retrying in ${wait}s"
                  sleep "$wait"
                  continue
                fi
              fi
              if [ -n "$status" ] && [ "$status" -lt 500 ]; then
                echo "::error::${guard}: could NOT read the PR (HTTP ${status}) — API failure, NOT ${what}. Last error: ${last_err}. A token/permission error will NOT recover on re-run: fix the workflow. (Failing closed — required gate.)"
                exit 1
              fi
              echo "::warning::${guard}: PR read attempt ${attempt}/3 failed (HTTP ${status:-none}) — ${last_err} — retrying in $((attempt * 3))s"
              sleep $((attempt * 3))
            done
            echo "::error::${guard}: could NOT read the PR after 3 attempts — API/INFRA failure, NOT ${what}. Last error: ${last_err}. A transient 5xx -> re-run this job. (Failing closed — required gate.)"
            exit 1
          }
          # END guard-pr-read
          guard_read_pr consult-hold-guard "$REPO" "$PR_NUMBER" "a hold"

          # Shape assertion (complement to set -euo pipefail, not a substitute): a malformed-but-200
          # payload ({}, partial JSON) makes the jq below fail. set -e already reds the job, but the
          # only diagnostic would be jq's raw error on a step whose other legible errors name a hold
          # / API failure — a third indistinguishable red. Name this cause explicitly.
          if ! echo "$PR_JSON" | jq -e 'has("labels")' >/dev/null 2>&1; then
            echo "::error::consult-hold-guard: PR labels read succeeded but the payload is MALFORMED (missing labels) — NOT a hold, NOT API-unreachable. Re-run; if it persists the REST pulls contract changed. (Failing closed — required gate.)"
            exit 1
          fi

          HAS_HOLD=$(echo "$PR_JSON" | jq -r '[.labels[].name] | contains(["consult-hold"]) | tostring')
          echo "consult-hold label present: $HAS_HOLD"

          if [ "$HAS_HOLD" = "true" ]; then
            echo "::error::consult-hold-guard: this PR carries the 'consult-hold' label — a mandatory consult/review hold is OUTSTANDING, so merge is blocked (required gate; blocks human, agent, and server-side auto-merge alike). The outstanding conditions and who can clear them are in this PR's HOLD comment (the landed hold-comment practice, 89b26d41) — read it there. TO CLEAR: resolve the conditions, then REMOVE the 'consult-hold' label; this check re-runs on unlabel and goes green with NO push. EMERGENCY OVERRIDE: a branch-protection admin override (there is NO feedback rule to disable — t/3680#3)."
            exit 1
          fi
          echo "guard OK — no consult-hold label present; reporting success."

      # t/314 (t/313 observability): CANONICAL COPY of this step lives in
      # operations/devops/rate-limit-snapshot-step.yml; operations/devops/rate-limit-snapshot-step.test.mjs
      # fails if a guard's copy drifts. Some guards have no checkout, so the step is inline.
      # Records the repo-wide GITHUB_TOKEN installation quota (REST core + GraphQL) as it stands at
      # the end of this job: a snapshot of the shared pool, not this job's own usage, and App tokens
      # are not in it. GET /rate_limit does not count against the PRIMARY limit but can count against
      # the secondary one (GitHub REST rate-limits doc). Never fails the job; timeout-minutes bounds a
      # hung call, since continue-on-error does not (Second-Opinion, #5029).
      - name: Rate-limit snapshot (t/314)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Comma-joined, read with IFS=, (not whitespace), so an empty field can't shift the
          # later values; each value must be a number on its own (Quality, #5028 review).
          allnum() { for v in "$@"; do [[ "$v" =~ ^[0-9]+$ ]] || return 1; done; }
          if out=$(gh api rate_limit --jq '[.resources.core.used, .resources.core.remaining, .resources.core.limit, .resources.core.reset, .resources.graphql.used, .resources.graphql.remaining, .resources.graphql.limit] | map(tostring) | join(",")' 2>&1) \
            && IFS=, read -r cu cr cl creset gu gr gl extra <<<"$out" && [ -z "$extra" ] && allnum "$cu" "$cr" "$cl" "$creset" "$gu" "$gr" "$gl"; then
            reset=$(date -u -d "@$creset" +%H:%M:%SZ 2>/dev/null || echo "$creset")
            echo "t/314 rate-limit: workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB core used=$cu remaining=$cr limit=$cl reset=$reset graphql used=$gu remaining=$gr limit=$gl"
            {
              echo "### GITHUB_TOKEN rate limit at end of job (t/314)"
              echo ""
              echo "| API | used | remaining | limit |"
              echo "|---|---|---|---|"
              echo "| REST core | $cu | $cr | $cl |"
              echo "| GraphQL | $gu | $gr | $gl |"
              echo ""
              echo "REST core window resets at $reset."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::t/314: could not read GET /rate_limit, so no rate-limit snapshot for this job (${out:-no output})."
          fi
