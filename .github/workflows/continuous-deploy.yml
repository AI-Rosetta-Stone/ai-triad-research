# ─── Continuous Deploy (log-only) ───
# What:  On every green `ci.yml` run on `main`, computes and LOGS what a continuous-deploy
#        dispatch would do -- kill switch, deployable-path check, infra hold (including
#        tier-paths.json's gate/credential-handling infra), commit-PR association,
#        ci-gate/CodeQL greenness, CL run-window hold, and the 2h batching window (t/4414,
#        t/4091 Decision D). Decision logic lives in
#        operations/devops/Get-ContinuousDeployVerdict.ps1 (Pester-tested, pure predicate).
# Why:   TL ruling (t/4414, p/331#2341): build the log-only version now as T1 (Quality
#        reviews) to prove the decision logic on real `main` traffic before the real-dispatch
#        PR -- which IS the T2 that re-asks the Second Opinion with this evidence.
# History: t/4091 Decision D was independently approved twice -- t/4285 (10-19, PI) shipped
#        `auto-deploy-advisory.yml` first; this workflow (t/4414, 10-21, a separate/later PI
#        go-ahead the TL didn't realize duplicated t/4285) shipped second. Both ran in parallel
#        until the TL's reconciliation (e/358#2, p/344#374): keep this one, port t/4285's two
#        stronger gates (commit-PR association, ci-gate+CodeQL check-run greenness) in below,
#        then retire auto-deploy-advisory.yml in the same PR. t/4285 closes when that PR merges.
# NO DISPATCH: this workflow never calls `gh workflow run deploy-azure.yml` or anything else
#        that changes state. It only reads facts and writes a step-summary line. The real
#        dispatch step is deliberately NOT wired here -- that is the scope of the follow-up T2.
# Facts:
#   - Kill switch:     repo variable `CONTINUOUS_DEPLOY` ('on' enables; anything else, including
#                       unset, fails safe to off -- TL-endorsed, t/4414#1/#3).
#   - CL run-window:   repo variable `CL_RUN_WINDOW_UNTIL` (ISO 8601 timestamp, optional). Unset
#                       means no window is declared. TL ruling: "Add it to the CL's AGENTS.md in
#                       the rule update" -- a repo variable (not a committed file) so the CL can
#                       set/clear it without a PR, same mechanism as the kill switch.
#   - Last deployed:   prod's own `/health` endpoint's `buildSha` (TL ruling, p/331#2350 -- ported
#                       from t/4285 condition 2; t/4273 showed the known-good tag can silently
#                       fail to apply, so the tag is NOT authoritative). The timestamp for the
#                       batching window comes from the `deploy-azure.yml` run matching that SHA
#                       (if no matching run is found, that's hold-batch-timestamp-unknown -- TL
#                       ruling p/331#2352: an unknown timestamp never satisfies the batch floor).
#   - Deployable path: reuses ci.yml's own soundness-reviewed path-filter definitions
#                       (container / bicep-env / bicep-resources), re-run here via dorny/paths-filter
#                       against this specific green commit -- no new path-filter logic invented.
#   - Tier infra:      ported from t/4285 condition 3 (TL ruling p/331#2350) -- diffs changed paths
#                       since the last deployed SHA against `.github/ci/tier-paths.json`'s
#                       r1Paths/r1Globs (the tier-check gate's own infra list: branch-protection,
#                       CODEOWNERS, consult-hold-guard.yml, Move-PiCredential*.ps1, etc.) -- a
#                       superset of what the bicep-env/bicep-resources path filters above cover.
#   - PR association:  ported from t/4285 (TL ruling p/331#2106, e/358#2) -- every commit since
#                       the last deployed SHA must come from a merged PR. joint-gv-guard and
#                       consult-hold-guard only trigger on pull_request and structurally never
#                       run again on a push-triggered main commit, so a commit with no PR
#                       association skipped those gates entirely.
#   - ci-gate/CodeQL:  ported from t/4285 -- "green" means ci-gate check-run SUCCESS, plus CodeQL
#                       SUCCESS *if present* (it's path-filtered, so legitimately absent on e.g. a
#                       Bicep-only commit -- absent is fine, present-and-failed/pending is not).
#   - Batch window:    2h (120 min), not t/4414's original 20 min -- t/4285 condition 5 overrides
#                       it for now (TL ruling, p/331#2350): each deploy restarts prod, tune with
#                       real data once this has run a while.
# Gate-signal integrity (TL ruling, e/358#2): a log-only workflow that fails on every run proves
#        nothing and must not fail silently -- every run since this workflow first shipped failed
#        on a paths-filter bug (fixed in #3761) with no alert raised. The failure/success steps
#        below open or auto-close a tracking issue so a dead gate here is never silent again.

name: Continuous Deploy (log-only)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write  # gate-signal-integrity failure alert (open/auto-close)

jobs:
  evaluate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # full history -- commit-PR-association needs `git log <lastDeployedSha>..<headSha>`

      # t/4414 follow-up: #3761's "use HEAD^ instead of the literal '<sha>^' string" fix was
      # incomplete. dorny always runs its own `git fetch origin <base> <currentBranch>
      # --depth=<initial-fetch-depth>` regardless of local history (confirmed in its action.yml --
      # there is no "skip fetch if already local" path), passing whatever `base:` string we give it
      # STRAIGHT THROUGH as a refspec. "HEAD^" is exactly as invalid a refspec for `git fetch` as
      # the original "<sha>^" was -- every run since this workflow shipped has failed on this same
      # class of error (confirmed: 50/50 runs, all `git fetch ... origin HEAD^ main` exit 128),
      # which means the t/4414 log-only observation window has produced NO usable verdict data this
      # entire time. Resolve the parent to a literal SHA locally first (fetch-depth: 0 above
      # guarantees it's already present, so this never fetches) and hand dorny that SHA instead --
      # confirmed working: `git fetch --no-tags --depth=100 origin <sha> main` exits 0.
      - name: Resolve parent SHA for dorny (t/4414)
        id: parent
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      # Mirrors ci.yml's 'container' / 'bicep-env' / 'bicep-resources' filters exactly (t/2094 /
      # t/2631 / t/3212 soundness lists) -- kept in sync with ci.yml by hand; a mismatch here only
      # affects a LOGGED verdict, never a real dispatch, so the blast radius of drift is zero.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # A literal resolved SHA, not "HEAD^" syntax -- see the comment on the step above.
          # ref defaults to HEAD, which checkout already set.
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            container:
              - 'taxonomy-editor/**'
              - 'research/comp-linguist/scripts/**'
              - '.dockerignore'
              - 'lib/**'
              - 'scripts/**'
              - 'taxonomy/schemas/**'
              - 'ai-models.json'
              - 'ai-usages.json'
              - '.aitriad.json'
              - 'CHANGELOG.md'
              - 'deploy/azure/Dockerfile.base'
              - 'deploy/azure/smoke-healthz.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            bicep-env:
              - 'deploy/azure/main.bicep'
              - '.github/workflows/deploy-azure.yml'
              - 'operations/devops/Get-BicepBaseEnv.ps1'
              - 'operations/devops/Test-BicepEnvDrift.ps1'
              - '.github/workflows/ci.yml'
            bicep-resources:
              - 'deploy/azure/main.bicep'
              - 'operations/devops/Test-BicepAcaResourcePairs.ps1'
              - '.github/workflows/ci.yml'

      - name: Gather facts and compute the verdict (log-only, no dispatch)
        id: verdict
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KILL_SWITCH: ${{ vars.CONTINUOUS_DEPLOY }}
          CL_WINDOW_UNTIL_RAW: ${{ vars.CL_RUN_WINDOW_UNTIL }}
          TOUCHES_CONTAINER: ${{ steps.filter.outputs.container }}
          TOUCHES_BICEP_ENV: ${{ steps.filter.outputs.bicep-env }}
          TOUCHES_BICEP_RESOURCES: ${{ steps.filter.outputs.bicep-resources }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          PROD_HEALTH_URL: https://taxonomy-editor.yellowbush-aeda037d.eastus.azurecontainerapps.io/health
        run: |
          . ./operations/devops/Get-ContinuousDeployVerdict.ps1
          . ./operations/devops/ConvertFrom-CheckRunsResponse.ps1

          $clWindowUntil = $null
          if (-not [string]::IsNullOrWhiteSpace($env:CL_WINDOW_UNTIL_RAW)) {
            $clWindowUntil = [datetime]$env:CL_WINDOW_UNTIL_RAW
          }

          # ── Last deployed SHA, from prod's own /health (TL ruling p/331#2350, ported from
          #    t/4285 condition 2 -- the known-good tag can silently fail to apply, t/4273).
          #    Unreadable or missing buildSha fails CLOSED (TL ruling p/331#2352) -- same as the
          #    retired advisory's "treating as UNREADABLE, not as a deploy signal", never read as
          #    "nothing deployed yet, go ahead". ──
          $lastDeployedSha = $null
          $lastDeployedShaUnknown = $false
          try {
            $health = Invoke-RestMethod -Uri $env:PROD_HEALTH_URL -TimeoutSec 15
            if ([string]::IsNullOrWhiteSpace($health.buildSha)) {
              Write-Warning "prod's /health returned no buildSha -- hold-last-deployed-unknown."
              $lastDeployedShaUnknown = $true
            } else {
              $lastDeployedSha = $health.buildSha
            }
          } catch {
            Write-Warning "Cannot read prod's /health buildSha -- hold-last-deployed-unknown. $_"
            $lastDeployedShaUnknown = $true
          }

          # Timestamp for the batch window: the deploy-azure.yml run matching that SHA (the
          # actual production deploy history) -- /health gives the authoritative SHA, this gives
          # its authoritative "when". No match fails CLOSED (TL ruling p/331#2352): an unknown
          # timestamp must never be read as "the batch floor is satisfied".
          $lastDispatchAt = $null
          $batchTimestampUnknown = $false
          if ($lastDeployedSha) {
            $lastRunJson = gh run list --workflow deploy-azure.yml --status success --limit 20 --json createdAt,headSha
            $lastRuns = @($lastRunJson | ConvertFrom-Json | Where-Object { $_.headSha -eq $lastDeployedSha })
            if ($lastRuns.Count -gt 0) {
              $lastDispatchAt = [datetime]($lastRuns | Sort-Object createdAt -Descending | Select-Object -First 1).createdAt
            } else {
              Write-Warning "No deploy-azure.yml run found matching prod's /health buildSha ($lastDeployedSha) -- hold-batch-timestamp-unknown."
              $batchTimestampUnknown = $true
            }
          }

          # ── Tier infra (t/4285 condition 3 ported) -- diff changed paths against
          #    .github/ci/tier-paths.json's r1Paths/r1Globs, a superset of the bicep-env/
          #    bicep-resources path filters above (branch-protection, CODEOWNERS,
          #    consult-hold-guard.yml, Move-PiCredential*.ps1, etc.). Skipped entirely when
          #    $lastDeployedSha is unknown -- hold-last-deployed-unknown already holds before
          #    this value is ever consulted by the predicate. ──
          $touchesTierInfraPaths = $false
          if ($lastDeployedSha -and $lastDeployedSha -ne $env:SHA) {
            $changedPaths = @(git diff --name-only "$lastDeployedSha..$($env:SHA)" 2>&1)
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "git diff failed between $lastDeployedSha and $($env:SHA) -- treating tier-infra touch as unknown (fails toward true/hold, never toward a false dispatch). $changedPaths"
              $touchesTierInfraPaths = $true
            } else {
              $tierPaths = Get-Content '.github/ci/tier-paths.json' -Raw | ConvertFrom-Json
              $infraPaths = @($tierPaths.r1Paths) + @($tierPaths.r1Globs)
              foreach ($changed in $changedPaths) {
                foreach ($infra in $infraPaths) {
                  $isMatch = if ($infra -match '\*') { $changed -like $infra } else { $changed -eq $infra }
                  if ($isMatch) { $touchesTierInfraPaths = $true; break }
                }
                if ($touchesTierInfraPaths) { break }
              }
            }
          }

          # ── Commit-PR association (t/4285 ported). A failed `git log` fails CLOSED (TL ruling
          #    p/331#2352) -- never read as "no commits to check", which would silently skip the
          #    PR-association check entirely. Skipped entirely when $lastDeployedSha is unknown,
          #    same reasoning as the tier-infra check above. ──
          $commitsWithoutMergedPR = @()
          $commitLogUnknown = $false
          if ($lastDeployedSha -and $lastDeployedSha -ne $env:SHA) {
            $commitShas = @(git log --format='%H' "$lastDeployedSha..$($env:SHA)" 2>&1)
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "git log failed between $lastDeployedSha and $($env:SHA) -- hold-pr-association-unknown. $commitShas"
              $commitLogUnknown = $true
            } else {
              foreach ($sha in $commitShas) {
                $pullsJson = gh api "repos/$($env:REPO)/commits/$sha/pulls" 2>&1
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "gh api commits/.../pulls failed for $sha -- treating as NOT PR-associated (fails toward a hold, never toward dispatch). $pullsJson"
                  $commitsWithoutMergedPR += $sha
                  continue
                }
                $pulls = @($pullsJson | ConvertFrom-Json)
                $hasMergedPR = @($pulls | Where-Object { $null -ne $_.merged_at }).Count -gt 0
                if (-not $hasMergedPR) { $commitsWithoutMergedPR += $sha }
              }
            }
          }

          # ── ci-gate / CodeQL check-run conclusions (t/4285 ported) ──
          # t/3912 (issue #3822): `gh api ... --paginate` on this endpoint concatenates each
          # page's whole `{total_count, check_runs:[...]}` object one after another, which is
          # multiple JSON documents, not one -- piping the raw text to a single `ConvertFrom-Json`
          # throws "Conversion from JSON failed with error: Additional text encountered" the
          # moment a commit has more than one page of check-runs. `--jq '.check_runs[]'` makes gh
          # emit one check-run object per line across every page instead, which parses cleanly.
          $checkRunsJson = gh api "repos/$($env:REPO)/commits/$($env:SHA)/check-runs" --paginate --jq '.check_runs[]' 2>&1
          $ciGateConclusion = 'missing'
          $codeQlConclusion = $null
          if ($LASTEXITCODE -eq 0) {
            $checkRunsList = @($checkRunsJson | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json })
            $liveByName = ConvertFrom-CheckRunsResponse -CheckRunsResponse ([pscustomobject]@{ check_runs = $checkRunsList })
            if ($liveByName.ContainsKey('ci-gate')) { $ciGateConclusion = $liveByName['ci-gate'].Conclusion }
            if ($liveByName.ContainsKey('CodeQL')) { $codeQlConclusion = $liveByName['CodeQL'].Conclusion }
          } else {
            Write-Warning "gh api commits/.../check-runs failed for $($env:SHA) -- treating ci-gate as 'missing' (fails toward a hold). $checkRunsJson"
          }

          $v = Get-ContinuousDeployVerdict `
            -KillSwitch $env:KILL_SWITCH `
            -ClWindowUntil $clWindowUntil `
            -Now (Get-Date).ToUniversalTime() `
            -LastDispatchAt $lastDispatchAt `
            -BatchMinutes 120 `
            -TouchesContainer ($env:TOUCHES_CONTAINER -eq 'true') `
            -TouchesBicepEnv ($env:TOUCHES_BICEP_ENV -eq 'true') `
            -TouchesBicepResources ($env:TOUCHES_BICEP_RESOURCES -eq 'true') `
            -TouchesTierInfraPaths $touchesTierInfraPaths `
            -LastDeployedShaUnknown $lastDeployedShaUnknown `
            -CommitLogUnknown $commitLogUnknown `
            -BatchTimestampUnknown $batchTimestampUnknown `
            -CommitsWithoutMergedPR $commitsWithoutMergedPR `
            -CiGateConclusion $ciGateConclusion `
            -CodeQlConclusion $codeQlConclusion `
            -Sha $env:SHA

          Write-Host "Continuous deploy verdict: $($v.Action) -- $($v.Reason) (sha=$($v.Sha))"

          @"
          ## Continuous Deploy Verdict (log-only, t/4414)

          | Field | Value |
          |---|---|
          | SHA | ``$($v.Sha)`` |
          | Action | **$($v.Action)** |
          | Reason | $($v.Reason) |

          _No dispatch wired -- this workflow only logs what it would do (t/4414 log-only phase)._
          "@ >> $env:GITHUB_STEP_SUMMARY

      # ── Gate-signal integrity (TL ruling, e/358#2): a dead gate here must never be silent ──
      # e/349#4 (SO, t/4414): the original version of this step opened issue #3771 on the very
      # first failure (2026-10-23), then correctly did nothing on every one of the 49 failing runs
      # after it (by design -- "don't spam a duplicate issue"). But with no ping and no label this
      # hourly r/23 bridge (Get-CiAlertEscalations.ps1) watches, that single issue just sat open and
      # unseen for two days -- "opened an issue" isn't the same as "someone saw it". Labelling it
      # `alert-escalated` puts it in front of the SAME bridge every other CI alert already goes
      # through, and stripping `owner-acked` each time it's still open re-surfaces an
      # already-triaged-but-still-broken gate instead of letting one old ack suppress it forever.
      - name: On failure, open (or leave open) a tracking issue
        if: failure()
        run: |
          EXISTING=$(gh issue list --label "continuous-deploy-dead-gate" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "continuous-deploy.yml is failing (t/4414 log-only gate dead)" \
              --label "continuous-deploy-dead-gate" \
              --label "alert-escalated" \
              --body "This workflow has stopped producing verdicts. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. A log-only gate that fails silently proves nothing about the staging-proof window it's meant to be collecting (t/4414). Fix and this issue auto-closes on the next successful run."
          else
            gh issue edit "$EXISTING" --remove-label "owner-acked" --add-label "alert-escalated" 2>/dev/null || true
            gh issue comment "$EXISTING" --body "Still failing: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: On success, auto-close any open dead-gate issue
        if: success()
        run: |
          EXISTING=$(gh issue list --label "continuous-deploy-dead-gate" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "continuous-deploy.yml produced a verdict successfully again (sha ${{ github.event.workflow_run.head_sha }}). Auto-closing."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
