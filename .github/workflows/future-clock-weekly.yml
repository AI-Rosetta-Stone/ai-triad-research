name: future-clock-weekly
# Q3b prevention from t/4268/t/4279: a fixture dated 2026-07-20 aged past a 90-day
# re-eligibility window on 2026-10-18. After that, test-electron failed every run and
# ci-gate blocked every PR. Nothing caught it before the date passed -- the first signal
# was a scheduled run that looked like one more flake (Class 3, runtime/environment
# divergence -- docs/CodeReview/failure-classes.md).
#
# Runs the taxonomy-editor vitest suite twice -- once at the real clock (baseline), once
# with every test's clock shifted +365 days (via future-clock-setup.ts, which is a no-op
# unless FUTURE_CLOCK_OFFSET_DAYS is set) -- and reports ONLY the NEW failures, diffed
# against the same run's own baseline so a test already broken for an unrelated reason is
# not noise here. This gives about a year's warning before any date-dependent fixture
# expires. Warn-only: NEVER in ci-gate's needs, never fails the job itself.
on:
  schedule:
    - cron: '41 8 * * 1'  # Mondays 08:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-clock-check:
    runs-on: ubuntu-latest
    # t/4587-adjacent finding: the only schedule-triggered run ever (2026-10-26) hung on the
    # future-clock vitest leg and was killed at the 6h job default, never producing a diff.
    # Bound the job so a hang surfaces as a fast, legible timeout instead of silently eating
    # the full default window every week.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true
        with:
          repository: AI-Rosetta-Stone/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '11.20.0'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Real-clock baseline run
        # continue-on-error: this run's OWN pass/fail doesn't matter -- only the diff against
        # the future-clock run does. A crash/OOM here still lets the future leg run, and the
        # diff script's readJsonOrNull treats a missing report as a WARN, not a clean pass.
        working-directory: taxonomy-editor
        continue-on-error: true
        run: pnpm exec vitest run --reporter=json --outputFile=../future-clock-baseline.json

      - name: Future-clock (+365d) run
        working-directory: taxonomy-editor
        continue-on-error: true
        env:
          FUTURE_CLOCK_OFFSET_DAYS: '365'
        run: pnpm exec vitest run --reporter=json --outputFile=../future-clock-future.json

      - name: Diff and report (never fails the job -- warn-only, t/4279)
        run: node operations/devops/future-clock-diff.mjs future-clock-baseline.json future-clock-future.json operations/devops/future-clock-known-harness-artifacts.json
