packages:
  - taxonomy-editor
  - lib
  - lib/debate
  - poviewer
  - summary-viewer
  - workflow-app

overrides:
  axios: ">=1.20.0 <2"
  brace-expansion: ">=5.0.12 <6"
  sharp: ">=0.35.5 <0.36"
  fast-xml-parser: ">=5.10.1"
  ip-address: ">=10.3.1"
  uuid: ">=11.1.1"
  "@opentelemetry/core": ">=2.8.0"
  js-yaml: ">=5.4.1 <6"
  image-size: ">=2.0.3 <3"
  # Security bump (t/4504 incident, Dependabot #437/#449, Trivy container gate blocking the
  # urgent incident fix image). Arrives transitively via @azure/identity@4.14.0 (direct dep
  # plus azurite-devDependency path). CLOSES the HIGH "MSAL Node authorization code flow may
  # disclose parameters to an attacker-controlled endpoint" advisory (CVE-2026-109461),
  # fixed in 7.1.0. Capped to the 7.x line per the convergence rule above.
  "@azure/msal-node": ">=7.1.0 <8"
  # adm-zip pinned >=0.6.1 — CLOSES two HIGH uncontrolled-memory-allocation DoS advisories on the 0.6.x
  # line. The original >=0.6.0 pin closed the first DoS (Dependabot #303/#307, range <0.6.0, fixed in
  # 0.6.0) and stops the graph regressing to 0.5.18 (onnxruntime-node 1.24.3), the t/3442 round-2 hit.
  # Trivy CVE-2026-77301 (alert #5827) is a SECOND HIGH DoS affecting 0.6.0 itself, fixed in 0.6.1
  # (t/3514) — the bump to >=0.6.1 closes it. It does NOT mitigate the separate symlink-follow MEDIUM
  # (Trivy CVE-2026-76845 / alert #5788, affects <=0.6.1, no patch exists) — that advisory stays
  # accepted as non-reachable per t/3442 (adm-zip is onnxruntime-node postinstall-only, zero
  # first-party/runtime use). Keep this pin. Comment lines here must stay colon-space-free
  # (check-lockfile-overrides.mjs is a line parser, t/3440).
  adm-zip: ">=0.6.1"
  # Security bumps (t/3283, Dependabot #338-341/#336/#326). Capped to the patched line, NOT
  # bare ">=", so (a) the fix stays minimal-blast-radius — fast-uri <4 avoids a major-version
  # jump, @xmldom <0.9 stays in the 0.8 line — and (b) the root and standalone lockfiles
  # converge on the SAME version (a bare ">=" let the standalone lockfile the prod image uses
  # resolve fast-uri@4.1.4 / @xmldom@0.9.12 while root resolved 3.1.7 / 0.8.15 — prod would
  # then run code CI never verified). Relax a cap only with a deliberate major/minor upgrade.
  fast-uri: ">=3.1.8 <4"
  "@xmldom/xmldom": ">=0.8.15 <0.9"
  browserslist: ">=4.28.7"
  # Security bumps (t/3440 root + t/3441 taxonomy-editor, Dependabot #350/#346-348 + #351/#349/#343/#342).
  # Transitive deps — sharp arrives via @huggingface/transformers, hono via @hono/node-server plus
  # @modelcontextprotocol/sdk. A direct `pnpm update` bumped only the direct edge and left transitive
  # copies vulnerable (t/3440 reopen) — overrides force EVERY instance. Capped to the patched line per
  # the convergence rule above. sharp raised in place again at t/4057 (was >=0.35.4, which 0.35.4
  # itself satisfied but left in the live image) — >=0.35.5 CLOSES GHSA-wq5f-xc86-pv6w (HIGH), found
  # live in the deployed digest via code-scanning alert #5988 plus Dependabot #421/#423. morgan
  # and joi are no-ops on the root lockfile (already patched via #2137) but are the floor the standalone
  # sync (sync-standalone-lockfile.mjs copies THIS block) needs for taxonomy-editor (t/3441).
  # NB — comment lines here must avoid a colon-then-space sequence; check-lockfile-overrides.mjs is
  # line-based and mis-reads any such line as an override entry (that caused the t/3440 gate red).
  hono: ">=4.13.5 <5"
  morgan: ">=1.12.1 <2"
  joi: ">=18.2.6 <19"
  # Security bumps (Dependabot #354-#406, 2026-10-02). Raised in place above for axios (1.20.0),
  # brace-expansion (5.0.12), js-yaml (5.4.1), image-size (2.0.3), fast-uri (3.1.8), morgan (1.12.1)
  # and joi (18.2.6); each graph already sat on that major, so the caps cost no major jump. undici
  # is a SELECTOR override because 6.x, 7.x and 8.x coexist and only the 7.x line is affected (<7.29.1);
  # a plain key would collapse every consumer onto one major. Colon-space-free per t/3440.
  "@grpc/grpc-js": ">=1.14.5 <2"
  moment: ">=2.31.0 <3"
  "undici@>=7.0.0 <7.29.1": ">=7.29.1 <7.30"
  # http-cache-semantics closes GHSA-ch52-4w7c-c8xp (HIGH, max-stale cross-user cache disclosure,
  # vulnerable <=4.2.0; Dependabot #407/#408, t/3903). 4.3.0 (2026-10-04) is the first release past the
  # range even though the advisory lists no patched version yet. Capped to the 4.3 line per policy.
  http-cache-semantics: ">=4.3.0 <4.4.0"

allowBuilds:
  '@google/genai': true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
