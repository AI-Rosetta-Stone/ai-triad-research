appId: com.berkmanklein.ai-triad.taxonomy-editor
productName: AI Triad Taxonomy Editor
copyright: Copyright (c) 2026 Jeffrey Snover

directories:
  output: release/
  buildResources: build/

files:
  - dist/**/*
  - "!dist/**/*.map"
  # Belt-and-suspenders: never bundle Orca overlay artifacts (.orca/activity/
  # activity-hook.js et al.). Already safe by construction — files: only pulls
  # dist/**/*, and .orca/ lives in src/ and is never imported into dist/ — but
  # this makes the exclusion explicit and auditable. (t/2543, sec L7)
  - "!**/.orca/**"
  - node_modules/**/*
  - package.json

asarUnpack:
  - "node_modules/node-pty/**"
  # worker_threads.Worker() cannot load scripts from inside an asar archive — Electron's
  # asar layer patches fs/require but NOT the worker URL loader (t/3184 C4 exit criterion).
  # The embedding worker's transitive import closure spans lib/embeddings/, lib/debate/
  # (ActionableError), and lib/flight-recorder/ — unpack the whole lib/ tree so every
  # import the worker resolves at runtime is available outside the asar.
  - "dist/main/lib/**"
  # onnxruntime-node is auto-unpacked by electron-builder (native .node binary), but its
  # pure-JS peer dep onnxruntime-common stays inside the asar. Workers can't reach inside
  # the asar, so unpack the whole onnxruntime-* family explicitly.
  - "node_modules/onnxruntime-*/**"

extraResources:
  - from: "../ai-models.json"
    to: "ai-models.json"
  # t/585 (t/572): the shared legacy-chunk manifest (spec 6.2). fileIO reads it from PROJECT_ROOT/docs/specs/,
  # which is the resources dir in a packaged app; without it no legacy chunks are folded (WARN).
  - from: "../docs/specs/source-identity-legacy-chunks.json"
    to: "docs/specs/source-identity-legacy-chunks.json"
  - from: "../taxonomy/schemas/"
    to: "taxonomy/schemas/"
  - from: "THIRD-PARTY-NOTICES.txt"
    to: "THIRD-PARTY-NOTICES.txt"

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.education
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  x64ArchFiles: "**/onnxruntime-node/bin/**"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  icon: build/icons/

publish: null
